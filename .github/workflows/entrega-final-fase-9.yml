name: Revisión final Fase 9

on:
  pull_request:
    branches:
      - main
    paths:
      - 'js/admin/importacion-admin.js'
      - 'js/core/store/normalizacion-importacion.mjs'
      - 'js/quality/calidad-interfaz.js'
      - 'tests/import/phase9-import-normalization.test.mjs'
      - 'scripts/auditar-control-tienda.js'
      - 'scripts/auditar-final-entrega.js'
      - 'scripts/construir-manifiesto-diagnostico.js'
      - 'package.json'
      - '.firebaserc'
      - 'firebase.json'
      - 'firestore.rules'
      - 'docs/respaldo-recuperacion.md'
      - 'docs/entrega-final-fase-9.md'
      - '.github/workflows/entrega-final-fase-9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configurar Java para Firestore
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar herramientas
        run: npm install
      - name: Revisar sintaxis de Fase 9
        run: |
          node --check js/admin/importacion-admin.js
          node --check js/core/store/normalizacion-importacion.mjs
          node --check js/quality/calidad-interfaz.js
          node --check scripts/auditar-control-tienda.js
          node --check scripts/auditar-final-entrega.js
          node --check scripts/construir-manifiesto-diagnostico.js
      - name: Probar normalización de importaciones
        run: npm run test:phase9-import
      - name: Auditar base del sitio
        run: npm run audit:tintin
      - name: Auditar cierre global
        run: npm run audit:store-gate
      - name: Auditar pedidos
        run: npm run audit:secure-orders
      - name: Auditar correos
        run: npm run audit:emails
      - name: Auditar colecciones
        run: npm run audit:collections
      - name: Auditar imágenes
        run: npm run audit:images
      - name: Auditar contenido
        run: npm run audit:content
      - name: Auditar carrito
        run: npm run audit:cart
      - name: Auditar usuarios y permisos
        run: npm run audit:security
      - name: Auditar cierre de despliegue
        run: npm run audit:release
      - name: Compilar reglas de Firestore
        run: npx firebase emulators:exec --only firestore --project demo-tintin "echo Reglas compiladas"
