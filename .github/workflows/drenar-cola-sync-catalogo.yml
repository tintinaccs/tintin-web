name: Operación — sincronización catálogo a Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: drenar-cola-sync-catalogo
  cancel-in-progress: false

jobs:
  drenar:
    name: Procesar cola con límite, backoff y dead-letter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drenar catalogSheetSyncQueue
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SHEETS_ENGAGEMENT_SECRET: ${{ secrets.SHEETS_ENGAGEMENT_SECRET }}
        run: node scripts/drenar-cola-sync-catalogo.mjs
