name: Build generated PR471

on:
  push:
    branches:
      - fix/realtime-notifications-responsive-shell

permissions:
  contents: write

jobs:
  build-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/realtime-notifications-responsive-shell
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate deterministic build artifacts
        run: npm run build:pages
      - name: Commit generated drift only
        run: |
          if git diff --quiet; then
            echo "No generated drift."
            exit 0
          fi
          echo "Generated files:"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(build): sincronizar artefactos generados"
          git push origin HEAD:fix/realtime-notifications-responsive-shell
