name: Validar Estudio de Código

on:
  pull_request:
    paths:
      - '.env.example'
      - '_routes.json'
      - 'functions/admin.js'
      - 'functions/api/code-studio/**'
      - 'cloudflare/estudio-codigo-*.js'
      - 'cloudflare/inyectar-estudio-codigo-admin.js'
      - 'js/admin/estudio-codigo/**'
      - 'css/admin/estudio-codigo.css'
      - 'scripts/sincronizar-monaco-local.mjs'
      - 'scripts/construir-manifiesto-diagnostico.js'
      - 'scripts/auditar-tipografia.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/code-studio/**'
      - '.github/workflows/validar-estudio-codigo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Pruebas propias del Estudio de Código
        run: node --test tests/code-studio/*.test.mjs

      - name: Monaco privado disponible sin CDN
        run: npm run sync:monaco && test -f js/vendor/monaco/vs/loader.js

      - name: Convenciones de nombres
        run: npm run audit:names

      - name: Contrato de rutas
        run: npm run verify:routes

      - name: CSP existente sin debilitamiento
        run: npm run verify:csp

      - name: Seguridad global relevante
        run: npm run audit:security

      - name: Fundamentos del panel Admin
        run: npm run audit:admin-foundation

      - name: Regresión del Editor visual seguro
        run: npm run test:visual-builder
