name: Auditoría visual Parte 2B

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-part2b-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  home:
    name: Inicio completo en 7 pantallas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --package-lock=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit complete home page
        id: home_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf artifacts/home-part2b-all
          mkdir -p artifacts/home-part2b-all
          : > home-part2b.log
          status=0

          viewports=(m360 m390 m430 t768 t1024 d1280 d1440)
          for viewport in "${viewports[@]}"; do
            echo "===== Auditando ${viewport} =====" | tee -a home-part2b.log
            viewport_log="home-part2b-${viewport}.log"

            if timeout --signal=TERM --kill-after=10s 90s env TT_AUDIT_VIEWPORTS="${viewport}" \
              node scripts/auditar-inicio-visual-parte-2b-v3.mjs 2>&1 | tee "${viewport_log}"; then
              echo "OK — ${viewport}" | tee -a home-part2b.log
            else
              code=$?
              status=1
              if [ "${code}" -eq 124 ] || [ "${code}" -eq 137 ]; then
                echo "ERROR — ${viewport}: auditoría excedió 90 segundos" | tee -a home-part2b.log
              else
                echo "ERROR — ${viewport}: auditoría terminó con código ${code}" | tee -a home-part2b.log
              fi
            fi

            cat "${viewport_log}" >> home-part2b.log || true
            mkdir -p "artifacts/home-part2b-all/${viewport}"
            if [ -d artifacts/home-part2b ]; then
              cp -R artifacts/home-part2b/. "artifacts/home-part2b-all/${viewport}/"
            fi
            echo | tee -a home-part2b.log
          done

          exit "${status}"

      - name: Upload home report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: home-part2b-report
          path: |
            home-part2b.log
            home-part2b-*.log
            artifacts/home-part2b-all
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce home visual audit
        run: |
          cat home-part2b.log
          test "${{ steps.home_audit.outcome }}" = "success"
