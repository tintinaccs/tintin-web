name: Temporary regenerate CSP after checkout phone fix

on:
  push:
    branches:
      - fix/checkout-phone-csp-hashes

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-phone-csp-hashes
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate route CSP hashes
        shell: bash
        run: |
          node scripts/generar-csp-cloudflare.js
          node scripts/generar-csp-cloudflare.js --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-regenerate-csp-phone-fix.yml
          git add _headers
          git commit -m "Regenerate CSP hashes after checkout cache update"
          git push origin HEAD:fix/checkout-phone-csp-hashes
