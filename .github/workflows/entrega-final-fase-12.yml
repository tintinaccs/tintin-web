name: Fase 12 — Validación final y entrega

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'functions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'manifest.json'
      - '.github/workflows/entrega-final-fase-12.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'functions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'manifest.json'
      - '.github/workflows/entrega-final-fase-12.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Regenerar manifiesto diagnóstico
        shell: bash
        run: |
          npm run build:diagnostics
          mkdir -p artifacts
          cp diagnostic-manifest.json artifacts/diagnostic-manifest.json

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Auditoría integral de las fases anteriores
        run: npm run audit:final

      - name: Cierre estático de la Fase 12
        run: node scripts/auditar-fase-12-entrega.mjs

      - name: Reglas críticas de Firestore en emulador
        run: npm run test:rules-critical

      - name: Un teléfono, una cuenta (emulador)
        run: npm run test:rules-phone

      - name: Smoke de las 18 páginas
        run: npm run test:pages

      - name: Servir el árbol exacto de la PR
        shell: bash
        run: |
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tintin-phase12-http.log 2>&1 &
          echo $! > /tmp/tintin-phase12-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tintin-phase12-http.log || true
          exit 1

      - name: Flujos UI de la Fase 8 en Chromium
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          npm run test:phase8-ui 2>&1 | tee artifacts/phase8-ui.log

      - name: Accesibilidad de la Fase 10 en Chromium
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          npm run test:phase10-a11y 2>&1 | tee artifacts/phase10-accessibility.log

      - name: SEO dinámico de la Fase 11 en Chromium
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          npm run test:phase11-seo 2>&1 | tee artifacts/phase11-seo.log

      - name: Matriz responsive canónica
        run: npm run audit:canonical-viewports

      - name: Dependencias usadas en producción
        run: npm audit --omit=dev --audit-level=critical

      - name: Registrar auditoría completa de herramientas
        shell: bash
        run: npm audit --json > artifacts/npm-audit-full.json || true

      - name: Smoke real de producción
        run: node scripts/produccion-smoke-fase-12.mjs

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase12-final-evidence
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            /tmp/tintin-phase12-http.log
          if-no-files-found: warn
          retention-days: 30
