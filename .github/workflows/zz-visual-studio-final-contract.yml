name: Cerrar contrato Visual Studio global

on:
  push:
    branches:
      - feat/apariencia-visual-studio-v2
    paths:
      - .github/workflows/zz-visual-studio-final-contract.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Aplicar contrato de enlaces opcionales y versionado final
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const OLD = 'tintin-20260810-global-studio-3';
          const NEXT = 'tintin-20260810-global-studio-4';

          function read(rel) { return fs.readFileSync(path.join(root, rel), 'utf8'); }
          function write(rel, source) { fs.writeFileSync(path.join(root, rel), source, 'utf8'); }
          function replaceRequired(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`No se encontró ${label || from}`);
            return source.split(from).join(to);
          }

          // 1) Mantener safeVisualHref compatible para todo el constructor,
          // pero permitir que consumidores explícitos pidan fallback vacío.
          {
            const rel = 'cloudflare/visual-builder-core.js';
            let source = read(rel);
            source = replaceRequired(
              source,
              'export function safeVisualHref(value) {',
              "export function safeVisualHref(value, fallback = 'catalogo.html') {",
              'firma safeVisualHref'
            );
            const anchor = "  if (/^https:\\/\\/[A-Za-z0-9.-]+(?::\\d+)?(?:\\/[A-Za-z0-9_~:/?#\\[\\]@!$&'()*+,;=%.-]*)?$/i.test(href)) return href;\n  return 'catalogo.html';";
            const replacement = "  if (/^https:\\/\\/[A-Za-z0-9.-]+(?::\\d+)?(?:\\/[A-Za-z0-9_~:/?#\\[\\]@!$&'()*+,;=%.-]*)?$/i.test(href)) return href;\n  return fallback;";
            source = replaceRequired(source, anchor, replacement, 'fallback safeVisualHref');
            write(rel, source);
          }

          // 2) En campañas/pop-ups globales, un enlace vacío o inválido se
          // elimina. Nunca se inventa catalogo.html silenciosamente.
          {
            const rel = 'cloudflare/visual-studio-global-core.js';
            let source = read(rel);
            const count = (source.match(/href: safeVisualHref\(raw\.href\),/g) || []).length;
            if (count !== 2) throw new Error(`Se esperaban 2 href globales y se encontraron ${count}`);
            source = source.replaceAll('href: safeVisualHref(raw.href),', "href: safeVisualHref(raw.href, ''),");
            write(rel, source);
          }

          // 3) Runtime: CSS público alineado con la última versión real y CTA
          // solo cuando existe texto + destino válido.
          {
            const rel = 'js/core/store/visual-studio-global-runtime.js';
            let source = read(rel);
            source = source.replace(/const GLOBAL_RUNTIME_VERSION = '[^']+';/, `const GLOBAL_RUNTIME_VERSION = '${OLD}';`);
            source = replaceRequired(
              source,
              "  if (popup.buttonLabel) { const action = make('a', 'tt-global-popup-action', popup.buttonLabel); action.href = popup.href || 'catalogo.html'; panel.appendChild(action); }",
              "  if (popup.buttonLabel && popup.href) { const action = make('a', 'tt-global-popup-action', popup.buttonLabel); action.href = popup.href; panel.appendChild(action); }",
              'CTA de popup'
            );
            write(rel, source);
          }

          // 4) Admin: una campaña nueva nace sin enlace; el campo explica que
          // es opcional. Los pop-ups siguen ofreciendo un CTA útil por defecto.
          {
            const rel = 'js/admin/appearance/visual-studio-global-admin.js';
            let source = read(rel);
            source = replaceRequired(source, "announcement:preset.announcement||'',href:'catalogo.html',closable:true", "announcement:preset.announcement||'',href:'',closable:true", 'href por defecto de campaña');
            source = source.replaceAll(
              "field('Enlace',bind(input(item.href,'url'),v=>item.href=v),true)",
              "field('Enlace',bind(input(item.href,'url'),v=>item.href=v),true,'Opcional. Si lo dejás vacío, el aviso se muestra sin enlace.')"
            );
            write(rel, source);
          }

          // 5) Tests: enlaces globales inválidos/vacíos se eliminan, mientras
          // safeVisualHref conserva su fallback histórico fuera de este módulo.
          {
            const rel = 'tests/visual-builder/visual-studio-global-core.test.mjs';
            let source = read(rel);
            source = source.replaceAll("assert.equal(popup.href, 'catalogo.html');", "assert.equal(popup.href, '');");
            source = source.replaceAll("assert.equal(campaign.href, 'catalogo.html');", "assert.equal(campaign.href, '');");
            const marker = "test('segmentación global reconoce páginas comerciales además de páginas de contenido', () => {";
            if (!source.includes("enlaces opcionales no inventan destinos")) {
              source = source.replace(marker, `test('enlaces opcionales no inventan destinos', () => {\n  assert.equal(sanitizeGlobalCampaign({ href: '' }).href, '');\n  assert.equal(sanitizeGlobalPopup({ href: '' }).href, '');\n  assert.equal(sanitizeGlobalCampaign({ href: 'catalogo.html' }).href, 'catalogo.html');\n  assert.equal(sanitizeGlobalPopup({ href: 'https://tintinaccs.com' }).href, 'https://tintinaccs.com');\n});\n\n${marker}`);
            }
            write(rel, source);
          }

          // 6) Propagar solo versiones de JS cuyo contenido sí cambió.
          const replacements = [
            [`js/inicio-navegacion-publica.js?v=${OLD}`, `js/inicio-navegacion-publica.js?v=${NEXT}`],
            [`js/components/navigation/entrada-navegacion-publica.js?v=${OLD}`, `js/components/navigation/entrada-navegacion-publica.js?v=${NEXT}`],
            [`visual-studio-global-runtime.js?v=${OLD}`, `visual-studio-global-runtime.js?v=${NEXT}`],
            [`visual-studio-global-admin.js?v=${OLD}`, `visual-studio-global-admin.js?v=${NEXT}`],
            [`esquema-color-admin.js?v=${OLD}`, `esquema-color-admin.js?v=${NEXT}`],
          ];

          function updateConsumer(rel) {
            const abs = path.join(root, rel);
            if (!fs.existsSync(abs)) return;
            let source = fs.readFileSync(abs, 'utf8');
            const before = source;
            for (const [from, to] of replacements) source = source.split(from).join(to);
            if (rel === 'js/inicio-navegacion-publica.js') {
              source = source.replace(/const MODULE_VERSION = '[^']+';/, `const MODULE_VERSION = '${NEXT}';`);
            }
            if (source !== before) fs.writeFileSync(abs, source, 'utf8');
          }

          for (const file of fs.readdirSync(root).filter(name => name.endsWith('.html'))) updateConsumer(file);
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const abs = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(abs);
              else if (/\.(?:js|mjs)$/.test(entry.name)) updateConsumer(path.relative(root, abs));
            }
          }
          walk(path.join(root, 'js'));

          const syncRel = 'scripts/sincronizar-inicio-navegacion-publica.js';
          let sync = read(syncRel);
          sync = sync.replace(/const PUBLIC_SHELL_VERSION = '[^']+';/, `const PUBLIC_SHELL_VERSION = '${NEXT}';`);
          sync = sync.replace(/const NAV_ENTRY_VERSION = '[^']+';/, `const NAV_ENTRY_VERSION = '${NEXT}';`);
          write(syncRel, sync);
          NODE

      - name: Instalar dependencias y validar contrato
        run: |
          npm ci
          node --check js/core/store/visual-studio-global-runtime.js
          node --check js/admin/appearance/visual-studio-global-admin.js
          node --test tests/visual-builder/visual-studio-global-core.test.mjs
          node scripts/auditar-tipografia.js

      - name: Regenerar y verificar cache inmutable
        run: |
          node scripts/auditar-versionado-cache.mjs --write
          node scripts/auditar-versionado-cache.mjs

      - name: Autoeliminar workflow temporal y publicar cierre
        shell: bash
        run: |
          rm .github/workflows/zz-visual-studio-final-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(visual-studio): respetar CTAs opcionales y cerrar caché global"
          git push origin "HEAD:${GITHUB_REF_NAME}"
