name: Refresh diagnostic manifest for cloud agent changes
on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'scripts/agent/**'
      - 'docs/agent/CLOUD_SKILLS_CATALOG.md'
      - '.github/workflows/refresh-cloud-skills-manifest.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical diagnostic manifest
        run: node scripts/construir-manifiesto-diagnostico.js
      - name: Commit generated artifact when needed
        run: |
          if git diff --quiet -- diagnostic-manifest.json; then
            echo 'Manifest already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostic-manifest.json
          git commit -m 'chore: sync diagnostic manifest for cloud skills'
          git push origin 'HEAD:${{ github.event.pull_request.head.ref }}'
