name: Lanzar Diagnóstico Maestro

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lanzar-diagnostico-maestro.yml
      - .github/workflows/diagnostico-maestro.yml
      - .github/workflows/auditar-diagnostico.yml
      - scripts/ejecutar-diagnostico-maestro.mjs
      - scripts/verificar-salud-ci-global.mjs
      - functions/api/master-diagnostics.js
      - functions/admin.js
      - 'functions/[page].js'
      - cloudflare/inyectar-diagnostico-maestro-admin.js
      - js/admin/diagnostics/**
      - css/admin/diagnostico-maestro.css
      - '*.html'
      - diagnostic-manifest.json
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Disparar auditoría global
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Diagnóstico Maestro sobre main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run diagnostico-maestro.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f production_origin=https://tintinaccesorios.pages.dev \
            -f include_production=true
