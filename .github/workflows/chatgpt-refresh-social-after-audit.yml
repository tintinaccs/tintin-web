name: ChatGPT refresh social audit artifacts

on:
  push:
    branches:
      - chatgpt/social-commerce-notifications-v1

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[audit-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remove temporary workflow
        run: git rm .github/workflows/chatgpt-refresh-social-after-audit.yml
      - name: Regenerate derived files
        run: |
          npm run cache-versioning:write
          npm run build:pages
          npm run audit:emails
          npm run audit:cache-versioning
      - name: Commit refreshed tree
        run: |
          git add -A
          git config user.name "tintin-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(social): refresh audit artifacts [audit-refreshed]"
          git push origin HEAD:${GITHUB_REF_NAME}
