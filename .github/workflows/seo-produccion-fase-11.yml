name: Fase 11 — SEO, publicación y producción

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'tienda.js'
      - 'js/**'
      - 'manifest.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/auditar-fase-11-seo.js'
      - 'scripts/auditar-produccion-salud.mjs'
      - 'tests/seo/**'
      - 'package.json'
      - '.github/workflows/seo-produccion-fase-11.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  seo-contracts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run audit:phase11
      - run: npm run test:phase11-seo

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run monitor:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase11-production-health
          path: artifacts/phase11-production-health.json
          if-no-files-found: warn
          retention-days: 30
