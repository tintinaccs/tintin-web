name: Fase 11 — SEO, publicación y producción

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'tienda.js'
      - 'js/**'
      - 'config/**'
      - 'functions/product.js'
      - 'functions/sitemap-products.xml.js'
      - 'functions/api/health.js'
      - 'functions/api/public-catalog.js'
      - '_headers'
      - '_routes.json'
      - 'manifest.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/auditar-fase-11-seo.js'
      - 'scripts/auditar-produccion-salud.mjs'
      - 'scripts/sincronizar-origen-publico.mjs'
      - 'scripts/normalizar-rutas-publicas.mjs'
      - 'scripts/servidor-local-pruebas.mjs'
      - 'tests/seo/**'
      - 'package.json'
      - '.github/workflows/seo-produccion-fase-11.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  seo-contracts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar origen y rutas públicas
        run: |
          npm run verify:public-origin
          npm run audit:public-routes
      - name: Verificar CSP reproducible
        run: npm run verify:csp
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Auditar contratos SEO estáticos
        run: npm run audit:phase11
      - name: Servir el árbol exacto evaluado
        shell: bash
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-phase11-http.log 2>&1 &
          echo $! > /tmp/tintin-phase11-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tintin-phase11-http.log || true
          exit 1
      - name: Probar SEO dinámico del mismo commit
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:phase11-seo

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run monitor:production
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase11-production-health
          path: artifacts/phase11-production-health.json
          if-no-files-found: warn
          retention-days: 30
