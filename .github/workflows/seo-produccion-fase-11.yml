name: Fase 11 — SEO, publicación y producción

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'tienda.js'
      - 'js/**'
      - 'functions/**'
      - '_headers'
      - '_routes.json'
      - 'manifest.json'
      - 'robots.txt'
      - 'sitemap*.xml'
      - 'scripts/normalizar-rutas-publicas.js'
      - 'scripts/generar-csp-cloudflare.js'
      - 'scripts/auditar-cloudflare-entrega-real.mjs'
      - 'scripts/auditar-fase-11-seo.js'
      - 'scripts/auditar-produccion-salud.mjs'
      - 'scripts/servidor-local-pruebas.mjs'
      - 'tests/seo/**'
      - 'package.json'
      - '.github/workflows/seo-produccion-fase-11.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  seo-contracts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalizar rutas que Cloudflare debe publicar
        run: npm run build:routes
      - name: Regenerar CSP que Cloudflare debe publicar
        run: npm run build:csp
      - name: Verificar rutas y CSP reproducibles
        run: npm run verify:routes && npm run verify:csp
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Auditar contratos SEO estáticos
        run: npm run audit:phase11
      - name: Servir el árbol exacto evaluado
        shell: bash
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-phase11-http.log 2>&1 &
          echo $! > /tmp/tintin-phase11-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tintin-phase11-http.log || true
          exit 1
      - name: Probar SEO dinámico del mismo commit
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:phase11-seo

  cloudflare-delivered-headers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar contrato exacto del artefacto público
        run: npm run build:routes && npm run build:csp && npm run verify:routes && npm run verify:csp
      - name: Comparar contra el preview real de Cloudflare
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          TINTIN_CLOUDFLARE_GATE_ATTEMPTS: 90
          TINTIN_CLOUDFLARE_GATE_POLL_MS: 10000
        run: node scripts/auditar-cloudflare-entrega-real.mjs

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Monitorear producción
        id: production_monitor
        continue-on-error: true
        run: npm run monitor:production
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase11-production-health
          path: artifacts/phase11-production-health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Abrir o actualizar alerta visible si producción falla
        if: steps.production_monitor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title='[Producción] Monitor horario en rojo'
          issue="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[0].number // empty')"
          body="El monitor automático de producción falló el $(date -u +'%Y-%m-%d %H:%M UTC').\n\nRun: $RUN_URL\n\nRevisar el artefacto phase11-production-health antes de desplegar o anunciar cambios."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Cerrar alerta cuando producción se recupera
        if: steps.production_monitor.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title='[Producción] Monitor horario en rojo'
          issue="$(gh issue list --state open --search \"$title in:title\" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Producción volvió a pasar el monitor automático. Run: $RUN_URL"
            gh issue close "$issue" --reason completed
          fi
      - name: Hacer fallar el run si producción sigue en rojo
        run: test "${{ steps.production_monitor.outcome }}" = "success"
