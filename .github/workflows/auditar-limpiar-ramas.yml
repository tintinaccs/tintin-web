name: Mantenimiento — ramas

on:
  schedule:
    - cron: '45 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Acción a ejecutar
        required: true
        default: audit
        type: choice
        options: [audit, delete]
      confirmation:
        description: Para eliminar, escribir ELIMINAR_SOLO_RAMAS_SEGURAS
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: limpieza-ramas-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit')
    name: Clasificar ramas sin borrar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/branches/auditar-limpiar-ramas.test.mjs
      - name: Auditar ramas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_CLEANUP_MODE: audit
          BRANCH_CLEANUP_CONFIRMATION: ''
          BRANCH_AUDIT_REQUIRE_ZERO_REVIEW: 'false'
        run: node scripts/auditar-limpiar-ramas.mjs
      - if: always()
        run: test ! -f branch-audit.md || cat branch-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: auditoria-ramas-${{ github.run_id }}
          path: |
            branch-audit.json
            branch-audit.md
          retention-days: 30
          if-no-files-found: error

  delete:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'delete'
    name: Eliminar solo ramas verificadas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/branches/auditar-limpiar-ramas.test.mjs
      - name: Eliminar ramas seguras
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_CLEANUP_MODE: delete
          BRANCH_CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
          BRANCH_AUDIT_REQUIRE_ZERO_REVIEW: 'true'
        run: node scripts/auditar-limpiar-ramas.mjs
