name: Editor visual seguro

on:
  push:
    branches:
      - feature/tintin-visual-builder
  pull_request:
    branches:
      - main
    paths:
      - admin.html
      - css/admin/**
      - css/components/editor-visual-runtime.css
      - css/components/visual-studio-global-runtime.css
      - js/admin/appearance/**
      - js/core/store/editor-visual-**
      - js/core/store/visual-studio-**
      - js/visual-builder-bootstrap.js
      - js/inicio-navegacion-publica.js
      - js/components/navigation/entrada-navegacion-publica.js
      - cloudflare/visual-builder-core.js
      - cloudflare/visual-studio-global-core.js
      - functions/api/visual-builder*.js
      - functions/api/visual-studio-global*.js
      - firestore.rules
      - tests/visual-builder/**
      - package.json
      - package-lock.json
      - .github/workflows/validar-editor-visual-seguro.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Núcleo, regresión y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*/*.test.mjs
      - run: npm run audit:final
      - run: npm run build:pages

  ui:
    name: Responsive, accesibilidad y rendimiento
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual-builder-ui
      - run: npx playwright test tests/visual-builder/visual-studio-v2-runtime.spec.js --project=chromium
      - run: npm run test:ai-builder-ui
      - run: npm run test:phase10-a11y
      - name: Servir el árbol exacto de la PR para rendimiento
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-visual-performance-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tintin-visual-performance-http.log
          exit 1
      - name: Medir rendimiento sobre la PR
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
        run: npm run test:performance

  firestore-rules:
    name: Permisos y reglas de Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules-critical
