name: Aplicar correcciones Fase 6

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Aplicar, probar y consolidar seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar correcciones
        run: node scripts/apply-phase6-fixes.mjs

      - name: Revisar sintaxis
        run: |
          node --check scripts/audit-phase6-security.js
          node --check scripts/test-firestore-critical.mjs
          cp apps-script/Phase4CreateOrder.gs /tmp/Phase4CreateOrder.js
          node --check /tmp/Phase4CreateOrder.js

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar Fase 6
        run: npm run audit:phase6

      - name: Ejecutar ataques contra Firestore Rules
        run: npm run test:rules-critical

      - name: Ejecutar auditoría integral
        run: npm run audit:final

      - name: Regenerar diagnóstico
        run: npm run build:pages

      - name: Preparar commit validado
        run: |
          rm -f scripts/apply-phase6-fixes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: completar Firestore y seguridad de la Fase 6"
          git push origin HEAD:${GITHUB_HEAD_REF}
