name: Publicar reglas Firestore

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribir PUBLICAR_REGLAS para publicar solo firestore.rules
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'PUBLICAR_REGLAS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-rules
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Google Cloud authentication configuration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] && { [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -z "$GCP_SERVICE_ACCOUNT" ]; }; then
            exit 0
          fi
          if [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_SERVICE_ACCOUNT" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            exit 0
          fi
          echo "Configura exactamente una credencial: FIREBASE_SERVICE_ACCOUNT_JSON o el par GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT." >&2
          exit 1

      - name: Authenticate with service account JSON
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'

      - name: Authenticate with Workload Identity Federation
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON == '' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Verify Firebase identity
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify active identity
        run: gcloud --quiet auth list --filter=status:ACTIVE --format='value(account)' | grep -q .

      - name: Publish only Firestore rules
        run: npm run deploy:rules
