name: Corregir cierre SEO y smoke temporal

on:
  push:
    branches:
      - chatgpt/production-surgical-hardening

permissions:
  contents: write

concurrency:
  group: corregir-cierre-seo-smoke-temporal
  cancel-in-progress: false

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[seo-smoke-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/production-surgical-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Corregir URLs canónicas y mocks locales
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, from, to) {
            const original = fs.readFileSync(file, 'utf8');
            if (!original.includes(from)) {
              throw new Error(`No se encontró el patrón esperado en ${file}: ${from}`);
            }
            const updated = original.replace(from, to);
            fs.writeFileSync(file, updated);
            console.log(`OK — ${file}`);
          }

          replaceOnce(
            'js/pages/home/mantenimiento-inicio.js',
            "    const homeUrl = new URL('index.html', base).href;",
            '    const homeUrl = base;'
          );

          replaceOnce(
            'js/pages/product/mantenimiento-producto.js',
            "    const current = new URL('product.html', base);",
            "    const current = new URL('product', base);"
          );

          replaceOnce(
            'tienda.js',
            "  const canonicalProductUrl = new URL('/product.html', 'https://tintinaccesorios.pages.dev');",
            "  const canonicalProductUrl = new URL('/product', 'https://tintinaccesorios.pages.dev');"
          );

          replaceOnce(
            'tienda.js',
            '// Canonical/OG/Twitter tags default to the generic product.html?id= URL and',
            '// Canonical/OG/Twitter tags usan la URL pública limpia /product?id= y'
          );

          const smokeMock = `  if (pathname === '/api/public-catalog') {\n    const resource = new URL(request.url || '/', baseURL).searchParams.get('resource');\n    if (!['products', 'collections'].includes(resource)) {\n      response.writeHead(400, { 'cache-control': 'no-store', 'content-type': 'application/json; charset=utf-8' });\n      response.end('{"ok":false,"error":"resource_invalid"}');\n      return;\n    }\n    response.writeHead(200, { 'cache-control': 'no-store', 'content-type': 'application/json; charset=utf-8', 'x-tintin-cache': 'test' });\n    response.end(JSON.stringify({ ok: true, resource, items: [], count: 0 }));\n    return;\n  }\n`;
          replaceOnce(
            'scripts/smoke-todas-paginas.mjs',
            "  if (pathname === '/api/visual-builder-public') {",
            smokeMock + "  if (pathname === '/api/visual-builder-public') {"
          );

          const localServerMock = `  if (url.pathname === '/api/public-catalog') {\n    const resource = url.searchParams.get('resource');\n    if (!['products', 'collections'].includes(resource)) {\n      response.writeHead(400, { 'cache-control': 'no-store', 'content-type': 'application/json; charset=utf-8' });\n      response.end('{"ok":false,"error":"resource_invalid"}');\n      return;\n    }\n    response.writeHead(200, { 'cache-control': 'no-store', 'content-type': 'application/json; charset=utf-8', 'x-tintin-cache': 'test' });\n    response.end(JSON.stringify({ ok: true, resource, items: [], count: 0 }));\n    return;\n  }\n`;
          replaceOnce(
            'scripts/servidor-local-pruebas.mjs',
            "  if (url.pathname === '/api/visual-builder-public') {",
            localServerMock + "  if (url.pathname === '/api/visual-builder-public') {"
          );

          const forbidden = [
            ["js/pages/home/mantenimiento-inicio.js", "new URL('index.html', base).href"],
            ["js/pages/product/mantenimiento-producto.js", "new URL('product.html', base)"],
            ['tienda.js', "new URL('/product.html', 'https://tintinaccesorios.pages.dev')"]
          ];
          for (const [file, text] of forbidden) {
            if (fs.readFileSync(file, 'utf8').includes(text)) {
              throw new Error(`Regresión SEO aún presente en ${file}: ${text}`);
            }
          }
          NODE

      - name: Instalar dependencias
        run: npm ci

      - name: Regenerar caché y manifiestos
        run: |
          npm run cache-versioning:write
          npm run build:pages

      - name: Validar contratos estáticos
        run: |
          npm run audit:phase11
          node scripts/auditar-nivel-3-calidad.js
          npm run audit:final

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke de todas las páginas
        run: npm run test:pages

      - name: Servir árbol corregido
        shell: bash
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-seo-local.log 2>&1 &
          echo $! > /tmp/tintin-seo-local.pid
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tintin-seo-local.log || true
          exit 1

      - name: SEO dinámico contra el mismo árbol
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:phase11-seo

      - name: Confirmar que no se degradó producción
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit de la corrección validada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/corregir-cierre-seo-smoke-temporal.yml
          if git diff --cached --quiet; then
            echo 'No hay cambios que guardar.'
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'ERROR: el commit generado intenta modificar workflows.'
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "fix: cerrar SEO y smoke local [seo-smoke-fixed]"
          git push origin HEAD:chatgpt/production-surgical-hardening
