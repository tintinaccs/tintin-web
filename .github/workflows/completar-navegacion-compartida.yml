name: Completar nombres compartidos de navegación

on:
  push:
    branches:
      - orden/navegacion-compartida-completa-espanol

permissions:
  contents: write

jobs:
  reorganizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Completar renombres y referencias
        shell: bash
        run: |
          set -euo pipefail
          node scripts/completar-navegacion-compartida-temporal.js
          node scripts/build-diagnostic-manifest.js
          node scripts/audit-modular-architecture.js
          node scripts/audit-public-shell.js
          node scripts/audit-page-loading.js

      - name: Guardar bloque completo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: completar nombres compartidos de navegación en español"
          git push origin HEAD
