name: Reconciliar fast navigation v2 temporal

on:
  push:
    branches:
      - perf/navegacion-inmediata-v2-20260810
    paths:
      - '.github/workflows/reconciliar-fast-nav-v2-temporal.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/navegacion-inmediata-v2-20260810
          fetch-depth: 0

      - name: Traer únicamente auditorías de rendimiento ya validadas
        run: |
          git fetch origin perf/navegacion-inmediata-20260810:refs/remotes/origin/perf/navegacion-inmediata-20260810
          for file in \
            scripts/auditar-rendimiento-tiempo-real.js \
            scripts/auditar-rendimiento-regresiones.js \
            scripts/auditar-esquema-color.js \
            tests/performance/navegacion-inmediata.test.mjs \
            .github/workflows/validar-navegacion-inmediata.yml; do
            mkdir -p "$(dirname "$file")"
            git show "origin/perf/navegacion-inmediata-20260810:$file" > "$file"
          done
          sed -i 's/tintin-20260810-fast-nav-1/tintin-20260810-fast-nav-2/g' tests/performance/navegacion-inmediata.test.mjs

      - name: Eliminar esperas artificiales del loader y versionar el shell actual
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader = Path('js/cargador-pagina.js')
          text = loader.read_text(encoding='utf-8')
          replacements = {
              "const TT_CACHE_VERSION = 'tintin-20260809-loader-lifecycle-fix-1';": "const TT_CACHE_VERSION = 'tintin-20260810-fast-nav-2';",
              'const MIN_SHOW_MS = 900;': 'const MIN_SHOW_MS = 120;',
              'if (!enough || !logoReady) {': 'if (!enough) {',
              'window.setTimeout(tryHideElegant, Math.max(wait, 140));': 'window.setTimeout(tryHideElegant, Math.max(wait, 32));',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'No se encontró contrato esperado en cargador-pagina.js: {old}')
              text = text.replace(old, new, 1)
          loader.write_text(text, encoding='utf-8')

          old_instant = 'js/components/color/esquema-color-instantaneo.js?v=tintin-20260716-cloudinary-fix-1'
          new_instant = 'js/components/color/esquema-color-instantaneo.js?v=tintin-20260810-fast-nav-2'
          old_loader = 'js/cargador-pagina.js?v=tintin-20260809-loader-lifecycle-fix-1'
          new_loader = 'js/cargador-pagina.js?v=tintin-20260810-fast-nav-2'

          instant_pages = []
          loader_pages = []
          for path in sorted(Path('.').glob('*.html')):
              html = path.read_text(encoding='utf-8')
              changed = html
              if old_instant in changed:
                  changed = changed.replace(old_instant, new_instant)
                  instant_pages.append(path.name)
              if old_loader in changed:
                  changed = changed.replace(old_loader, new_loader)
                  loader_pages.append(path.name)
              if changed != html:
                  path.write_text(changed, encoding='utf-8')

          if len(instant_pages) != 15:
              raise SystemExit(f'Se esperaban 15 páginas públicas con bootstrap: {len(instant_pages)} {instant_pages}')
          if len(loader_pages) < 17:
              raise SystemExit(f'Se esperaban al menos 17 páginas con loader: {len(loader_pages)} {loader_pages}')
          print('Bootstrap público:', ', '.join(instant_pages))
          print('Loader global:', ', '.join(loader_pages))
          PY

      - name: Validar lógica rápida antes de generar artefactos
        run: |
          npm ci
          node --check js/cargador-pagina.js
          node --check js/components/color/esquema-color-instantaneo.js
          node --test tests/performance/navegacion-inmediata.test.mjs
          node scripts/auditar-rendimiento-tiempo-real.js
          node scripts/auditar-rendimiento-regresiones.js
          node scripts/auditar-esquema-color.js

      - name: Registrar cache, retirar temporal y regenerar derivados
        run: |
          npm run cache-versioning:write
          rm .github/workflows/reconciliar-fast-nav-v2-temporal.yml
          npm run build:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: navegación inmediata sobre Visual Studio v2"
          git push origin HEAD:perf/navegacion-inmediata-v2-20260810
