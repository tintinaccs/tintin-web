name: Reconciliar caché Visual Studio

on:
  push:
    branches:
      - feat/apariencia-visual-studio-v2
    paths:
      - .github/workflows/zz-visual-studio-cache-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Subir únicamente las versiones de archivos que cambiaron
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const PUBLIC_SHELL = 'tintin-20260810-global-studio-2';
          const VISUAL_BUILDER = 'tintin-20260810-visual-studio-v2-2';

          const replacements = [
            ['js/inicio-navegacion-publica.js?v=tintin-20260809-loader-lifecycle-fix-1', `js/inicio-navegacion-publica.js?v=${PUBLIC_SHELL}`],
            ['js/components/navigation/entrada-navegacion-publica.js?v=tintin-20260809-responsive-header-2', `js/components/navigation/entrada-navegacion-publica.js?v=${PUBLIC_SHELL}`],
            ['js/visual-builder-bootstrap.js?v=tintin-20260810-section-reorder-1', `js/visual-builder-bootstrap.js?v=${VISUAL_BUILDER}`],
            ['js/admin/appearance/editor-visual-admin.js?v=tintin-20260810-section-reorder-1', `js/admin/appearance/editor-visual-admin.js?v=${VISUAL_BUILDER}`],
            ['js/admin/settings/esquema-color-admin.js?v=tintin-20260716-cloudinary-fix-1', `js/admin/settings/esquema-color-admin.js?v=${PUBLIC_SHELL}`],
            ['./core/store/editor-visual-runtime.js?v=tintin-20260810-section-reorder-1', `./core/store/editor-visual-runtime.js?v=${VISUAL_BUILDER}`],
          ];

          function update(file) {
            const abs = path.join(root, file);
            if (!fs.existsSync(abs)) return;
            let text = fs.readFileSync(abs, 'utf8');
            const before = text;
            for (const [from, to] of replacements) text = text.split(from).join(to);
            if (file === 'js/inicio-navegacion-publica.js') {
              text = text.replace(/const MODULE_VERSION = '[^']+';/, `const MODULE_VERSION = '${PUBLIC_SHELL}';`);
            }
            if (text !== before) fs.writeFileSync(abs, text, 'utf8');
          }

          for (const file of fs.readdirSync(root).filter(name => name.endsWith('.html'))) update(file);
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const abs = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(abs);
              else if (/\.(?:js|mjs)$/.test(entry.name)) update(path.relative(root, abs));
            }
          }
          walk(path.join(root, 'js'));

          const syncPath = path.join(root, 'scripts/sincronizar-inicio-navegacion-publica.js');
          let sync = fs.readFileSync(syncPath, 'utf8');
          if (!sync.includes('const PUBLIC_SHELL_VERSION')) {
            sync = sync.replace(
              "const VERSION = 'tintin-20260809-loader-lifecycle-fix-1';",
              "const VERSION = 'tintin-20260809-loader-lifecycle-fix-1';\nconst PUBLIC_SHELL_VERSION = 'tintin-20260810-global-studio-2';\nconst NAV_ENTRY_VERSION = 'tintin-20260810-global-studio-2';"
            );
          }
          sync = sync.replace(
            '`<link rel="modulepreload" href="js/components/navigation/entrada-navegacion-publica.js?v=${NAV_SHELL_VERSION}">`',
            '`<link rel="modulepreload" href="js/components/navigation/entrada-navegacion-publica.js?v=${NAV_ENTRY_VERSION}">`'
          );
          sync = sync.replace(
            '  <script src="js/inicio-navegacion-publica.js?v=${VERSION}" defer></script>',
            '  <script src="js/inicio-navegacion-publica.js?v=${PUBLIC_SHELL_VERSION}" defer></script>'
          );
          fs.writeFileSync(syncPath, sync, 'utf8');
          NODE

      - name: Regenerar baseline con los hashes finales reales
        run: |
          node scripts/auditar-versionado-cache.mjs --write
          node scripts/auditar-versionado-cache.mjs

      - name: Autoeliminar workflow temporal y publicar reconciliación
        shell: bash
        run: |
          rm .github/workflows/zz-visual-studio-cache-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No había cambios que reconciliar."
            exit 0
          fi
          git commit -m "chore(visual-studio): reconciliar versiones de caché [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
