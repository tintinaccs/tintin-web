name: Regenerar diagnostico rating temporal

on:
  push:
    branches: [fix/product-review-rating-required]
    paths:
      - '.github/workflows/regenerar-diagnostico-rating-temporal.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/product-review-rating-required
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Quitar workflow temporal
        run: git rm .github/workflows/regenerar-diagnostico-rating-temporal.yml
      - name: Regenerar y validar
        run: |
          npm run build:diagnostics
          node scripts/auditar-versionado-cache.mjs
          node scripts/auditar-puntuacion-resena-producto.mjs
          npm run verify:diagnostics
      - name: Commit limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerar diagnóstico para rating obligatorio"
          git push origin HEAD:fix/product-review-rating-required
