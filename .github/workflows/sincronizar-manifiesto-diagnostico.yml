name: Sincronizar manifiesto diagnóstico

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sincronizar-manifiesto-diagnostico.yml'

permissions:
  contents: write

concurrency:
  group: sync-diagnostic-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerar manifiesto diagnóstico
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama objetivo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Regenerar manifiesto
        run: node scripts/construir-manifiesto-diagnostico.js

      - name: Guardar manifiesto si cambió
        shell: bash
        run: |
          if git diff --quiet -- diagnostic-manifest.json; then
            echo 'El manifiesto ya estaba sincronizado.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostic-manifest.json
          git commit -m 'chore(diagnostics): sincronizar manifiesto generado'
          git push origin HEAD
