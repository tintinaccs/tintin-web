name: Corregir reliability fast navigation temporal

on:
  push:
    branches:
      - perf/navegacion-inmediata-v2-20260810
    paths:
      - '.github/workflows/corregir-reliability-fast-nav-temporal.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/navegacion-inmediata-v2-20260810
          fetch-depth: 0

      - name: Actualizar contrato de versionado crítico
        run: |
          sed -i "s/Los recursos críticos usan una sola versión de caché/Los recursos críticos usan la versión vigente de caché/" scripts/auditar-sitio-confiabilidad.js
          sed -i "s/TT_CACHE_VERSION = 'tintin-20260809-loader-lifecycle-fix-1'/TT_CACHE_VERSION = 'tintin-20260810-fast-nav-2'/" scripts/auditar-sitio-confiabilidad.js
          grep -F "Los recursos críticos usan la versión vigente de caché" scripts/auditar-sitio-confiabilidad.js
          grep -F "TT_CACHE_VERSION = 'tintin-20260810-fast-nav-2'" scripts/auditar-sitio-confiabilidad.js

      - name: Validar confiabilidad y navegación
        run: |
          npm ci
          node scripts/auditar-sitio-confiabilidad.js
          node scripts/auditar-rendimiento-tiempo-real.js
          node scripts/auditar-rendimiento-regresiones.js
          node scripts/auditar-esquema-color.js
          node --test tests/performance/navegacion-inmediata.test.mjs

      - name: Retirar temporal, regenerar y guardar
        run: |
          rm .github/workflows/corregir-reliability-fast-nav-temporal.yml
          npm run build:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(perf): aceptar versionado crítico vigente"
          git push origin HEAD:perf/navegacion-inmediata-v2-20260810
