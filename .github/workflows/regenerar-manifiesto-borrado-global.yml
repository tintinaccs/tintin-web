name: Regenerar manifiesto borrado global

on:
  push:
    branches: [feat/catalog-global-bulk-delete]
    paths:
      - '.github/workflows/regenerar-manifiesto-borrado-global.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/catalog-global-bulk-delete
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Quitar workflow temporal del árbol final
        run: git rm .github/workflows/regenerar-manifiesto-borrado-global.yml
      - name: Regenerar diagnóstico
        run: npm run build:diagnostics
      - name: Verificar borrado global y manifiesto
        run: |
          node --check functions/api/admin-catalog-delete.js
          node --check cloudflare/borrado-global-catalogo.js
          node --check cloudflare/resiliencia-sync-catalogo.js
          node --check js/admin/products/borrado-global-catalogo-admin.js
          node scripts/auditar-borrado-global-catalogo.mjs
          node scripts/auditar-versionado-cache.mjs
          npm run verify:diagnostics
      - name: Commit del árbol reproducible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerar manifiesto de borrado global" || exit 0
          git push origin HEAD:feat/catalog-global-bulk-delete
