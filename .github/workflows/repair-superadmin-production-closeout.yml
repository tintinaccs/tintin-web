name: Repair Super Admin production closeout

on:
  push:
    branches:
      - fix/superadmin-production-closeout

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/superadmin-production-closeout
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix canonical session cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/sincronizar-inicio-navegacion-publica.js')
          text = path.read_text(encoding='utf-8')
          old = "const SESSION_PROTECTION_VERSION = 'tintin-20260829-persistent-session-1';"
          new = "const SESSION_PROTECTION_VERSION = 'tintin-20260901-superadmin-persistent-1';"
          if old not in text and new not in text:
              raise SystemExit('No se encontró el contrato SESSION_PROTECTION_VERSION esperado.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate public shell
        run: npm run sync:public-shell

      - name: Assert old session version is gone from runtime sources
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'tintin-20260829-persistent-session-1'
          allowed = {
              Path('scripts/cache-version-baseline.json'),
              Path('scripts/cache-version-approvals.json'),
              Path('.github/workflows/repair-superadmin-production-closeout.yml'),
          }
          hits = []
          for root_pattern in ('*.html', 'js/**/*.js', 'js/**/*.mjs', 'functions/**/*.js', 'cloudflare/**/*.js', 'scripts/**/*.js', 'scripts/**/*.mjs', 'tests/**/*.js', 'tests/**/*.mjs'):
              for path in Path('.').glob(root_pattern):
                  if path in allowed or not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      hits.append(str(path))
          if hits:
              raise SystemExit('Quedaron referencias activas a la versión antigua: ' + ', '.join(sorted(set(hits))))
          PY

      - name: Cache version audit
        run: npm run audit:cache-versioning

      - name: Account/session contract tests
        run: npm run test:accounts

      - name: Reproducible Pages build
        run: npm run build:pages

      - name: Full platform audit
        run: npm run audit:final

      - name: Ensure generator is idempotent
        run: |
          npm run sync:public-shell
          git diff --exit-code -- 404.html about.html admin-images.html admin.html cambios-devoluciones.html catalogo.html checkout.html collections.html contact.html envios.html index.html login.html perfil.html preguntas-frecuentes.html privacidad.html product.html terminos.html

      - name: Remove temporary repair workflow
        run: rm .github/workflows/repair-superadmin-production-closeout.yml

      - name: Commit verified repair
        run: |
          git config user.name 'Tintin Repair Bot'
          git config user.email 'tintinaccs@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make Super Admin session cache generation reproducible [repair-done]'
          git push origin HEAD:fix/superadmin-production-closeout
