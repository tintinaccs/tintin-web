name: Auditoría de pedidos seguros

on:
  pull_request:
    paths:
      - 'js/orders/pedido-checkout-seguro.js'
      - 'js/components/cart/sincronizacion-carrito.js'
      - 'firestore.rules'
      - 'scripts/auditar-seguro-pedidos.js'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/auditar-pedidos-seguros.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java para el emulador
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar herramientas
        run: npm install
      - name: Revisar sintaxis del checkout
        run: |
          node --check js/orders/pedido-checkout-seguro.js
          node --check scripts/auditar-seguro-pedidos.js
      - name: Revisar transacción y reglas
        run: npm run audit:secure-orders
      - name: Compilar reglas de Firestore
        run: npx firebase emulators:exec --only firestore --project demo-tintin "echo Reglas compiladas"
