name: Sincronizar shell publico V3

on:
  push:
    branches:
      - fix/global-unified-realtime-checkout-v3

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sincronizar HTML publicos
        run: node scripts/sincronizar-inicio-navegacion-publica.js
      - name: Commit de artefactos sincronizados
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo 'No hay HTML generado pendiente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'chore: sincronizar shell publico generado'
          git push origin HEAD:fix/global-unified-realtime-checkout-v3
