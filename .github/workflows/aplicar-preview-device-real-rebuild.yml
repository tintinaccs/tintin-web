name: Preparar preview con viewport real final

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/preview-device-real-rebuild' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar box model correcto
        run: node scripts/apply-preview-device-real-rebuild.mjs

      - name: Retirar utilidades temporales antes del manifiesto
        run: |
          rm scripts/apply-preview-device-real-rebuild.mjs
          rm .github/workflows/aplicar-preview-device-real-rebuild.yml

      - name: Regenerar baseline y artefactos en orden reproducible
        run: |
          node scripts/auditar-versionado-cache.mjs --write
          node scripts/generar-csp-cloudflare.js
          node scripts/construir-manifiesto-diagnostico.js
          node scripts/generar-csp-cloudflare.js --check
          node scripts/verificar-manifiesto-diagnostico.js
          node scripts/auditar-versionado-cache.mjs

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar viewport interno real
        run: npx playwright test tests/visual-builder/apariencia-preview-abajo.spec.js --project=chromium

      - name: Validar build completo
        run: npm run build:pages

      - name: Mostrar cambios esperados
        run: git status --short

      - name: Guardar resultado final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): corregir box model del viewport de preview"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
