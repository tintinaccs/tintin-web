name: Regenerate admin fix artifacts

on:
  push:
    branches:
      - fix/admin-auth-guard-20260904
    paths:
      - .github/workflows/one-time-regenerate-admin-artifacts.yml

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-guard-20260904
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove one-time workflow before generating manifest
        run: git rm .github/workflows/one-time-regenerate-admin-artifacts.yml

      - name: Build exact public artifacts
        run: npm run build:pages

      - name: Validate generated state
        run: |
          npm run audit:cache-versioning
          node --input-type=module --check < js/admin/admin-app.js
          node --input-type=module --check < functions/admin.js
          git diff --check

      - name: Commit generated artifacts
        run: |
          git config user.name "Tintin Auth Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): refresh generated artifacts for admin auth fix"
          git push origin HEAD:fix/admin-auth-guard-20260904
