name: Localizar meta auditoría temporal

on:
  push:
    branches:
      - chatgpt/production-surgical-hardening

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Buscar etiquetas exactas del cierre
        shell: bash
        run: |
          grep -RFn --exclude-dir=.git --exclude='*.log' \
            -e 'package expone test de sitemap' \
            -e 'CI de Fase 12 compila y prueba reglas críticas' \
            -e 'CI de Fase 12 ejecuta prueba un teléfono = una cuenta' \
            -e 'CI de Fase 12 ejecuta smoke de páginas' \
            -e 'CI de Fase 12 ejecuta accesibilidad' \
            -e 'CI de Fase 12 ejecuta sitemap dinámico' \
            -e 'Cierre Fase 12 fallido' . || true
