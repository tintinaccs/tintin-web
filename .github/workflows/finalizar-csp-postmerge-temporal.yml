name: Finalizar CSP post-merge temporal

on:
  push:
    branches:
      - chatgpt/fix-live-csp-postmerge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/fix-live-csp-postmerge
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Excluir workflow temporal del manifiesto
        run: mv .github/workflows/finalizar-csp-postmerge-temporal.yml /tmp/finalizar-csp-postmerge-temporal.yml
      - name: Regenerar artefactos reproducibles
        run: |
          npm run build:csp
          npm run build:diagnostics
          npm run verify:csp
          npm run verify:diagnostics
      - name: Restaurar workflow temporal
        if: always()
        run: mv /tmp/finalizar-csp-postmerge-temporal.yml .github/workflows/finalizar-csp-postmerge-temporal.yml
      - name: Publicar artefactos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _headers diagnostic-manifest.json
          if git diff --cached --quiet; then
            echo "Artefactos ya actualizados"
            exit 0
          fi
          git commit -m "build: actualizar manifiesto tras CSP live"
          git push origin HEAD:chatgpt/fix-live-csp-postmerge
