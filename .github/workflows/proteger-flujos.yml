name: Protección de flujos verificados

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-flows:
    name: Protected flows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Sólo se ejecuta código de la rama base. El candidato se lee como datos;
      # no se instala ni ejecuta ninguna dependencia o script de su checkout.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch candidate without checking it out
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - name: Verify protected files against trusted baseline
        if: github.event_name == 'pull_request_target'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/auditar-proteccion-flujos.mjs --candidate "$CANDIDATE_SHA"
      - name: Verify main baseline
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/auditar-proteccion-flujos.mjs
