name: Backup — repositorio

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'

permissions:
  contents: read

concurrency:
  group: respaldo-verificable-repositorio
  cancel-in-progress: true

jobs:
  backup:
    name: Crear bundle y simular restauración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch --all --tags --prune
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Crear respaldo verificable
        id: respaldo
        env:
          BACKUP_OUTPUT_DIR: respaldos
        run: node scripts/crear-respaldo-repositorio.mjs
      - name: Simular restauración completa
        env:
          BACKUP_OUTPUT_DIR: respaldos
        run: node scripts/verificar-respaldo-repositorio.mjs "${{ steps.respaldo.outputs.bundle_path }}"
      - uses: actions/upload-artifact@v6
        with:
          name: respaldo-repositorio-${{ github.run_id }}
          path: respaldos/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
