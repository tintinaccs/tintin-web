name: Auditoría de imágenes Fase 5

on:
  pull_request:
    paths:
      - 'admin-images.html'
      - 'js/core/firebase/firebase.js'
      - 'js/components/images/utilidades-imagenes.js'
      - 'js/components/images/imagenes.js'
      - 'js/components/images/resolucion-imagenes.js'
      - 'js/components/images/gestion-imagenes.js'
      - 'js/admin/products/admin-images-phase5.js'
      - 'js/components/images/procesamiento-imagenes.js'
      - 'js/components/images/carga-imagenes.js'
      - 'js/components/images/biblioteca-multimedia.js'
      - 'js/admin/products/admin-media-library-ui.js'
      - 'js/diagnostic-shims/storage-shim.js'
      - 'js/core/store/products-store.js'
      - 'js/analytics/site-activity.js'
      - 'js/quality/ui-quality.js'
      - 'cloudflare/cloudinary-security.js'
      - 'functions/api/cloudinary-sign-upload.js'
      - 'functions/api/cloudinary-delete.js'
      - 'functions/api/visitor-geo.js'
      - 'functions/api/geo-search.js'
      - 'js/pages/checkout/checkout-confiabilidad.js'
      - 'js/core/firebase/function-origin.js'
      - '_routes.json'
      - 'assets-tintin/images/README-IMAGENES.md'
      - 'CLOUDINARY_SETUP.md'
      - 'firebase.json'
      - 'storage.rules'
      - 'scripts/audit-images-phase5.js'
      - 'scripts/audit-site-reliability.js'
      - 'package.json'
      - '.github/workflows/audit-images-phase5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis
        run: |
          node --check js/core/firebase/firebase.js
          node --check js/components/images/utilidades-imagenes.js
          node --check js/components/images/imagenes.js
          node --check js/components/images/resolucion-imagenes.js
          node --check js/components/images/gestion-imagenes.js
          node --check js/admin/products/admin-images-phase5.js
          node --check js/components/images/procesamiento-imagenes.js
          node --check js/components/images/carga-imagenes.js
          node --check js/components/images/biblioteca-multimedia.js
          node --check js/admin/products/admin-media-library-ui.js
          node --check js/diagnostic-shims/storage-shim.js
          node --check js/core/store/products-store.js
          node --check js/analytics/site-activity.js
          node --check js/quality/ui-quality.js
          node --check cloudflare/cloudinary-security.js
          node --check functions/api/cloudinary-sign-upload.js
          node --check functions/api/cloudinary-delete.js
          node --check functions/api/visitor-geo.js
          node --check functions/api/geo-search.js
          node --check js/pages/checkout/checkout-confiabilidad.js
          node --check js/core/firebase/function-origin.js
          node --check scripts/audit-images-phase5.js
          node --check scripts/audit-site-reliability.js
      - name: Compilar Pages Functions
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@latest pages functions build functions --outdir=.cloudflare-functions --project-directory=. 2>&1 | tee wrangler-build.log
      - name: Guardar registro de Wrangler
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-build-log
          path: wrangler-build.log
          if-no-files-found: warn
          retention-days: 1
      - name: Revisar integración
        run: npm run audit:images
      - name: Revisar confiabilidad
        id: reliability
        continue-on-error: true
        run: npm run audit:reliability > image-reliability-audit.log 2>&1
      - name: Guardar informe de confiabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-reliability-audit-log
          path: image-reliability-audit.log
          retention-days: 7
      - name: Exigir resultado de confiabilidad
        run: |
          cat image-reliability-audit.log
          test "${{ steps.reliability.outcome }}" = "success"
