name: Validación final de lógica integral

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: unified-store-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/unified-store-logic' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar política y superficies
        shell: bash
        run: |
          if [ -f scripts/apply-unified-store-logic.mjs ]; then
            node scripts/apply-unified-store-logic.mjs
            rm scripts/apply-unified-store-logic.mjs
          fi
          if [ -f scripts/apply-unified-store-surfaces.mjs ]; then
            node scripts/apply-unified-store-surfaces.mjs
            rm scripts/apply-unified-store-surfaces.mjs
          fi
          rm -f maintenance/unified-store-audit-trigger.txt

      - name: Validar sintaxis y contratos
        run: |
          node --check js/pages/catalog/politica-exhibicion-catalogo.js
          node --check js/core/store/estado-productos.js
          node --check js/pages/catalog/politica-visibilidad-catalogo.js
          node --check js/pages/catalog/prioridad-stock-catalogo.js
          node --check tienda.js
          node scripts/auditar-unificada-tienda-logica.js
          node scripts/auditar-unificada-tienda-superficies.js
          node scripts/auditar-fase-7-catalogo.js
          node scripts/auditar-catalogo-pagina.js
          node scripts/auditar-colecciones-pagina.js
          node scripts/auditar-producto-pagina.js

      - name: Guardar implementación validada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La rama ya contiene la implementación final."
            exit 0
          fi
          git commit -m "feat: aplicar contrato integral de catálogo y tienda [unified-store-final]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
