name: Regenerar CSP live temporal

on:
  push:
    branches:
      - chatgpt/fix-live-csp-postmerge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/fix-live-csp-postmerge
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Regenerar CSP
        run: node scripts/generar-csp-cloudflare.js
      - name: Verificar CSP
        run: node scripts/generar-csp-cloudflare.js --check
      - name: Publicar _headers generado
        run: |
          if git diff --quiet -- _headers; then
            echo "_headers ya estaba actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _headers
          git commit -m "build: regenerar CSP global de producción"
          git push origin HEAD:chatgpt/fix-live-csp-postmerge
