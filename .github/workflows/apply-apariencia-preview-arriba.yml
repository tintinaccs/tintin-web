name: Aplicar preview arriba en Apariencia

on:
  push:
    branches:
      - fix/apariencia-preview-arriba

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/apariencia-preview-arriba
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aplicar layout solicitado
        run: python scripts/aplicar-apariencia-preview-arriba.py

      - name: Retirar herramientas temporales antes de generar artefactos
        run: |
          git rm .github/workflows/apply-apariencia-preview-arriba.yml
          git rm scripts/aplicar-apariencia-preview-arriba.py

      - name: Regenerar versionado y artefactos
        run: |
          npm run cache-versioning:write
          npm run build:csp
          npm run build:diagnostics
          npm run verify:csp
          npm run verify:diagnostics
          npm run audit:cache-versioning

      - name: Verificar arquitectura de Apariencia
        run: |
          node --check js/admin/appearance/editor-visual-admin.js
          npm run audit:appearance-unified
          npm run audit:content-appearance

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Probar preview arriba y responsive
        run: npx playwright test tests/visual-builder/apariencia-preview-abajo.spec.js --project=chromium

      - name: Auditoría final
        run: npm run audit:final

      - name: Commit clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admin): preview arriba y editores abajo"
          git push origin HEAD:fix/apariencia-preview-arriba
