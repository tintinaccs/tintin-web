name: Migración temporal fast navigation

on:
  push:
    branches:
      - perf/navegacion-inmediata-20260810
    paths:
      - '.github/workflows/migrar-cache-fast-nav-temporal.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: perf/navegacion-inmediata-20260810
          fetch-depth: 0

      - name: Actualizar versión del bootstrap en todas las páginas
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'js/components/color/esquema-color-instantaneo.js?v=tintin-20260716-cloudinary-fix-1'
          new = 'js/components/color/esquema-color-instantaneo.js?v=tintin-20260810-fast-nav-1'
          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              updated = text.replace(old, new)
              path.write_text(updated, encoding='utf-8')
              changed.append(path.name)
          if len(changed) < 15:
              raise SystemExit(f'Se esperaban al menos 15 páginas versionadas; se actualizaron {len(changed)}: {changed}')
          print('Páginas actualizadas:', ', '.join(changed))
          PY

      - name: Instalar dependencias y regenerar derivados
        run: |
          npm ci
          npm run build:pages

      - name: Retirar migración temporal y guardar resultado
        run: |
          rm .github/workflows/migrar-cache-fast-nav-temporal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: publicar navegación inmediata sin caché obsoleta"
          git push origin HEAD:perf/navegacion-inmediata-20260810
