name: Validar navegación inmediata

on:
  pull_request:
    branches:
      - main
    paths:
      - 'js/components/color/esquema-color-instantaneo.js'
      - 'scripts/auditar-rendimiento-tiempo-real.js'
      - 'scripts/auditar-rendimiento-regresiones.js'
      - 'scripts/cache-version-baseline.json'
      - 'tests/performance/navegacion-inmediata.test.mjs'
      - '*.html'
      - '.github/workflows/validar-navegacion-inmediata.yml'

permissions:
  contents: write

jobs:
  fast-navigation:
    name: Fast navigation audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Contrato de navegación inmediata
        run: node --test tests/performance/navegacion-inmediata.test.mjs
      - name: Auditoría de rendimiento existente
        run: node scripts/auditar-rendimiento-tiempo-real.js
      - name: Tripwire de regresiones de rendimiento
        run: node scripts/auditar-rendimiento-regresiones.js
      - name: Regenerar y commitear manifiesto reproducible una sola vez
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Este commit es un puente temporal. Restauramos la versión anterior
          # del propio workflow ANTES de generar el inventario, de modo que el
          # commit resultante solo conserve los artefactos reproducibles reales.
          git checkout HEAD^ -- .github/workflows/validar-navegacion-inmediata.yml
          npm run build:routes
          npm run audit:cache-versioning
          npm run build:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-manifest.json scripts/cache-version-baseline.json _headers _routes.json .github/workflows/validar-navegacion-inmediata.yml
          if git diff --cached --quiet; then
            echo "No hay artefactos pendientes."
            exit 0
          fi
          git commit -m "chore: actualizar manifiesto diagnóstico"
          git push origin "HEAD:${HEAD_BRANCH}"
