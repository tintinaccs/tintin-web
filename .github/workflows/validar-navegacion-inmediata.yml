name: Validar navegación inmediata

on:
  pull_request:
    branches:
      - main
    paths:
      - 'js/components/color/esquema-color-instantaneo.js'
      - 'scripts/auditar-rendimiento-tiempo-real.js'
      - 'scripts/auditar-rendimiento-regresiones.js'
      - 'scripts/cache-version-baseline.json'
      - 'tests/performance/navegacion-inmediata.test.mjs'
      - '*.html'
      - '.github/workflows/validar-navegacion-inmediata.yml'

permissions:
  contents: write

jobs:
  fast-navigation:
    name: Fast navigation audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restaurar workflow estable antes de generar
        env:
          SOURCE_HEAD: e4dfc59aedb35730292fe666a2dc9cc9aec9a52a
        run: |
          git fetch --no-tags --depth=1 origin "${SOURCE_HEAD}"
          git checkout "${SOURCE_HEAD}" -- .github/workflows/validar-navegacion-inmediata.yml
      - name: Regenerar artefactos reproducibles
        run: |
          npm run build:routes
          npm run audit:cache-versioning
          npm run build:pages
      - name: Confirmar artefactos y restaurar workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-manifest.json scripts/cache-version-baseline.json _headers _routes.json .github/workflows/validar-navegacion-inmediata.yml
          if git diff --cached --quiet; then
            echo "Artefactos ya sincronizados."
            exit 0
          fi
          git commit -m "chore: actualizar manifiesto diagnóstico tras auditoría responsive"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
