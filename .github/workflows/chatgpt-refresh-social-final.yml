name: ChatGPT refresh social final

on:
  push:
    branches:
      - chatgpt/social-commerce-notifications-v1

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[social-final-pass]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remove temporary workflow
        run: git rm .github/workflows/chatgpt-refresh-social-final.yml
      - name: Regenerate and validate
        run: |
          npm run cache-versioning:write
          npm run build:pages
          npm run audit:emails
          npm run audit:secure-orders
          node --test tests/engagement/notificaciones-sociales.test.mjs
          npm run test:engagement
          npm run audit:cache-versioning
      - name: Commit final tree
        run: |
          git add -A
          git config user.name "tintin-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(social): final regenerated artifacts [social-final-pass]"
          git push origin HEAD:${GITHUB_REF_NAME}
