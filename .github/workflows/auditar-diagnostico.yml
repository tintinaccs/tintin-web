name: Auditoría del módulo Diagnóstico

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar sintaxis
        run: |
          node --check js/admin/diagnostics/diagnostico-maestro-admin.js
          node --check js/admin/diagnostics/diagnostico-sitio-admin.js
          node --check functions/api/master-diagnostics.js
          node --check js/diagnostics/nucleo-diagnostico.js
          node --check scripts/construir-manifiesto-diagnostico.js
          node --check scripts/verificar-manifiesto-diagnostico.js
          node --check scripts/auditar-diagnostico.js

      - name: Verificar interfaz unificada
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ui = fs.readFileSync('js/admin/diagnostics/diagnostico-maestro-admin.js', 'utf8');
          const css = fs.readFileSync('css/admin/diagnostico-maestro.css', 'utf8');
          if (!ui.includes("querySelectorAll('.adm-diagnostic-card, .adm-local-diagnostic-card').forEach(card => card.remove())")) {
            throw new Error('El Maestro no elimina la interfaz local heredada.');
          }
          if (!css.includes('.adm-local-diagnostic-card{display:none!important}')) {
            throw new Error('La tarjeta local puede volver a mostrarse.');
          }
          if (!ui.includes("setState(lastPayload?.latest?.state || 'NOT_VERIFIED')")) {
            throw new Error('Un error de lectura todavía puede quedar como SIN DATOS.');
          }
          NODE

      - name: Regenerar y verificar inventario exacto
        run: npm run build:pages

      - name: Auditar modo de solo lectura e inventario
        run: npm run audit:diagnostics
