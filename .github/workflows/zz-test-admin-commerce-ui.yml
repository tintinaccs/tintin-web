name: Test admin commerce UI

on:
  push:
    branches:
      - feat/shopify-productos-colecciones-pedidos

permissions:
  contents: write

jobs:
  playwright:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shopify-productos-colecciones-pedidos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Probar Productos Colecciones y Pedidos
        run: npx playwright test tests/ui-ux/admin-commerce-shopify.spec.js --project=chromium
      - name: Validar contratos estáticos
        run: |
          node --check js/admin/shopify-commerce-admin.js
          node scripts/auditar-admin-commerce-shopify.js
          npm run audit:products-media
          npm run audit:admin-orders
          npm run audit:cache-versioning
      - name: Retirar workflow temporal
        if: success()
        run: |
          rm -f .github/workflows/zz-test-admin-commerce-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/zz-test-admin-commerce-ui.yml
          git commit -m "test(admin): confirmar UI de comercio en Chromium"
          git push origin HEAD:feat/shopify-productos-colecciones-pedidos
