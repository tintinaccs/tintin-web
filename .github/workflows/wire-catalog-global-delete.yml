name: Wire catalog global delete

on:
  push:
    branches: [feat/catalog-global-bulk-delete]
    paths:
      - '.github/workflows/wire-catalog-global-delete.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/catalog-global-bulk-delete
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cablear módulo y aprobar huella
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          tag = 'tintin-20260831-catalog-global-delete-1'
          line = f'<script type="module" src="js/admin/products/borrado-global-catalogo-admin.js?v={tag}"></script>'
          if line not in text:
              marker = '<script type="module" src="js/admin/maestro/panel-maestro.js?v=tintin-20260831-superadmin-maestro-1"></script>'
              if marker not in text:
                  raise SystemExit('No se encontró el ancla Maestro en admin.html')
              text = text.replace(marker, line + '\n' + marker, 1)
              admin.write_text(text, encoding='utf-8')

          module = Path('js/admin/products/borrado-global-catalogo-admin.js').read_text(encoding='utf-8').replace('\r\n','\n')
          sha256 = hashlib.sha256(module.encode()).hexdigest()
          approvals_path = Path('scripts/cache-version-approvals.json')
          approvals = json.loads(approvals_path.read_text(encoding='utf-8'))
          approvals.setdefault('approved', {})['js/admin/products/borrado-global-catalogo-admin.js'] = {
              'version': tag,
              'sha256': sha256,
          }
          approvals_path.write_text(json.dumps(approvals, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('SHA256 aprobado:', sha256)
      - name: Eliminar workflow temporal antes del manifiesto
        run: git rm .github/workflows/wire-catalog-global-delete.yml
      - name: Regenerar manifiesto diagnóstico
        run: npm run build:diagnostics
      - name: Verificar contrato y caché
        run: |
          node scripts/auditar-borrado-global-catalogo.mjs
          node scripts/auditar-versionado-cache.mjs
          npm run verify:diagnostics
      - name: Commit final reproducible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: cablear borrado global de catálogo" || exit 0
          git push origin HEAD:feat/catalog-global-bulk-delete
