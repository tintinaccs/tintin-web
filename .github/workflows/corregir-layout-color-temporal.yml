name: Corrección temporal de color del layout global

on:
  push:
    branches:
      - feat/apariencia-visual-studio-v2
    paths:
      - .github/workflows/corregir-layout-color-temporal.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/apariencia-visual-studio-v2
          fetch-depth: 0

      - name: Asegurar overrides explícitos sin romper herencia
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const runtimePath = path.join(root, 'js/components/navigation/compartido/apariencia-global.js');
          let runtime = fs.readFileSync(runtimePath, 'utf8');

          const colorHelper = `function setCustomColor(root, attribute, cssVar, value) {\n  const color = safeColor(value);\n  root.toggleAttribute(attribute, Boolean(color));\n  if (color) root.style.setProperty(cssVar, color);\n  else root.style.removeProperty(cssVar);\n}\n`;
          const colorHelperExpanded = `${colorHelper}\nfunction setDirectColor(selector, property, value) {\n  const color = safeColor(value);\n  document.querySelectorAll(selector).forEach(node => {\n    if (color) node.style.setProperty(property, color, 'important');\n    else node.style.removeProperty(property);\n  });\n}\n`;
          if (!runtime.includes(colorHelper)) throw new Error('No se encontró helper de colores globales.');
          runtime = runtime.replace(colorHelper, colorHelperExpanded);

          const headerAnchor = `  setCustomColor(root, 'data-tt-header-bg-custom', '--tt-global-header-bg', raw.background);\n  setCustomColor(root, 'data-tt-header-text-custom', '--tt-global-header-text', raw.textColor);\n  setCustomColor(root, 'data-tt-header-accent-custom', '--tt-global-header-accent', raw.accentColor);`;
          const headerExpanded = `${headerAnchor}\n  setDirectColor('#tt-header-desktop-tablet,#tt-header-tablet,#tt-tablet-menu,#tt-tabbar', 'background-color', raw.background);\n  setDirectColor('#tt-header-desktop-tablet,#tt-header-tablet,#tt-tablet-menu,#tt-tabbar', 'color', raw.textColor);`;
          if (!runtime.includes(headerAnchor)) throw new Error('No se encontró bloque de colores del header.');
          runtime = runtime.replace(headerAnchor, headerExpanded);

          const footerAnchor = `  setCustomColor(root, 'data-tt-footer-bg-custom', '--tt-global-footer-bg', raw.background);\n  setCustomColor(root, 'data-tt-footer-text-custom', '--tt-global-footer-text', raw.textColor);\n  setCustomColor(root, 'data-tt-footer-accent-custom', '--tt-global-footer-accent', raw.accentColor);`;
          const footerExpanded = `${footerAnchor}\n  setDirectColor('.tt-footer', 'background-color', raw.background);\n  setDirectColor('.tt-footer', 'color', raw.textColor);`;
          if (!runtime.includes(footerAnchor)) throw new Error('No se encontró bloque de colores del footer.');
          runtime = runtime.replace(footerAnchor, footerExpanded);
          fs.writeFileSync(runtimePath, runtime, 'utf8');

          const entryPath = path.join(root, 'js/components/navigation/entrada-navegacion-publica.js');
          let entry = fs.readFileSync(entryPath, 'utf8');
          entry = entry.replace('apariencia-global.js?v=tintin-20260810-global-layout-2', 'apariencia-global.js?v=tintin-20260810-global-layout-3');
          fs.writeFileSync(entryPath, entry, 'utf8');

          const bootstrapPath = path.join(root, 'js/inicio-navegacion-publica.js');
          let bootstrap = fs.readFileSync(bootstrapPath, 'utf8');
          bootstrap = bootstrap.replace("const MODULE_VERSION = 'tintin-20260810-global-studio-6';", "const MODULE_VERSION = 'tintin-20260810-global-studio-7';");
          fs.writeFileSync(bootstrapPath, bootstrap, 'utf8');

          for (const name of fs.readdirSync(root).filter(name => name.endsWith('.html'))) {
            const file = path.join(root, name);
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            text = text
              .split('js/inicio-navegacion-publica.js?v=tintin-20260810-global-studio-6').join('js/inicio-navegacion-publica.js?v=tintin-20260810-global-studio-7')
              .split('js/components/navigation/entrada-navegacion-publica.js?v=tintin-20260810-global-studio-6').join('js/components/navigation/entrada-navegacion-publica.js?v=tintin-20260810-global-studio-7');
            if (text !== before) fs.writeFileSync(file, text, 'utf8');
          }
          NODE

          node scripts/auditar-versionado-cache.mjs --write
          node --check js/components/navigation/compartido/apariencia-global.js
          node --check js/components/navigation/entrada-navegacion-publica.js
          node --check js/inicio-navegacion-publica.js
          node --test tests/visual-builder/visual-studio-global-core.test.mjs

          rm .github/workflows/corregir-layout-color-temporal.yml

          git config user.name "tintinaccs-ci"
          git config user.email "tintinaccs@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(apariencia): aplicar colores globales explícitos con prioridad segura"
            git push origin HEAD:feat/apariencia-visual-studio-v2
          fi
