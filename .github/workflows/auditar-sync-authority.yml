name: Auditoría de autoridad de sincronización

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/api/sheets-*.js'
      - 'cloudflare/user-lifecycle-domain.js'
      - 'apps-script/**'
      - 'tests/sync/**'
      - 'scripts/auditar-sync-authority.mjs'
      - '.github/workflows/auditar-sync-authority.yml'

permissions:
  contents: read

jobs:
  sync-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sintaxis de endpoints
        run: |
          node --check functions/api/sheets-admin-webhook.js
          node --check functions/api/sheets-sync-snapshot.js
          node --check cloudflare/user-lifecycle-domain.js
      - name: Contrato de autoridad
        run: node scripts/auditar-sync-authority.mjs
      - name: Regresiones de sincronización
        run: node --test tests/sync/*.test.mjs
