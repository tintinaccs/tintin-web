name: Auditoría de contenido Fase 6

on:
  pull_request:
    paths:
      - 'js/core/store/esquema-contenido.js'
      - 'js/core/store/contenido-sitio.js'
      - 'js/admin/content/gestion-contenido-admin.js'
      - 'js/core/auth/insignia-edicion.js'
      - 'js/core/auth/permisos-roles.js'
      - 'js/quality/calidad-interfaz.js'
      - 'scripts/auditar-contenido-fase-6.js'
      - 'package.json'
      - '.github/workflows/auditar-contenido-fase-6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Revisar sintaxis
        run: |
          node --check js/core/store/esquema-contenido.js
          node --check js/core/store/contenido-sitio.js
          node --check js/admin/content/gestion-contenido-admin.js
          node --check js/core/auth/insignia-edicion.js
          node --check js/core/auth/permisos-roles.js
          node --check js/quality/calidad-interfaz.js
          node --check scripts/auditar-contenido-fase-6.js
      - name: Revisar integración
        run: npm run audit:content
