name: Reparación puntual manifiesto PR728

on:
  push:
    branches:
      - chore/pr728-regenerate-manifest

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ee380bf2b528fec0eff68dda1ab69f5a16f36536
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate exact public artifacts
        run: npm run build:pages
      - name: Verify generated manifest is reproducible
        run: |
          cp diagnostic-manifest.json "$RUNNER_TEMP/diagnostic-manifest.json"
          npm run build:diagnostics
          cmp diagnostic-manifest.json "$RUNNER_TEMP/diagnostic-manifest.json"
          npm run verify:diagnostics
          git diff --name-only -- . | tee "$RUNNER_TEMP/changed-files.txt"
          test "$(cat "$RUNNER_TEMP/changed-files.txt")" = 'diagnostic-manifest.json'
      - name: Commit only the generated manifest to PR728
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c pr728-manifest-fix
          git add -- diagnostic-manifest.json
          git commit -m 'chore(diagnostics): regenerate manifest for admin recovery'
          git fetch origin refs/heads/fix/admin-auth-data-recovery-20260907
          test "$(git rev-parse FETCH_HEAD)" = 'ee380bf2b528fec0eff68dda1ab69f5a16f36536'
          git push origin HEAD:refs/heads/fix/admin-auth-data-recovery-20260907
