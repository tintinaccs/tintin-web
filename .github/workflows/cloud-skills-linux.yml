name: Cloud Skills — Linux compatibility
on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'scripts/check-cloud-skills-linux.sh'
      - '.github/workflows/cloud-skills-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-skills-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate project skill directories
        run: bash scripts/check-cloud-skills-linux.sh --check
      - name: Install skills into ephemeral Linux runner user paths
        run: bash scripts/check-cloud-skills-linux.sh --install-user
      - name: Verify user-level links and repository remains unchanged
        run: |
          test -L "$HOME/.agents/skills/tintin-cloud-linux"
          test -L "$HOME/.claude/skills/tintin-cloud-linux"
          test -L "$HOME/.agents/skills/ui-ux-pro-max"
          test -L "$HOME/.claude/skills/taste-frontend"
          git diff --exit-code
