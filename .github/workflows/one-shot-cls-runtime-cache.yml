name: One-shot — versionar fix CLS runtime

on:
  push:
    branches:
      - fix/cls-y-smoke-producto
    paths:
      - .github/workflows/one-shot-cls-runtime-cache.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/cls-y-smoke-producto
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump loader token in source contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const oldTag = 'tintin-20260811-cls-reveal-fix-1';
          const newTag = 'tintin-20260811-cls-runtime-stable-1';
          const raw = execFileSync(
            'git',
            ['grep', '-l', oldTag, '--', '*.js', '*.mjs', '*.html'],
            { encoding: 'utf8' }
          ).trim();
          const files = raw ? raw.split(/\r?\n/) : [];
          if (!files.includes('js/cargador-pagina.js')) {
            throw new Error('No se encontró el token actual en js/cargador-pagina.js');
          }
          if (!files.includes('scripts/sincronizar-inicio-navegacion-publica.js')) {
            throw new Error('No se encontró LOADER_VERSION en el sincronizador público');
          }
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before.split(oldTag).join(newTag);
            if (after !== before) {
              fs.writeFileSync(file, after);
              console.log(`bump: ${file}`);
            }
          }
          console.log(`Archivos fuente actualizados: ${files.length}`);
          NODE

      - name: Synchronize public loader references
        run: npm run sync:public-shell

      - name: Approve immutable cache tag
        run: npm run cache-versioning:write

      - name: Remove one-shot source before diagnostics
        run: rm -f .github/workflows/one-shot-cls-runtime-cache.yml

      - name: Regenerate and verify derived files
        run: npm run build:pages

      - name: Validate diff
        run: |
          git diff --check
          ! git grep -n 'tintin-20260811-cls-reveal-fix-1' -- '*.js' '*.mjs' '*.html'
          git status --short

      - name: Commit complete result
        run: |
          git fetch origin fix/cls-y-smoke-producto
          test "$(git rev-parse origin/fix/cls-y-smoke-producto)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(perf): versionar runtime estable de CLS"
          git push origin HEAD:fix/cls-y-smoke-producto
