name: TEMP checkout cart fix

on:
  push:
    branches:
      - fix/checkout-cart-profile-persistence

permissions:
  contents: write

jobs:
  propagate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[checkout-cache-propagated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-cart-profile-persistence
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply root cart recovery and propagate immutable cache versions
        shell: bash
        run: |
          cat > /tmp/propagate-checkout-cache.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const ROOT = process.cwd();
          const NEW_VERSION = 'tintin-20260822-checkout-cart-profile-1';
          const baselinePath = path.join(ROOT, 'scripts/cache-version-baseline.json');
          const versionRe = /(["'])([^"'?]+\.(?:css|js|mjs))\?v=([A-Za-z0-9._-]+)\1/g;

          function walk(dir) {
            const abs = path.join(ROOT, dir);
            if (!fs.existsSync(abs)) return [];
            const out = [];
            for (const entry of fs.readdirSync(abs, { withFileTypes: true })) {
              const rel = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(rel));
              else if (/\.(?:js|mjs)$/.test(entry.name)) out.push(rel.split(path.sep).join('/'));
            }
            return out;
          }

          const sourceFiles = [
            ...fs.readdirSync(ROOT).filter(name => name.endsWith('.html')),
            ...walk('js'),
            ...walk('functions'),
          ];

          function resolveRef(sourceFile, ref) {
            if (ref.startsWith('http://') || ref.startsWith('https://')) return null;
            if (sourceFile.endsWith('.html')) return ref.replace(/^\.?\//, '');
            return path.relative(ROOT, path.resolve(ROOT, path.dirname(sourceFile), ref))
              .split(path.sep).join('/');
          }

          function patchExact(file, before, after, label) {
            const abs = path.join(ROOT, file);
            let text = fs.readFileSync(abs, 'utf8');
            if (text.includes(after)) return;
            if (!text.includes(before)) throw new Error(`No se encontró el bloque esperado: ${label}`);
            text = text.replace(before, after);
            fs.writeFileSync(abs, text, 'utf8');
          }

          patchExact(
            'js/orders/pedido-checkout-seguro.js',
            'con guion y díito verificador',
            'con guion y dígito verificador',
            'typo RUC'
          );

          patchExact(
            'js/components/cart/sincronizacion-carrito.js',
            `      if (!ready) {\n        setStatus('offline');\n        readyResolve?.();\n        return;\n      }`,
            `      if (!ready) {\n        // App Check puede quedar bloqueado por el navegador. Aun en ese modo\n        // el carrito agregado antes de resolver Auth debe sobrevivir al cambio\n        // invitada → cuenta; se conserva localmente y queda marcado dirty para\n        // sincronizarlo en una carga posterior donde App Check sí responda.\n        if (guestAtLogin.length) {\n          const recovered = addGuestQuantities(currentLocalCart(), guestAtLogin);\n          const normalized = writeLocal(recovered, { notify: true });\n          desiredCart = normalized;\n          desiredProjection = projection(normalized);\n          pendingRemoteWrite = true;\n          rawStringSet(dirtyKey(currentUser.uid), '1');\n          rawSet(GUEST_CART_KEY, []);\n          rawRemove(GUEST_ACTIVITY_KEY);\n          guestAtLogin = [];\n        }\n        setStatus('offline');\n        readyResolve?.();\n        return;\n      }`,
            'recuperación offline del carrito'
          );

          let diffFiles = [];
          try {
            diffFiles = execFileSync('git', ['diff', '--name-only', 'HEAD'], { encoding: 'utf8' })
              .split(/\r?\n/).filter(Boolean);
          } catch {}

          const queue = [
            'js/orders/pedido-checkout-seguro.js',
            'js/components/cart/sincronizacion-carrito.js',
            ...diffFiles.filter(file => /\.(?:js|mjs)$/.test(file)),
          ];
          const processed = new Set();
          const changedSources = new Set();

          while (queue.length) {
            const target = queue.shift();
            if (!target || processed.has(target)) continue;
            processed.add(target);

            for (const sourceFile of sourceFiles) {
              const abs = path.join(ROOT, sourceFile);
              let text = fs.readFileSync(abs, 'utf8');
              let touched = false;
              const next = text.replace(versionRe, (whole, quote, ref, tag) => {
                const resolved = resolveRef(sourceFile, ref);
                if (resolved !== target || tag === NEW_VERSION) return whole;
                touched = true;
                return `${quote}${ref}?v=${NEW_VERSION}${quote}`;
              });
              if (!touched) continue;
              fs.writeFileSync(abs, next, 'utf8');
              changedSources.add(sourceFile);
              if (/\.(?:js|mjs)$/.test(sourceFile) && !processed.has(sourceFile)) {
                queue.push(sourceFile);
              }
            }
          }

          // Recolecta qué archivos siguen realmente referenciados con ?v= para
          // actualizar sólo esas entradas del baseline, preservando el historial.
          const referenced = new Map();
          for (const sourceFile of sourceFiles) {
            const text = fs.readFileSync(path.join(ROOT, sourceFile), 'utf8');
            for (const match of text.matchAll(versionRe)) {
              const target = resolveRef(sourceFile, match[2]);
              if (!target) continue;
              const previous = referenced.get(target);
              if (previous && previous !== match[3]) {
                throw new Error(`Tags inconsistentes para ${target}: ${previous} / ${match[3]}`);
              }
              referenced.set(target, match[3]);
            }
          }

          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          for (const target of processed) {
            if (!referenced.has(target)) continue;
            const abs = path.join(ROOT, target);
            if (!fs.existsSync(abs)) continue;
            const canonical = fs.readFileSync(abs, 'utf8').replace(/\r\n/g, '\n');
            baseline[target] = {
              version: referenced.get(target),
              sha256: crypto.createHash('sha256').update(canonical, 'utf8').digest('hex'),
            };
          }
          fs.writeFileSync(baselinePath, JSON.stringify(baseline, null, 2) + '\n', 'utf8');

          console.log('Versiones propagadas:', [...processed].sort().join(', '));
          console.log('Fuentes actualizadas:', [...changedSources].sort().join(', '));
          NODE

          node /tmp/propagate-checkout-cache.mjs
          npm run sync:public-shell
          npm run build:csp
          npm run build:diagnostics
          node /tmp/propagate-checkout-cache.mjs

      - name: Verify checkout and cache contract
        run: |
          node --check js/orders/pedido-checkout-seguro.js
          node --check js/components/cart/sincronizacion-carrito.js
          npm run test:checkout-contract
          npm run audit:secure-orders
          npm run audit:cart
          npm run audit:cache-versioning
          git diff --check

      - name: Commit propagated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'tintinaccs'
          git config user.email 'tintinaccs@gmail.com'
          git add -A
          git commit -m 'chore: propagate checkout cache versions [checkout-cache-propagated]'
          git push origin HEAD:fix/checkout-cart-profile-persistence
