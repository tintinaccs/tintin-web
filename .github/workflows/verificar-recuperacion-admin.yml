name: Verificar recuperación Admin

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/core/auth/roles.js'
      - 'tests/accounts/admin-role-recovery.test.mjs'
      - '.github/workflows/verificar-recuperacion-admin.yml'

permissions:
  contents: read

jobs:
  role-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check role module syntax
        run: node --check js/core/auth/roles.js
      - name: Run authorization regression tests
        run: node --test tests/accounts/admin-role-recovery.test.mjs
