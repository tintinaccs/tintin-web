name: Apply public commerce closeout

on:
  push:
    branches:
      - fix/catalog-checkout-collections-closeout
    paths:
      - 'scripts/apply-public-closeout.py'
      - 'scripts/propagar-cache-closeout.py'
      - '.github/workflows/apply-public-commerce-closeout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-checkout-collections-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply targeted fixes
        run: |
          python scripts/apply-public-closeout.py
          # Dos reemplazos globales del helper pertenecían a intentos anteriores y
          # ensanchaban el diff a todo el sitio. Se revierten antes de propagar
          # únicamente los bumps de los módulos que realmente cambiaron.
          python - <<'PY'
          from pathlib import Path
          pairs = [
              ('tintin-20260901-public-maintenance-1', 'tintin-20260830-instant-loading-1'),
              ('tintin-20260901-public-commerce-closeout-1', 'tintin-20260830-store-gate-api-1'),
          ]
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in {'.git', 'node_modules', 'dist', 'coverage'} for part in p.parts):
                  continue
              if p.suffix.lower() not in {'.js', '.mjs', '.html', '.json', '.md', '.yml', '.yaml', '.txt'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for new, old in pairs:
                  updated = updated.replace(new, old)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
          PY
          python scripts/propagar-cache-closeout.py
      - name: Syntax checks
        run: |
          node --check js/core/store/estado-productos.js
          node --check js/pages/catalog/mantenimiento-catalogo.js
          node --check js/pages/collections/estado-colecciones.js
          node --check js/pages/collections/presentacion-colecciones.js
          node --check cloudflare/checkout-operational-health.js
          node --check cloudflare/system-health.js
          node --check js/admin/diagnostics/estado-ecosistema-admin.js
      - name: Regression contracts
        run: |
          node --test tests/public-commerce/closeout-contracts.test.mjs
          node --test tests/system-health/*.test.mjs
      - name: Targeted audits
        run: |
          node scripts/auditar-catalogo-pagina.js
          npm run audit:phase7-catalog
          node scripts/auditar-colecciones-pagina.js
          npm run audit:collections
          npm run audit:secure-orders
          npm run audit:checkout-delivery
          npm run test:checkout-contract
          npm run test:paypal
          npm run audit:cache-versioning
      - name: Commit verified fixes
        run: |
          rm .github/workflows/apply-public-commerce-closeout.yml scripts/apply-public-closeout.py scripts/propagar-cache-closeout.py
          git config user.name 'Tintin Repair Bot'
          git config user.email 'tintinaccs@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close catalog checkout and collections runtime gaps [public-closeout-done]'
          git push origin HEAD:fix/catalog-checkout-collections-closeout
