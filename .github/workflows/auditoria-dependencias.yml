name: Diagnóstico de lectura del token de mantenimiento
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Consultar endpoints sin publicar cambios ni credenciales
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const root = `https://api.github.com/repos/${process.env.REPO}`;
          const requests = [
            ['rate_limit', 'https://api.github.com/rate_limit'],
            ['pulls/1067', `${root}/pulls/1067`],
            ['git/ref/heads/main', `${root}/git/ref/heads/main`],
            ['git/trees/candidato', `${root}/git/trees/c1e2ecb3acba9488e7e16cc00a5882a8ebea8171?recursive=1`],
            ['check-runs', `${root}/commits/c1e2ecb3acba9488e7e16cc00a5882a8ebea8171/check-runs?filter=latest`],
            ['environment', `${root}/environments/protected-flow-maintenance`],
          ];
          for (const [endpoint, url] of requests) {
            const response = await fetch(url, {headers: {accept:'application/vnd.github+json', authorization:`Bearer ${process.env.GH_TOKEN}`, 'content-type':'application/json', 'X-GitHub-Api-Version':'2026-03-10'}, signal:AbortSignal.timeout(30000)});
            const data = await response.json().catch(() => ({}));
            console.log(JSON.stringify({endpoint, status:response.status, message:response.ok ? undefined : data.message, documentation_url:response.ok ? undefined : data.documentation_url, rate_limit:response.headers.get('x-ratelimit-limit'), rate_remaining:response.headers.get('x-ratelimit-remaining'), rate_reset:response.headers.get('x-ratelimit-reset'), retry_after:response.headers.get('retry-after'), accepted_permissions:response.headers.get('x-accepted-github-permissions')}));
          }
          JS
