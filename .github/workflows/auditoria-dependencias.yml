name: Mantenimiento — dependencias

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-maintenance
  cancel-in-progress: true

jobs:
  audit:
    name: Dependencias npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture audit evidence
        run: |
          npm audit --json > npm-audit-full.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node scripts/resumir-auditoria-dependencias.mjs
      - name: Enforce dependency policy
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit-${{ github.run_id }}
          path: |
            npm-audit-full.json
            npm-audit-production.json
          retention-days: 30
          if-no-files-found: error
