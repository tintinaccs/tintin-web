name: Mantenimiento — dependencias y flujos protegidos

on:
  workflow_run:
    workflows: ['*']
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      maintenance:
        description: Revisar una renovación de archivos protegidos (requiere PR y SHA)
        required: true
        default: false
        type: boolean
      pr:
        description: Número del PR abierto contra main (solo mantenimiento de flujos)
        required: false
        type: string
      head_sha:
        description: SHA completo del candidato (solo mantenimiento de flujos)
        required: false
        type: string
  schedule:
    - cron: '15 12 * * 1'

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: ${{ (github.event_name == 'pull_request_target' && format('github-results-pr-{0}', github.event.pull_request.number)) || (github.event_name == 'workflow_run' && github.event.workflow_run.name != 'CI Tintin — contrato único' && format('github-results-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt)) || ((github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI Tintin — contrato único' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) || inputs.maintenance) && format('protected-maintenance-{0}', github.event.workflow_run.head_branch || inputs.pr) || 'dependency-maintenance' }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}

jobs:
  audit:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.maintenance
    name: Dependencias npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture audit evidence
        run: |
          npm audit --json > npm-audit-full.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node scripts/resumir-auditoria-dependencias.mjs
      - name: Enforce dependency policy
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit-${{ github.run_id }}
          path: |
            npm-audit-full.json
            npm-audit-production.json
          retention-days: 30
          if-no-files-found: error

  automatic:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI Tintin — contrato único' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) || inputs.maintenance)
    name: Validar y publicar automáticamente
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
    steps:
      # Sólo código de main. No se instalan ni ejecutan dependencias del PR.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar plan, esperar CI y fusionar el SHA exacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mantenimiento-flujos-github.mjs automatic

  notify:
    name: Registrar resultado terminal
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_run' && github.event.workflow_run.name != 'Mantenimiento — dependencias y flujos protegidos')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      # Sólo código de la rama por defecto; nunca código de la PR que originó el evento.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publicar resultado terminal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/notificar-resultados-github.mjs
