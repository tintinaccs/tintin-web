name: Verify public commerce closeout

on:
  push:
    branches:
      - fix/public-commerce-closeout-20260926
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check cloudflare/checkout-operational-health.js
          node --check cloudflare/system-health.js
          node --check js/pages/collections/estado-colecciones.js
          node --check js/pages/collections/presentacion-colecciones.js
          node --check js/admin/diagnostics/estado-ecosistema-admin.js
      - name: Closeout contracts
        run: node --test tests/public-commerce/closeout-contracts.test.mjs tests/checkout/checkout-operational-health.test.mjs
      - name: Catalog
        run: |
          node scripts/auditar-catalogo-pagina.js
          npm run audit:phase7-catalog
      - name: Collections
        run: |
          node scripts/auditar-colecciones-pagina.js
          npm run audit:collections
      - name: Checkout
        run: |
          npm run audit:secure-orders
          npm run audit:checkout-delivery
      - name: System health
        run: npm run audit:system-health
      - name: Record legitimate cache bumps
        run: |
          npm run cache-versioning:write
          if ! git diff --quiet -- scripts/cache-version-baseline.json scripts/cache-version-approvals.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/cache-version-baseline.json scripts/cache-version-approvals.json
            git commit -m "chore(cache): record public commerce versions"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Cache versioning
        run: npm run audit:cache-versioning
      - name: Finalize generated artifacts and remove temporary CI
        run: |
          git rm .github/workflows/verify-public-commerce-closeout.yml
          npm run build:pages
          git add _headers config/csp-runtime.js config/csp-runtime.json diagnostic-manifest.json .github/workflows/verify-public-commerce-closeout.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh generated artifacts for public commerce closeout"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          npm run build:pages
          git diff --exit-code
      - name: Final release audit
        run: npm run audit:final
