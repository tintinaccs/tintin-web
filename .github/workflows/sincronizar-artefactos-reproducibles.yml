name: Sincronizar artefactos reproducibles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: generated-artifacts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-generated:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama real de la PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Regenerar y validar artefactos publicables
        run: npm run build:pages

      - name: Guardar solo cambios reproducibles generados por el build
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Artefactos ya sincronizados; no hay nada que guardar."
            exit 0
          fi

          echo "Cambios reproducibles detectados:"
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sincronizar artefactos reproducibles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

# Si el build ya está limpio, el workflow termina sin generar otro commit.
