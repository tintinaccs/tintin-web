name: Aplicar corrección de stock visible desde PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Corregir visibilidad, compra y orden
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def sub_required(path, pattern, replacement, *, count=1, flags=0):
              text = read(path)
              updated, matches = re.subn(pattern, replacement, text, count=count, flags=flags)
              if matches != count:
                  raise SystemExit(f'{path}: patrón no aplicado; esperado={count}, encontrado={matches}: {pattern[:100]}')
              write(path, updated)

          def replace_required(path, old, new, *, count=1):
              text = read(path)
              matches = text.count(old)
              if matches != count:
                  raise SystemExit(f'{path}: reemplazo no aplicado; esperado={count}, encontrado={matches}: {old[:100]}')
              write(path, text.replace(old, new, count))

          sub_required(
              'js/phase7-catalog-policy.js',
              r"export function isPurchasable\(product\) \{\n  const p = normalizeProduct\(product\);\n  return Boolean\([\s\S]*?\n  \);\n\}",
              """export function isCatalogVisible(product) {
            const p = normalizeProduct(product);
            return Boolean(
              p.id &&
              p.name &&
              p.category &&
              p.active !== false &&
              Number.isInteger(p.price) &&
              p.price > 0 &&
              p.price <= 1_000_000_000 &&
              (p.stock == null || Number.isInteger(p.stock)) &&
              categoryIsVisible(p)
            );
          }

          export function isPurchasable(product) {
            const p = normalizeProduct(product);
            return isCatalogVisible(p) && (p.stock == null || p.stock > 0);
          }"""
          )

          sub_required(
              'js/phase7-catalog-policy.js',
              r"(function filterProducts\(products\) \{[\s\S]*?\.map\(normalizeProduct\)\n\s*)\.filter\(isPurchasable\)",
              r"\1.filter(isCatalogVisible)"
          )
          replace_required(
              'js/phase7-catalog-policy.js',
              '    if (!isPurchasable(normalized)) {',
              '    if (!isCatalogVisible(normalized)) {'
          )
          replace_required(
              'js/phase7-catalog-policy.js',
              '  normalizeVariantOptions,\n  isPurchasable,',
              '  normalizeVariantOptions,\n  isCatalogVisible,\n  isPurchasable,'
          )

          sub_required(
              'js/products-store.js',
              r"\.filter\(product => window\.TintinCatalogPolicy\?\.isPurchasable\n\s*\? window\.TintinCatalogPolicy\.isPurchasable\(product\)\n\s*: product\.active !== false && Boolean\(product\.name\) && !\(product\.stock != null && Number\(product\.stock\) <= 0\)\)",
              ".filter(product => window.TintinCatalogPolicy?.isCatalogVisible\n      ? window.TintinCatalogPolicy.isCatalogVisible(product)\n      : product.active !== false && Boolean(product.name) && Number.isFinite(Number(product.price)) && Number(product.price) > 0)"
          )
          replace_required(
              'js/products-store.js',
              '  if (window.TintinCatalogPolicy?.isPurchasable && !window.TintinCatalogPolicy.isPurchasable(product)) return null;',
              '  if (window.TintinCatalogPolicy?.isCatalogVisible && !window.TintinCatalogPolicy.isCatalogVisible(product)) return null;'
          )
          replace_required(
              'js/products-store.js',
              '            (window.TintinCatalogPolicy?.isPurchasable && !window.TintinCatalogPolicy.isPurchasable(product))) {',
              '            (window.TintinCatalogPolicy?.isCatalogVisible && !window.TintinCatalogPolicy.isCatalogVisible(product))) {'
          )

          replace_required(
              'catalogo.html',
              '    .tt-card-price { font-size: 15px; font-weight: 800; color: #963653; margin-bottom: 12px; }',
              """    .tt-card-price { font-size: 15px; font-weight: 800; color: #963653; margin-bottom: 8px; }
              .tt-card-stock {
                display: inline-flex; align-items: center; gap: 6px; width: fit-content;
                margin-bottom: 12px; font-size: 10px; font-weight: 800;
                letter-spacing: .08em; text-transform: uppercase;
              }
              .tt-card-stock::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
              .tt-card-stock--in { color: #26824b; }
              .tt-card-stock--out { color: #c52f3f; }"""
          )
          sub_required(
              'catalogo.html',
              r"\n  // Out-of-stock products may appear when browsing a category or searching,\n  // but always sink to the end regardless of the chosen sort order\.\n  lista = \[\.\.\.lista\.filter\(isInStockCat\), \.\.\.lista\.filter\(p => !isInStockCat\(p\)\)\];\n",
              "\n  // El stock no modifica el orden. Un producto agotado conserva exactamente\n  // su posición y vuelve a estar disponible en ese mismo lugar al reponerse.\n"
          )
          replace_required(
              'catalogo.html',
              '          <div class="tt-card-price">${fmt(p.price)}</div>\n          <div class="tt-card-btns">',
              '          <div class="tt-card-price">${fmt(p.price)}</div>\n          <div class="tt-card-stock ${inStock ? \'tt-card-stock--in\' : \'tt-card-stock--out\'}">${inStock ? \'Disponible\' : \'Agotado\'}</div>\n          <div class="tt-card-btns">'
          )
          sub_required(
              'catalogo.html',
              r"\$\{hasVariants\n\s*\? `<a class=\"tt-card-btn tt-card-btn-cart\" href=\"\$\{productHref\}\">Elegir opciones</a>`\n\s*: `<button type=\"button\" class=\"tt-card-btn tt-card-btn-cart\" data-pid=\"\$\{safeId\}\"\$\{inStock \? '' : ' disabled aria-disabled=\"true\"'\}>\$\{inStock \? '\+ Carrito' : 'Agotado'\}</button>`\}",
              "${!inStock\n              ? `<button type=\"button\" class=\"tt-card-btn tt-card-btn-cart\" disabled aria-disabled=\"true\">Agotado</button>`\n              : hasVariants\n                ? `<a class=\"tt-card-btn tt-card-btn-cart\" href=\"${productHref}\">Elegir opciones</a>`\n                : `<button type=\"button\" class=\"tt-card-btn tt-card-btn-cart\" data-pid=\"${safeId}\">+ Carrito</button>`}"
          )

          sub_required(
              'script.js',
              r"function _renderProductDetail\(product\) \{\n  if \(window\.TintinCatalogPolicy\?\.isPurchasable && !window\.TintinCatalogPolicy\.isPurchasable\(product\)\) \{\n    _showProductNotFound\(\);\n    return;\n  \}",
              """function _renderProductDetail(product) {
            const catalogPolicy = window.TintinCatalogPolicy;
            const isVisible = catalogPolicy?.isCatalogVisible
              ? catalogPolicy.isCatalogVisible(product)
              : !(catalogPolicy?.isPurchasable && !catalogPolicy.isPurchasable(product));
            if (!isVisible) {
              _showProductNotFound();
              return;
            }"""
          )

          sub_required(
              'scripts/audit-phase7-catalog.js',
              r"check\(\n  'Productos agotados u ocultos no reaparecen por URL directa',[\s\S]*?\n\);\n",
              """check(
            'Los agotados permanecen visibles, pero no se pueden comprar',
            /export function isCatalogVisible/.test(policy) &&
              /return isCatalogVisible\\(p\\) && \\(p\\.stock == null \\|\\| p\\.stock > 0\\)/.test(policy) &&
              /\\.filter\\(isCatalogVisible\\)/.test(policy) &&
              /TintinCatalogPolicy\\?\\.isCatalogVisible/.test(products) &&
              /catalogPolicy\\?\\.isCatalogVisible/.test(storefront),
            'Stock cero debe conservar la ficha y la tarjeta, mientras carrito y compra siguen bloqueados.'
          );

          check(
            'El stock no altera la posición del producto en el catálogo',
            /El stock no modifica el orden/.test(catalog) &&
              !/lista = \\[\\.\\.\\.lista\\.filter\\(isInStockCat\\)/.test(catalog) &&
              /tt-card-stock--in/.test(catalog) &&
              /Disponible/.test(catalog) &&
              /disabled aria-disabled=\"true\">Agotado/.test(catalog),
            'Agotar o reponer stock no debe mandar la tarjeta al final ni ocultarla.'
          );
          """
          )

          replace_required(
              'js/page-maintenance-loader.js',
              "import './phase7-catalog-policy.js?v=tintin-20260730-phase7-catalog-1';",
              "import './phase7-catalog-policy.js?v=tintin-20260730-stock-visibility-1';"
          )
          replace_required(
              'js/products-store.js',
              "import './page-maintenance-loader.js?v=tintin-20260720-read-budget-1';",
              "import './page-maintenance-loader.js?v=tintin-20260730-stock-visibility-1';"
          )
          replace_required(
              'js/public-shell.js',
              "const VERSION = 'tintin-20260730-performance-phase5-1';",
              "const VERSION = 'tintin-20260730-stock-visibility-1';"
          )
          for page in ('catalogo.html', 'product.html'):
              replace_required(
                  page,
                  'js/public-shell.js?v=tintin-20260730-performance-phase5-1',
                  'js/public-shell.js?v=tintin-20260730-stock-visibility-1'
              )
          replace_required(
              'product.html',
              'script.js?v=tintin-20260730-performance-phase5-2',
              'script.js?v=tintin-20260730-stock-visibility-1'
          )
          PY

      - name: Instalar dependencias y validar
        run: |
          npm ci --ignore-scripts
          node --check js/phase7-catalog-policy.js
          node --check js/products-store.js
          node --check script.js
          npm run audit:phase7-catalog

      - name: Guardar cambios en la rama
        shell: bash
        run: |
          rm -f .github/workflows/apply-stock-visibility-fix.yml
          rm -f .github/workflows/apply-stock-visibility-fix-pr.yml
          rm -f maintenance/trigger-stock-visible-fix.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: mantener agotados visibles y en su posición [stock-fix-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
