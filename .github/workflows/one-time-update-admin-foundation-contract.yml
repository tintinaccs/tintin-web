name: Update admin foundation auth contract

on:
  push:
    branches:
      - fix/admin-auth-guard-20260904
    paths:
      - .github/workflows/one-time-update-admin-foundation-contract.yml

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-guard-20260904
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Replace stale admin auth audit contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/auditar-admin-fundamentos.js')
          src = p.read_text(encoding='utf-8')
          start_marker = '// ===========================================================================\n// 1. AUTENTICACIÓN\n// ===========================================================================\n'
          end_marker = '// ===========================================================================\n// 2. PROTECCIÓN INICIAL (nada privado visible antes del auth)\n// ===========================================================================\n'
          start = src.find(start_marker)
          end = src.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontró el bloque de autenticación de la auditoría')

          new_block = r'''// ===========================================================================
// 1. AUTENTICACIÓN
// ===========================================================================
const authPersistenceAwaitIndex = adminApp.indexOf('await authPersistenceReady');
const authStateReadyIndex = adminApp.indexOf("typeof auth.authStateReady === 'function'");
const authObserverIndex = adminApp.indexOf('onAuthStateChanged(auth, async user');

check(
  'El guard espera la persistencia antes de evaluar la sesión',
  adminApp.includes('authPersistenceReady') &&
    authPersistenceAwaitIndex >= 0 &&
    authObserverIndex > authPersistenceAwaitIndex,
  'admin-app.js debe esperar authPersistenceReady antes de instalar el observador que decide navegación.'
);
check(
  'El guard espera el estado inicial de Firebase Auth cuando la API está disponible',
  authStateReadyIndex >= 0 &&
    /await auth\.authStateReady\(\)/.test(adminApp) &&
    authObserverIndex > authStateReadyIndex,
  'El panel debe permitir que Firebase restaure el usuario antes de interpretar user=null.'
);
check(
  'El guard usa onAuthStateChanged como puerta de entrada',
  /onAuthStateChanged\(auth,\s*async user/.test(adminApp),
  'admin-app.js debe resolver la sesión con onAuthStateChanged antes de mostrar el panel.'
);
check(
  'Sin sesión se redirige a login.html',
  /if \(!user\)\s*\{[\s\S]{0,120}window\.location\.replace\('login\.html'\)/.test(adminApp),
  'Un usuario realmente no autenticado debe terminar en login.html, nunca dentro del panel.'
);
check(
  'Un rol de cliente/sin rol se saca del panel a perfil.html',
  /if \(role === 'client' \|\| !role\)\s*\{[\s\S]{0,120}window\.location\.replace\('perfil\.html'\)/.test(adminApp),
  'Solo roles de staff pueden ver el panel; el resto va a perfil.html.'
);
check(
  'Las cuentas bloqueadas se expulsan con aviso y cierre de sesión explícito',
  /\.blocked\b/.test(adminApp) &&
    /await signOut\(auth\)/.test(adminApp) &&
    /window\.location\.replace\('login\.html\?blocked=1'\)/.test(adminApp),
  'Una cuenta con blocked=true debe cerrar sesión e ir a login.html?blocked=1.'
);
check(
  'El Super Admin nunca entra al chequeo de bloqueo de cuentas regulares',
  /String\(user\.email \|\| ''\)\.trim\(\)\.toLowerCase\(\) !== SUPER_ADMIN\.toLowerCase\(\)/.test(adminApp),
  'El chequeo de bloqueo debe exceptuar al correo oficial del SUPER_ADMIN de forma normalizada.'
);
check(
  'Un fallo de inicialización no convierte una sesión válida en falso logout',
  /console\.error\('\[Admin\] Init error; authenticated session preserved:'/.test(adminApp) &&
    /showAdminInitFailure\(\)/.test(adminApp),
  'Firestore, App Check, permisos o UI pueden fallar sin que eso signifique perder Firebase Auth.'
);
check(
  'El estado de error autenticado conserva el panel privado oculto y ofrece recuperación',
  /function showAdminInitFailure\(\)[\s\S]{0,900}classList\.remove\('adm-auth-ready'\)/.test(adminApp) &&
    /id="adm-init-retry"/.test(adminApp) &&
    /window\.location\.reload\(\)/.test(adminApp),
  'Ante un error de init debe mostrarse una superficie segura de reintento sin revelar el panel ni cerrar sesión.'
);
check(
  'No existe un catch genérico del init autenticado que redirija a login',
  !/Init error; authenticated session preserved:[\s\S]{0,500}location\.(?:href\s*=|replace\()\s*['"]login\.html/.test(adminApp),
  'Los redirects a login deben corresponder a ausencia real de sesión o bloqueo explícito, no a fallos de arranque.'
);
check(
  'La tienda cerrada tapa el panel sin cerrar la sesión del Super Admin',
  /isAccessAllowed\(/.test(adminApp) && /renderStoreClosedOverlay\(\)/.test(adminApp),
  'Un rol sin excepción de tienda cerrada debe ver el overlay, no entrar al panel.'
);

'''

          src = src[:start] + new_block + src[end:]
          p.write_text(src, encoding='utf-8')
          PY
          git rm .github/workflows/one-time-update-admin-foundation-contract.yml

      - name: Rebuild generated artifacts
        run: npm run build:pages

      - name: Validate updated contract
        run: |
          npm run audit:admin-foundation
          npm run audit:typography
          npm run audit:cache-versioning
          node --input-type=module --check < js/admin/admin-app.js
          node --check scripts/auditar-admin-fundamentos.js
          git diff --check

      - name: Commit contract and generated artifacts
        run: |
          git config user.name "Tintin Auth Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(admin): enforce resilient authenticated bootstrap contract"
          git push origin HEAD:fix/admin-auth-guard-20260904
