name: Aplicar rating required temporal

on:
  push:
    branches: [fix/product-review-rating-required]
    paths:
      - '.github/workflows/aplicar-rating-required-temporal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/product-review-rating-required
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aplicar regla obligatoria antes de publicar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/pages/product/resenas-producto.js')
          s = p.read_text()
          old_import = "import { heartIconMarkup } from '../../components/favorites/icono-corazon.js?v=tintin-20260817-heart-icon-1';"
          new_import = old_import + "\nimport { isValidReviewRating, syncReviewPublishState, reportMissingReviewRating } from './validacion-puntuacion-resena.js?v=tintin-20260831-review-rating-required-1';"
          assert s.count(old_import) == 1 and 'validacion-puntuacion-resena.js' not in s
          s = s.replace(old_import, new_import, 1)

          old_sync = "  const status = group.parentElement?.querySelector('[data-rating-status]');\n  if (status) status.textContent = selectedRating ? `${selectedRating} de 5 estrellas seleccionadas` : 'Elegí de 1 a 5 estrellas';\n}"
          new_sync = "  const status = group.parentElement?.querySelector('[data-rating-status]');\n  if (status) status.textContent = selectedRating ? `${selectedRating} de 5 estrellas seleccionadas` : 'Elegí de 1 a 5 estrellas';\n  syncReviewPublishState(document.getElementById('tt-review-editor'), selectedRating);\n}"
          assert s.count(old_sync) == 1
          s = s.replace(old_sync, new_sync, 1)

          old_button = '<button type="submit" class="tt-btn">${logged ? \'Publicar opinión\' : \'Iniciar sesión y publicar\'}</button>'
          new_button = '<button type="submit" class="tt-btn" data-review-submit ${isValidReviewRating(selectedRating) ? \'\' : \'disabled aria-disabled="true"\'}>${logged ? \'Publicar opinión\' : \'Iniciar sesión y publicar\'}</button>'
          assert s.count(old_button) == 1
          s = s.replace(old_button, new_button, 1)

          old_guard = "    if (selectedRating < 1 || selectedRating > 5) {\n      errorNode.textContent = 'Elegí de 1 a 5 estrellas antes de publicar tu comentario.';\n      event.target.querySelector('[data-review-rating]')?.focus();\n      return;\n    }"
          new_guard = "    if (!isValidReviewRating(selectedRating)) {\n      reportMissingReviewRating(event.target);\n      syncReviewPublishState(event.target, selectedRating);\n      return;\n    }"
          assert s.count(old_guard) == 1
          s = s.replace(old_guard, new_guard, 1)
          p.write_text(s)

          h = Path('product.html')
          html = h.read_text()
          old_version = 'js/pages/product/resenas-producto.js?v=tintin-20260829-community-fast-1'
          new_version = 'js/pages/product/resenas-producto.js?v=tintin-20260831-review-rating-required-1'
          assert html.count(old_version) == 1
          html = html.replace(old_version, new_version, 1)
          h.write_text(html)
          PY
      - name: Quitar workflow temporal antes de generar evidencias
        run: git rm .github/workflows/aplicar-rating-required-temporal.yml
      - name: Registrar versiones immutable y regenerar diagnóstico
        run: |
          node scripts/auditar-versionado-cache.mjs --write
          npm run build:diagnostics
      - name: Validar parche
        run: |
          node --check js/pages/product/resenas-producto.js
          node --check js/pages/product/validacion-puntuacion-resena.js
          node scripts/auditar-puntuacion-resena-producto.mjs
          node scripts/auditar-versionado-cache.mjs
          npm run verify:diagnostics
      - name: Commit final reproducible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: exigir estrellas antes de publicar reseña"
          git push origin HEAD:fix/product-review-rating-required
