name: Diagnosticar realtime y cache temporal

on:
  push:
    branches: [feat/instant-auth-notifications-reveal-once]
    paths:
      - '.github/workflows/actualizar-contrato-notificaciones-temporal.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/instant-auth-notifications-reveal-once
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preparar contrato social nuevo solo en runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/engagement/notificaciones-sociales.test.mjs')
          s = p.read_text()
          start = "test('la campana pública evita Firestore para visitas livianas y se hidrata con sesión o demanda', () => {"
          end = "\n\ntest('superadmin recupera estados, auto-marca al abrir y resuelve snapshots tardíos', () => {"
          i = s.find(start)
          j = s.find(end, i)
          if i < 0 or j < 0:
              raise SystemExit('No se encontró el contrato social anterior')
          replacement = """test('la campana pública evita Firestore para visitas y arranca al instante con identidad autenticada', () => {\n  assert.doesNotMatch(navigationRuntime, /function attachNotificationsDemand\\(\\)/);\n  assert.match(navigationRuntime, /NOTIFICATION_TRIGGER_SELECTOR/);\n  assert.match(navigationRuntime, /tintin:auth-identity/);\n  assert.match(navigationRuntime, /window\\.TintinAuthIdentity\\?\\.resolved/);\n  assert.match(navigationRuntime, /applyNotificationIdentity\\(Boolean\\(event\\.detail\\?\\.authenticated\\)\\)/);\n  assert.match(navigationRuntime, /if \\(!authenticated\\) \\{\\s*setNotificationTriggersVisible\\(false\\);\\s*return;/s);\n  assert.match(navigationRuntime, /void loadNotificationsRuntime\\(\\)\\s*\\.then\\(\\(\\) => setNotificationTriggersVisible\\(true\\)\\)/s);\n  assert.match(navigationRuntime, /return primeAuthRuntime\\(\\)/);\n  assert.doesNotMatch(navigationRuntime, /tt_session_started_at|hasActiveSessionHint\\(\\)/);\n  assert.match(sharedIcons, /bell:\\s*'<path/);\n  assert.match(desktopHeader, /svgIcon\\(UI_ICONS\\.bell/);\n  assert.match(tabletHeader, /svgIcon\\(UI_ICONS\\.bell/);\n  assert.match(mobileHeader, /svgIcon\\(UI_ICONS\\.bell/);\n  for (const source of [desktopHeader, tabletHeader, mobileHeader]) {\n    assert.match(source, /data-nav-action=\"notifications\"/);\n    assert.match(source, /data-notification-badge/);\n    assert.match(source, /\\shidden/);\n  }\n});"""
          p.write_text(s[:i] + replacement + s[j:])
          PY
      - name: Test social actualizado
        id: social
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set -o pipefail
          node --test tests/engagement/notificaciones-sociales.test.mjs 2>&1 | tee artifacts/social-debug.log
      - name: Test instantaneidad
        id: instant
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/auditar-instantaneidad-reveal-unico.mjs 2>&1 | tee artifacts/instant-debug.log
      - name: Test cache
        id: cache
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/auditar-versionado-cache.mjs 2>&1 | tee artifacts/cache-debug.log
      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: realtime-cache-debug
          path: artifacts/*-debug.log
          if-no-files-found: error
      - name: Resumen
        if: always()
        run: |
          echo "social=${{ steps.social.outcome }}"
          echo "instant=${{ steps.instant.outcome }}"
          echo "cache=${{ steps.cache.outcome }}"
          test "${{ steps.social.outcome }}" = success
          test "${{ steps.instant.outcome }}" = success
          test "${{ steps.cache.outcome }}" = success
