name: Sincronizar fast navigation final temporal

on:
  push:
    branches:
      - perf/navegacion-inmediata-20260810
    paths:
      - '.github/workflows/sincronizar-fast-nav-final-temporal.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/navegacion-inmediata-20260810
          fetch-depth: 0
      - name: Validar invariantes actualizadas
        run: |
          npm ci
          node scripts/auditar-esquema-color.js
          node scripts/auditar-rendimiento-regresiones.js
          node scripts/auditar-rendimiento-tiempo-real.js
          node --test tests/performance/navegacion-inmediata.test.mjs
      - name: Retirar temporal y regenerar derivados
        run: |
          rm .github/workflows/sincronizar-fast-nav-final-temporal.yml
          npm run build:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci(perf): sincronizar manifiesto final de navegación"
          git push origin HEAD:perf/navegacion-inmediata-20260810
