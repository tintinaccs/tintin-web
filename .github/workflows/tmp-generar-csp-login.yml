name: TMP generar CSP login

on:
  push:
    branches:
      - fix/login-csp-generated-20260904

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generar CSP exacta
        run: node scripts/generar-csp-cloudflare.js
      - name: Mostrar diff CSP
        run: git diff -- _headers config/csp-runtime.json config/csp-runtime.js
