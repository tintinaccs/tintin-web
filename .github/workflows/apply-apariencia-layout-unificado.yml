name: Aplicar layout unificado de Apariencia

on:
  push:
    branches:
      - fix/apariencia-layout-unificado
    paths:
      - .github/workflows/apply-apariencia-layout-unificado.yml
      - .github/tmp-apply-apariencia-layout.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/apariencia-layout-unificado
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aplicar cambios
        run: python .github/tmp-apply-apariencia-layout.py

      - name: Retirar herramientas temporales
        run: rm .github/workflows/apply-apariencia-layout-unificado.yml .github/tmp-apply-apariencia-layout.py

      - name: Regenerar baseline y artefactos
        run: |
          npm run cache-versioning:write
          npm run build:pages

      - name: Verificar arquitectura y sintaxis
        run: |
          node --check js/admin/content/gestion-contenido-admin.js
          node --check js/admin/appearance/editor-visual-admin.js
          npm run audit:appearance-unified
          npm run audit:content-appearance
          npm run audit:cache-versioning
          npm run verify:csp
          npm run verify:diagnostics

      - name: Instalar Chromium
        run: npx playwright install chromium

      - name: Probar layout responsive solicitado
        run: npx playwright test tests/visual-builder/apariencia-preview-abajo.spec.js --project=chromium

      - name: Commit clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): unificar editor y layout de Apariencia"
          git push origin HEAD:fix/apariencia-layout-unificado
