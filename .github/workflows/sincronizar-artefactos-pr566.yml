name: Sincronizar artefactos PR566 (temporal)

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr566-generated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-generated:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retirar workflow temporal antes del manifiesto
        shell: bash
        run: rm -f .github/workflows/sincronizar-artefactos-pr566.yml
      - name: Regenerar artefactos finales
        run: npm run build:pages
      - name: Guardar artefactos finales y retirar workflow temporal
        shell: bash
        run: |
          git add -A .github/workflows/sincronizar-artefactos-pr566.yml diagnostic-manifest.json scripts/cache-version-baseline.json _headers _routes.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sincronizar artefactos tras actualizar con main"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
