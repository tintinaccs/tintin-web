name: Auditoría de versionado de caché

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'js/**/*.js'
      - 'js/**/*.mjs'
      - 'css/**/*.css'
      - 'scripts/sincronizar-inicio-navegacion-publica.js'
      - 'scripts/auditar-versionado-cache.mjs'
      - 'scripts/cache-version-baseline.json'
      - 'scripts/cache-version-approvals.json'
      - 'package.json'
      - '.github/workflows/auditar-versionado-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-versioning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cache-versioning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync published shell versions
        run: npm run sync:public-shell
      - name: Audit cache versioning
        run: npm run audit:cache-versioning
