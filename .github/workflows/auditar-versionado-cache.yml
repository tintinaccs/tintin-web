name: Auditoría de versionado de caché

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'js/**/*.js'
      - 'js/**/*.mjs'
      - 'css/**/*.css'
      - 'scripts/auditar-versionado-cache.mjs'
      - 'scripts/cache-version-baseline.json'
      - 'package.json'
      - '.github/workflows/auditar-versionado-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-responsive:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/apariencia-preview-responsive' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout rama del PR
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar tag y regenerar archivos derivados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = 'css/admin/editor-visual.css?v=tintin-20260811-cls-desktop-stable-2'
          new = 'css/admin/editor-visual.css?v=tintin-20260812-apariencia-responsive-1'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Esperaba exactamente 1 referencia antigua y encontre {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          npm run cache-versioning:write
          npm run build:diagnostics
          npm run audit:visual-builder

      - name: Restaurar workflows y guardar resultado final
        shell: bash
        run: |
          rm -f .github/workflows/temp-regenerar-apariencia-responsive.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/auditar-versionado-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(apariencia): actualizar version y manifiestos'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  cache-versioning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit cache versioning
        run: npm run audit:cache-versioning
