name: Regenerar manifiesto de Dependabot

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  regenerate-manifest:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout de la rama de Dependabot
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Construir el manifiesto sin secretos
        run: |
          npm ci
          npm run build:pages

      - name: Detectar el manifiesto generado
        id: manifest
        run: |
          if git diff --quiet -- diagnostic-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir solo el manifiesto generado
        if: steps.manifest.outputs.changed == 'true' && env.MANIFEST_PUSH_TOKEN != ''
        env:
          MANIFEST_PUSH_TOKEN: ${{ secrets.MANIFEST_PUSH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- diagnostic-manifest.json
          git commit -m "chore(diagnostics): regenerar manifiesto de Dependabot"
          git push "https://x-access-token:${MANIFEST_PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${HEAD_REF}"

      - name: Informar si falta el secreto
        if: steps.manifest.outputs.changed == 'true' && env.MANIFEST_PUSH_TOKEN == ''
        env:
          MANIFEST_PUSH_TOKEN: ${{ secrets.MANIFEST_PUSH_TOKEN }}
        run: echo "MANIFEST_PUSH_TOKEN no está disponible; se omite el push sin fallar."
