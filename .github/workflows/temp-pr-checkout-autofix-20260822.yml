name: TEMP checkout audit-fix source

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Fuente de corrección
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          level2_path = Path('scripts/auditar-nivel-2-comercio.js')
          level2 = level2_path.read_text(encoding='utf-8')
          old_level2 = "    phase4.includes(\"phase4UpdateWrite_('products/' + item.id\") &&\n    phase4.includes('phase4Commit_(writes, transactionId)') &&"
          new_level2 = "    phase4.includes('Object.keys(requestedQtyByProduct).forEach(function (productId)') &&\n    phase4.includes(\"phase4UpdateWrite_('products/' + productId\") &&\n    phase4.includes('stock: stock - requestedQtyByProduct[productId]') &&\n    phase4.includes('phase4Commit_(writes, transactionId)') &&"
          if old_level2 not in level2:
              raise SystemExit('No se encontró el chequeo de descuento de stock antiguo')
          level2 = level2.replace(old_level2, new_level2, 1)
          level2_path.write_text(level2, encoding='utf-8')

          loading_path = Path('scripts/auditar-pagina-carga.js')
          loading = loading_path.read_text(encoding='utf-8')
          old_loading = "  const ids = [...html.matchAll(/\\bid\\s*=\\s*([\"'])(.*?)\\1/gi)]\n    .map(match => match[2])\n    .filter(id => id && !/\\$\\{|\\{\\{|<%/.test(id));"
          new_loading = "  // Auditar IDs solo en el marcado real: una asignación JavaScript como\n  // `group.id = '...'` no crea un segundo nodo simultáneo en el DOM.\n  const markupWithoutScripts = html.replace(/<script\\b[^>]*>[\\s\\S]*?<\\/script>/gi, ' ');\n  const ids = [...markupWithoutScripts.matchAll(/\\bid\\s*=\\s*([\"'])(.*?)\\1/gi)]\n    .map(match => match[2])\n    .filter(id => id && !/\\$\\{|\\{\\{|<%/.test(id));"
          if old_loading not in loading:
              raise SystemExit('No se encontró el detector de IDs antiguo')
          loading = loading.replace(old_loading, new_loading, 1)
          loading_path.write_text(loading, encoding='utf-8')
          PY