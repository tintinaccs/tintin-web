name: TEMP checkout patch source final

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Fuente del parche
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/orders/pedido-checkout-seguro.js')
          text = path.read_text(encoding='utf-8')

          legacy_old = "          return {\n            name: text(item),\n            price: parseMoney(fallback),\n            sourceIndex\n          };"
          legacy_new = "          return {\n            name: text(item),\n            price: parseMoney(fallback),\n            departamento: 'Central',\n            sourceIndex\n          };"
          if legacy_old in text:
              text = text.replace(legacy_old, legacy_new, 1)

          object_old = "        return {\n          name: text(item.name),\n          price: Number.isFinite(price) ? price : null,\n          sourceIndex\n        };"
          object_new = "        return {\n          name: text(item.name),\n          price: Number.isFinite(price) ? price : null,\n          departamento: text(item.departamento) || 'Central',\n          sourceIndex\n        };"
          if object_old in text:
              text = text.replace(object_old, object_new, 1)

          if 'function resolveShipping(settings, selectedCity, selectedDepartment, requestedMethod, location)' not in text:
              resolver = "\n".join([
                  "  function resolveShipping(settings, selectedCity, selectedDepartment, requestedMethod, location) {",
                  "    const requested = text(requestedMethod);",
                  "    if (selectedCity === '__retiro__') {",
                  "      if (requested && requested !== 'retiro') {",
                  "        throw appError('shipping_changed', 'El método de entrega cambió. Volvé a elegir cómo recibir tu pedido.');",
                  "      }",
                  "      return {",
                  "        method: 'retiro',",
                  "        city: 'Retiro coordinado',",
                  "        departamento: 'Central',",
                  "        cost: 0,",
                  "        pending: false,",
                  "        rateIndex: -1,",
                  "        mapLocation: null",
                  "      };",
                  "    }",
                  "",
                  "    if (!['delivery', 'encomienda'].includes(requested)) {",
                  "      throw appError('shipping_invalid', 'Volvé a elegir tu ciudad y método de entrega.');",
                  "    }",
                  "",
                  "    const wanted = text(selectedCity).toLocaleLowerCase('es');",
                  "    const wantedDepartment = text(selectedDepartment).toLocaleLowerCase('es');",
                  "    const matches = city =>",
                  "      city.name.toLocaleLowerCase('es') === wanted &&",
                  "      (!wantedDepartment || city.departamento.toLocaleLowerCase('es') === wantedDepartment);",
                  "",
                  "    if (requested === 'delivery') {",
                  "      const delivery = normalizeCities(settings.deliveryCities, settings.deliveryCost).find(matches);",
                  "      if (!delivery) {",
                  "        throw appError('shipping_invalid', 'La ciudad elegida ya no está disponible para delivery.');",
                  "      }",
                  "      return {",
                  "        method: 'delivery',",
                  "        city: delivery.name,",
                  "        departamento: delivery.departamento,",
                  "        cost: delivery.price,",
                  "        pending: delivery.price === null,",
                  "        rateIndex: delivery.sourceIndex,",
                  "        mapLocation: location",
                  "      };",
                  "    }",
                  "",
                  "    const encomienda = normalizeCities(settings.encomiendaCities, settings.encomiendaCost).find(matches);",
                  "    if (!encomienda) {",
                  "      throw appError('shipping_invalid', 'La ciudad elegida ya no está disponible para encomienda.');",
                  "    }",
                  "    const mode = encomiendaMode();",
                  "    if (!mode) {",
                  "      throw appError('shipping_invalid', 'Elegí si retirás en la agencia o si te lo llevamos a la puerta.');",
                  "    }",
                  "    return {",
                  "      method: 'encomienda',",
                  "      encomiendaMode: mode,",
                  "      city: encomienda.name,",
                  "      departamento: encomienda.departamento,",
                  "      cost: 0,",
                  "      pending: false,",
                  "      rateIndex: encomienda.sourceIndex,",
                  "      mapLocation: mode === 'puerta' ? location : null",
                  "    };",
                  "  }",
              ])
              text, count = re.subn(
                  r"  function resolveShipping\(settings, selectedCity, location\) \{.*?\n  \}\n\n  function readPhone\(\)",
                  resolver + "\n\n  function readPhone()",
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'No se pudo reemplazar resolveShipping: {count}')

          old_call = "\n".join([
              "    const selectedCity = text(document.getElementById('ck-city')?.value);",
              "    const selectedDepartamentoRaw = text(document.getElementById('ck-departamento')?.value);",
              "    const selectedDepartamento = selectedDepartamentoRaw === '__retiro__' ? '' : selectedDepartamentoRaw;",
              "    const shipping = resolveShipping(settings, selectedCity, mapLocation());",
          ])
          new_call = "\n".join([
              "    const citySelect = document.getElementById('ck-city');",
              "    const selectedCity = text(citySelect?.value);",
              "    const selectedDepartamentoRaw = text(document.getElementById('ck-departamento')?.value);",
              "    const selectedDepartamento = selectedDepartamentoRaw === '__retiro__' ? '' : selectedDepartamentoRaw;",
              "    const selectedOption = citySelect?.options?.[citySelect.selectedIndex];",
              "    const selectedGroupId = selectedOption?.parentElement?.id || '';",
              "    const requestedShippingMethod = selectedCity === '__retiro__'",
              "      ? 'retiro'",
              "      : selectedGroupId === 'ck-city-delivery-group'",
              "        ? 'delivery'",
              "        : selectedGroupId === 'ck-city-encomienda-group'",
              "          ? 'encomienda'",
              "          : '';",
              "    if (!requestedShippingMethod) {",
              "      throw appError('shipping_invalid', 'Volvé a elegir tu ciudad y método de entrega.');",
              "    }",
              "    const shipping = resolveShipping(",
              "      settings,",
              "      selectedCity,",
              "      selectedDepartamento,",
              "      requestedShippingMethod,",
              "      mapLocation()",
              "    );",
          ])
          if old_call in text:
              text = text.replace(old_call, new_call, 1)

          old_quote = "\n".join([
              "  function authoritativeCartFromQuote(quote) {",
              "    const currentById = new Map(getCartLocal().map(item => [String(item.id), item]));",
              "    return (quote.items || []).map(item => ({",
              "      ...(currentById.get(String(item.id)) || {}),",
              "      id: item.id,",
              "      name: item.name,",
              "      cat: item.cat || '',",
              "      price: Number(item.price || 0),",
              "      qty: Number(item.qty || 1),",
              "      variant: item.variant || '',",
              "      imageUrl: item.imageUrl || '',",
              "      imgUrl: item.imageUrl || ''",
              "    }));",
              "  }",
          ])
          new_quote = "\n".join([
              "  function cartLineKey(item) {",
              "    return `${String(item?.id ?? '')}\\u241f${text(item?.variant)}`;",
              "  }",
              "",
              "  function authoritativeCartFromQuote(quote) {",
              "    const currentByLine = new Map(getCartLocal().map(item => [cartLineKey(item), item]));",
              "    return (quote.items || []).map(item => ({",
              "      ...(currentByLine.get(cartLineKey(item)) || {}),",
              "      id: item.id,",
              "      name: item.name,",
              "      cat: item.cat || '',",
              "      price: Number(item.price || 0),",
              "      qty: Number(item.qty || 1),",
              "      variant: item.variant || '',",
              "      imageUrl: item.imageUrl || '',",
              "      imgUrl: item.imageUrl || ''",
              "    }));",
              "  }",
          ])
          if old_quote in text:
              text = text.replace(old_quote, new_quote, 1)

          required = [
              'function resolveShipping(settings, selectedCity, selectedDepartment, requestedMethod, location)',
              "selectedGroupId === 'ck-city-delivery-group'",
              "selectedGroupId === 'ck-city-encomienda-group'",
              "city.departamento.toLocaleLowerCase('es') === wantedDepartment",
              'function cartLineKey(item)',
              'currentByLine.get(cartLineKey(item))',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Corrección incompleta: ' + ', '.join(missing))
          path.write_text(text, encoding='utf-8')

          cart_ref = re.compile(r'(sincronizacion-carrito\.js\?v=)[A-Za-z0-9._-]+')
          final_cart_tag = 'tintin-20260822-checkout-final-cart-1'
          for file in Path('.').rglob('*'):
              if not file.is_file() or file.suffix.lower() not in {'.js', '.mjs', '.html'}:
                  continue
              if '.git' in file.parts or 'node_modules' in file.parts:
                  continue
              try:
                  source = file.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated, count = cart_ref.subn(rf'\g<1>{final_cart_tag}', source)
              if count:
                  file.write_text(updated, encoding='utf-8')

          test_path = Path('tests/checkout/checkout-hardening-runtime.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'secure checkout resolves shipping by city, department and selected method'
          if marker not in tests:
              tests += "\n" + "\n".join([
                  "test('secure checkout resolves shipping by city, department and selected method', () => {",
                  "  const secure = fs.readFileSync(path.join(root, 'js', 'orders', 'pedido-checkout-seguro.js'), 'utf8');",
                  "  assert.match(secure, /resolveShipping\\(settings, selectedCity, selectedDepartment, requestedMethod, location\\)/);",
                  "  assert.match(secure, /selectedGroupId === 'ck-city-delivery-group'/);",
                  "  assert.match(secure, /selectedGroupId === 'ck-city-encomienda-group'/);",
                  "  assert.match(secure, /city\\.departamento\\.toLocaleLowerCase\\('es'\\) === wantedDepartment/);",
                  "});",
                  "",
                  "test('quote recovery matches current cart metadata by product and variant', () => {",
                  "  const secure = fs.readFileSync(path.join(root, 'js', 'orders', 'pedido-checkout-seguro.js'), 'utf8');",
                  "  assert.match(secure, /function cartLineKey\\(item\\)/);",
                  "  assert.match(secure, /currentByLine\\.get\\(cartLineKey\\(item\\)\\)/);",
                  "  assert.doesNotMatch(secure, /currentById\\.get\\(String\\(item\\.id\\)\\)/);",
                  "});",
                  "",
              ])
          test_path.write_text(tests, encoding='utf-8')
          PY
