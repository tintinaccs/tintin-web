name: TEMP checkout merge-main source

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Fuente de integración
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          subprocess.run(
              ['git', 'merge', '--no-commit', '-X', 'theirs', 'origin/main'],
              check=True,
          )
          PY