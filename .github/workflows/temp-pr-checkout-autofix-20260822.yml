name: TEMP PR checkout autofix final 2026-08-22

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama del PR
        uses: actions/checkout@v5
        with:
          ref: fix/checkout-hardening-2026-08-22
          fetch-depth: 0

      - name: Evitar segunda pasada
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[checkout-autofix\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Aplicar correcciones
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label):
              out, count = re.subn(pattern, lambda m: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'No se pudo aplicar {label}: coincidencias={count}')
              return out

          path = Path('apps-script/CrearPedido.gs')
          text = path.read_text(encoding='utf-8')

          normalize_cart = r'''function phase4NormalizeCartLines_(cartLines) {
            if (!Array.isArray(cartLines) || !cartLines.length) return { ok: false, error: 'empty_cart' };
            if (cartLines.length > PHASE4_MAX_ITEMS_) return { ok: false, error: 'too_many_products' };
            var byLine = Object.create(null);
            var orderedKeys = [];
            for (var i = 0; i < cartLines.length; i++) {
              var rawLine = cartLines[i];
              if (!phase4HasOnlyKeys_(rawLine, ['id', 'qty', 'variants', 'variant'])) return { ok: false, error: 'invalid_cart' };
              var id = phase4CleanText_(rawLine.id, 180);
              var qty = Number(rawLine.qty);
              var legacyVariants = rawLine.variants;
              if (legacyVariants !== undefined && legacyVariants !== null && !Array.isArray(legacyVariants)) return { ok: false, error: 'invalid_cart' };
              if (Array.isArray(legacyVariants) && legacyVariants.length > 1) return { ok: false, error: 'invalid_cart' };
              if (rawLine.variant !== undefined && rawLine.variant !== null && rawLine.variant !== '' && typeof rawLine.variant !== 'string') return { ok: false, error: 'invalid_cart' };
              var legacyVariant = Array.isArray(legacyVariants) && legacyVariants.length ? legacyVariants[0] : '';
              if (legacyVariant && typeof legacyVariant !== 'string') return { ok: false, error: 'invalid_cart' };
              var explicitVariant = phase4CleanText_(rawLine.variant, 120);
              var migratedVariant = phase4CleanText_(legacyVariant, 120);
              if (explicitVariant && migratedVariant && explicitVariant !== migratedVariant) return { ok: false, error: 'invalid_cart' };
              var variant = explicitVariant || migratedVariant;
              if (!id || !isFinite(qty) || !Number.isInteger(qty) || qty < 1 || qty > 99) return { ok: false, error: 'invalid_cart' };
              var lineKey = JSON.stringify([id, variant]);
              if (!byLine[lineKey]) {
                byLine[lineKey] = { id: id, qty: 0, variant: variant };
                orderedKeys.push(lineKey);
              }
              byLine[lineKey].qty += qty;
              if (byLine[lineKey].qty > 99) return { ok: false, error: 'invalid_cart' };
            }
            return { ok: true, lines: orderedKeys.map(function (key) { return byLine[key]; }) };
          }'''
          text = sub_once(text, r"function phase4NormalizeCartLines_\(cartLines\) \{.*?\n\}\n\nfunction phase4VariantGroups_", normalize_cart + "\n\nfunction phase4VariantGroups_", 'normalización del carrito servidor')

          normalize_cities = r'''function phase4NormalizeDepartment_(value) {
            return phase4CleanText_(value, 80) || 'Central';
          }

          function phase4NormalizeCities_(list, fallbackCost) {
            return (Array.isArray(list) ? list : []).map(function (item, index) {
              if (typeof item === 'string') return { name: phase4CleanText_(item, 120), price: phase4ParseMoney_(fallbackCost), departamento: 'Central', sourceIndex: index };
              if (!item || !item.name) return null;
              var price = item.price === null ? null : phase4ParseMoney_(item.price === undefined ? fallbackCost : item.price);
              return { name: phase4CleanText_(item.name, 120), price: isFinite(price) ? price : null, departamento: phase4NormalizeDepartment_(item.departamento), sourceIndex: index };
            }).filter(function (city) { return city && city.name; });
          }'''
          text = sub_once(text, r"function phase4NormalizeCities_\(list, fallbackCost\) \{.*?\n\}\n\n// Espejo", normalize_cities + "\n\n// Espejo", 'normalización de ciudades/departamentos')

          resolve_shipping = r'''function phase4ResolveShipping_(shippingRates, selectedCity, selectedDepartment, requestedMethod) {
            var requested = phase4CleanText_(requestedMethod, 20);
            if (selectedCity === '__retiro__') {
              if (requested && requested !== 'retiro') return { ok: false, error: 'shipping_changed' };
              return { ok: true, method: 'retiro', city: 'Retiro coordinado', departamento: 'Central', cost: 0, pending: false, rateIndex: -1 };
            }
            var wanted = String(selectedCity || '').trim().toLowerCase();
            var wantedDepartment = phase4CleanText_(selectedDepartment, 80).toLowerCase();
            function matches(city) {
              if (!city || city.name.toLowerCase() !== wanted) return false;
              return !wantedDepartment || city.departamento.toLowerCase() === wantedDepartment;
            }
            var delivery = requested && requested !== 'delivery' ? null : phase4NormalizeCities_(shippingRates.deliveryCities, shippingRates.deliveryCost).filter(matches)[0];
            if (delivery) return { ok: true, method: 'delivery', city: delivery.name, departamento: delivery.departamento, cost: delivery.price, pending: delivery.price === null, rateIndex: delivery.sourceIndex };
            var encomienda = requested && requested !== 'encomienda' ? null : phase4NormalizeCities_(shippingRates.encomiendaCities, shippingRates.encomiendaCost).filter(matches)[0];
            if (encomienda) return { ok: true, method: 'encomienda', city: encomienda.name, departamento: encomienda.departamento, cost: 0, pending: false, rateIndex: encomienda.sourceIndex };
            return { ok: false, error: 'shipping_invalid' };
          }'''
          text = sub_once(text, r"function phase4ResolveShipping_\(shippingRates, selectedCity\) \{.*?\n\}\n\n/\*\*", resolve_shipping + "\n\n/**", 'resolución de envío servidor')

          old = "  var cartLines = normalizedCart.lines;\n\n  var name = phase4CleanText_(payload.name, 120);"
          new = "  var cartLines = normalizedCart.lines;\n  var requestedQtyByProduct = Object.create(null);\n  cartLines.forEach(function (line) {\n    requestedQtyByProduct[line.id] = (requestedQtyByProduct[line.id] || 0) + Number(line.qty || 0);\n  });\n\n  var name = phase4CleanText_(payload.name, 120);"
          if old not in text: raise SystemExit('No se encontró inserción de stock agregado')
          text = text.replace(old, new, 1)

          old = "    var shipping = phase4ResolveShipping_(shippingRatesMerged, selectedCity);\n    if (!shipping.ok) { phase4Rollback_(transactionId); return shipping; }\n    var requestedShippingMethod = phase4CleanText_(payload.shippingMethod, 20);"
          new = "    var requestedShippingMethod = phase4CleanText_(payload.shippingMethod, 20);\n    var shipping = phase4ResolveShipping_(shippingRatesMerged, selectedCity, departamento, requestedShippingMethod);\n    if (!shipping.ok) { phase4Rollback_(transactionId); return shipping; }"
          if old not in text: raise SystemExit('No se encontró bloque de resolveShipping')
          text = text.replace(old, new, 1)

          old = "if (stock !== null && qty > stock) {\n        phase4Rollback_(transactionId);\n        return { ok: false, error: 'insufficient_stock', productId: productId, available: stock, requested: qty };\n      }"
          new = "if (stock !== null && requestedQtyByProduct[productId] > stock) {\n        phase4Rollback_(transactionId);\n        return { ok: false, error: 'insufficient_stock', productId: productId, available: stock, requested: requestedQtyByProduct[productId] };\n      }"
          if old not in text: raise SystemExit('No se encontró validación de stock')
          text = text.replace(old, new, 1)

          variant_block = r'''      var selectedVariant = phase4CleanText_(line.variant, 120);
              if (!phase4VariantIsValid_(product, selectedVariant)) {
                phase4Rollback_(transactionId);
                return { ok: false, error: selectedVariant ? 'invalid_variant' : 'variant_required', productId: productId };
              }
              resolvedItems.push({
                id: productId,
                name: phase4CleanText_(product.name || product.title || 'Producto', 180),
                cat: phase4CleanText_(product.category || product.collectionSlug || product.collection || product.cat || '', 120),
                price: price,
                qty: qty,
                variant: selectedVariant,
                imageUrl: phase4CleanText_(product.imageUrl || product.image || '', 900)
              });
              subtotal += price * qty;'''
          text = sub_once(text, r"      var variants = Array\.isArray\(line\.variants\).*?      subtotal \+= price \* qty;", variant_block, 'validación de variante servidor')

          stock_writes = r'''    Object.keys(requestedQtyByProduct).forEach(function (productId) {
              var stock = phase4ParseStock_(docs['products/' + productId].stock);
              if (stock !== null) {
                writes.push(phase4UpdateWrite_('products/' + productId, {
                  stock: stock - requestedQtyByProduct[productId],
                  lastStockOrderId: orderId,
                  updatedAt: nowIso
                }, ['stock', 'lastStockOrderId', 'updatedAt']));
              }
            });'''
          text = sub_once(text, r"    resolvedItems\.forEach\(function \(item\) \{\n      var stock = phase4ParseStock_\(docs\['products/' \+ item\.id\]\.stock\);.*?\n    \}\);", stock_writes, 'descuento agregado de stock')
          text = text.replace('departamento: departamento,', 'departamento: shipping.departamento || departamento,', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('checkout.html')
          text = path.read_text(encoding='utf-8')
          old = "  const isDelivery = DELIVERY_CITIES.some(c => c.name === val);\n  const isEncomienda = ENCOMIENDA_CITIES.some(c => c.name === val);"
          new = "  const selectedOption = this.options[this.selectedIndex];\n  const selectedGroupId = selectedOption?.parentElement?.id || '';\n  const isDelivery = selectedGroupId === 'ck-city-delivery-group' || (!selectedGroupId && DELIVERY_CITIES.some(c => c.name === val) && !ENCOMIENDA_CITIES.some(c => c.name === val));\n  const isEncomienda = selectedGroupId === 'ck-city-encomienda-group' || (!selectedGroupId && ENCOMIENDA_CITIES.some(c => c.name === val) && !DELIVERY_CITIES.some(c => c.name === val));"
          if old not in text: raise SystemExit('No se encontró detección de método por ciudad')
          text = text.replace(old, new, 1)

          old = "    document.getElementById('ck-pickup-notice').classList.remove('show');\n    hideEncomiendaModes();\n    return;"
          new = "    document.getElementById('ck-pickup-notice').classList.remove('show');\n    hideEncomiendaModes();\n    orderData.city = '';\n    orderData.shippingMethod = '';\n    orderData.encomiendaMode = '';\n    orderData.shippingCost = 0;\n    orderData.mapLocation = null;\n    refreshPaymentOptions();\n    return;"
          if old not in text: raise SystemExit('No se encontró limpieza de ciudad vacía')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/checkout/checkout-hardening-runtime.test.mjs')
          text = path.read_text(encoding='utf-8').replace("assert.match(hardening, /dataCartVariant/);", "assert.match(hardening, /dataset\\.cartVariant/);")
          path.write_text(text, encoding='utf-8')

          path = Path('tests/checkout/order-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  const rates = {\n    deliveryCities: [{ name: 'Fernando de la Mora', price: 20000 }],\n    encomiendaCities: [{ name: 'Encarnación', price: 35000 }]\n  };\n  assert.deepEqual(\n    JSON.parse(JSON.stringify(server.phase4ResolveShipping_(rates, 'Fernando de la Mora'))),\n    { ok: true, method: 'delivery', city: 'Fernando de la Mora', cost: 20000, pending: false, rateIndex: 0 }\n  );\n  assert.equal(server.phase4ResolveShipping_(rates, 'Encarnación').cost, 0);\n  assert.equal(server.phase4ResolveShipping_(rates, 'Encarnación').method, 'encomienda');\n  assert.equal(server.phase4ResolveShipping_(rates, '__retiro__').cost, 0);"""
          new = """  const rates = {\n    deliveryCities: [{ name: 'Fernando de la Mora', price: 20000, departamento: 'Central' }, { name: 'San Juan', price: 15000, departamento: 'Central' }],\n    encomiendaCities: [{ name: 'Encarnación', price: 35000, departamento: 'Itapúa' }, { name: 'San Juan', price: 30000, departamento: 'Misiones' }]\n  };\n  assert.deepEqual(\n    JSON.parse(JSON.stringify(server.phase4ResolveShipping_(rates, 'Fernando de la Mora', 'Central', 'delivery'))),\n    { ok: true, method: 'delivery', city: 'Fernando de la Mora', departamento: 'Central', cost: 20000, pending: false, rateIndex: 0 }\n  );\n  assert.equal(server.phase4ResolveShipping_(rates, 'Encarnación', 'Itapúa', 'encomienda').cost, 0);\n  assert.equal(server.phase4ResolveShipping_(rates, 'Encarnación', 'Itapúa', 'encomienda').method, 'encomienda');\n  assert.equal(server.phase4ResolveShipping_(rates, 'San Juan', 'Misiones', 'encomienda').departamento, 'Misiones');\n  assert.equal(server.phase4ResolveShipping_(rates, 'San Juan', 'Central', 'delivery').method, 'delivery');\n  assert.equal(server.phase4ResolveShipping_(rates, 'San Juan', 'Central', 'encomienda').ok, false);\n  assert.equal(server.phase4ResolveShipping_(rates, '__retiro__', '', 'retiro').cost, 0);"""
          if old not in text: raise SystemExit('No se encontró test de recalculo de envío')
          text = text.replace(old, new, 1)

          old = """test('cliente y servidor normalizan productId repetido con cantidad agregada', () => {\n  const client = aggregateCheckoutCart([\n    { id: 'p1', qty: 2, variant: 'Dorado / M' },\n    { id: 'p1', qty: 3, variant: 'Plateado / M' }\n  ]);\n  assert.deepEqual(client, [{ id: 'p1', qty: 5, variants: ['Dorado / M', 'Plateado / M'] }]);\n  const server = phase4Context().phase4NormalizeCartLines_([\n    { id: 'p1', qty: 2, variant: 'Dorado / M' },\n    { id: 'p1', qty: 3, variants: ['Plateado / M'] }\n  ]);\n  assert.equal(server.ok, true);\n  assert.equal(server.lines.length, 1);\n  assert.equal(server.lines[0].qty, 5);\n});"""
          new = """test('cliente y servidor conservan cantidades separadas por variante', () => {\n  const client = aggregateCheckoutCart([\n    { id: 'p1', qty: 2, variant: 'Dorado / M' },\n    { id: 'p1', qty: 3, variant: 'Plateado / M' }\n  ]);\n  assert.deepEqual(client, [\n    { id: 'p1', qty: 2, variant: 'Dorado / M' },\n    { id: 'p1', qty: 3, variant: 'Plateado / M' }\n  ]);\n  const server = phase4Context().phase4NormalizeCartLines_([\n    { id: 'p1', qty: 2, variant: 'Dorado / M' },\n    { id: 'p1', qty: 3, variants: ['Plateado / M'] }\n  ]);\n  assert.equal(server.ok, true);\n  assert.deepEqual(JSON.parse(JSON.stringify(server.lines)), [\n    { id: 'p1', qty: 2, variant: 'Dorado / M' },\n    { id: 'p1', qty: 3, variant: 'Plateado / M' }\n  ]);\n});"""
          if old not in text: raise SystemExit('No se encontró test legado de variantes')
          text = text.replace(old, new, 1)
          text = text.replace("assert.equal(result.order.items.length, 1);\n  assert.equal(result.order.items[0].qty, 5);", "assert.equal(result.order.items.length, 2);\n  assert.equal(result.order.items[0].qty, 2);\n  assert.equal(result.order.items[0].variant, 'Dorado / M');\n  assert.equal(result.order.items[1].qty, 3);\n  assert.equal(result.order.items[1].variant, 'Plateado / M');", 1)
          path.write_text(text, encoding='utf-8')

          replacements = {
              'cargador-mantenimiento-pagina.js?v=tintin-20260821-accounts-phase-a-1': 'cargador-mantenimiento-pagina.js?v=tintin-20260822-checkout-hardening-2',
              'create-order-client.js?v=tintin-20260811-phone-order-1': 'create-order-client.js?v=tintin-20260822-checkout-hardening-2',
              'politica-checkout.js?v=tintin-20260822-facturacion-1': 'politica-checkout.js?v=tintin-20260822-checkout-hardening-2',
          }
          for file in Path('.').rglob('*'):
              if not file.is_file() or file.suffix.lower() not in {'.js', '.mjs', '.html'}: continue
              try: source = file.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              changed = source
              for before, after in replacements.items(): changed = changed.replace(before, after)
              if changed != source: file.write_text(changed, encoding='utf-8')
          PY

      - name: Instalar dependencias
        if: steps.guard.outputs.skip != 'true'
        run: npm install

      - name: Validar sintaxis
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --check js/create-order-client.js
          node --check js/orders/politica-checkout.js
          node --check js/pages/checkout/checkout-hardening.js
          cp apps-script/CrearPedido.gs /tmp/CrearPedido.js
          node --check /tmp/CrearPedido.js

      - name: Probar contrato de checkout
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:checkout-contract

      - name: Auditar pedidos seguros
        if: steps.guard.outputs.skip != 'true'
        run: npm run audit:secure-orders

      - name: Auditar versionado de caché
        if: steps.guard.outputs.skip != 'true'
        run: npm run audit:cache-versioning

      - name: Commit y push
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Tintin Checkout Autofix"
          git config user.email "actions@users.noreply.github.com"
          git add apps-script/CrearPedido.gs checkout.html js tests
          git diff --cached --check
          git commit -m "fix(checkout): completar validación integral [checkout-autofix]"
          git push origin HEAD:fix/checkout-hardening-2026-08-22
