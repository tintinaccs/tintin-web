name: Hotfix admin auth loop

on:
  push:
    branches:
      - hotfix/admin-auth-loop-deeplink

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v5
        with:
          ref: hotfix/admin-auth-loop-deeplink
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove stale deep-link call and add regression guard
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('js/admin/admin-app.js')
          app = app_path.read_text(encoding='utf-8')
          needle = "    handleContentDeepLink();\n    applyInitialSectionFromUrl();"
          if needle not in app:
              raise SystemExit('Expected stale handleContentDeepLink call was not found exactly once.')
          if app.count('handleContentDeepLink();') != 1:
              raise SystemExit('Unexpected number of stale handleContentDeepLink calls.')
          app = app.replace(needle, "    applyInitialSectionFromUrl();", 1)
          app_path.write_text(app, encoding='utf-8')

          audit_path = Path('scripts/auditar-admin-apariencia-unificada.js')
          audit = audit_path.read_text(encoding='utf-8')
          guard = "check('No queda llamada al deep-link legado eliminado', !app.includes('handleContentDeepLink('));"
          anchor = "check('No queda el editor legado de Contenido en admin-app', !app.includes('// ======== CONTENIDO DEL SITIO ========') && !app.includes('loadContenido()'));"
          if guard not in audit:
              if anchor not in audit:
                  raise SystemExit('Permanent unified-appearance audit anchor not found.')
              audit = audit.replace(anchor, anchor + "\n" + guard, 1)
              audit_path.write_text(audit, encoding='utf-8')

      - name: Regenerate cache versions and generated manifests
        run: |
          npm run cache-versioning:write
          npm run build:csp
          npm run build:diagnostics

      - name: Verify hotfix
        run: |
          npm run audit:appearance-unified
          npm run audit:admin-foundation
          npm run verify:csp
          npm run verify:diagnostics
          npm run audit:cache-versioning

      - name: Commit clean hotfix and remove temporary workflow
        run: |
          git rm .github/workflows/hotfix-admin-auth-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): eliminar llamada legacy que rompe autenticación"
          git push origin HEAD:hotfix/admin-auth-loop-deeplink
