name: Regenerar PR 1396 y revalidar

on:
  push:
    branches:
      - fix/visual-audit-instagram-feed-smoke

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --engine-strict
      - name: Remove temporary workflow before generating canonical artifacts
        run: git rm .github/workflows/regenerate-pr1396.yml
      - name: Generate canonical artifacts
        run: npm run build:pages
      - name: Commit generated artifacts and workflow deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: refresh smoke diagnostic artifacts"
          npm run build:pages
          git diff --exit-code -- .
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Re-run canonical CI and visual audit on cleaned branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run auditar-tintin.yml --ref "${GITHUB_REF_NAME}"
          gh workflow run auditoria-visual.yml --ref "${GITHUB_REF_NAME}"
