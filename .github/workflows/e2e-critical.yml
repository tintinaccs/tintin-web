name: E2E Critical Flows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-critical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contratos operativos
        run: node --test tests/operations/*.test.mjs
      - name: Contrato de backup y restauración
        env:
          FIREBASE_PROJECT_ID: demo-tintin-backup-contract
          FIRESTORE_BACKUP_BUCKET: gs://example-backups
          FIRESTORE_RESTORE_SOURCE: gs://example-backups/snapshot
        run: |
          node scripts/backup-firestore.mjs --dry-run
          node scripts/restore-firestore.mjs --dry-run
      - name: Sesión y cuentas
        run: |
          npm run test:accounts
          npm run audit:login-isolation
          npm run audit:login-profile
      - name: Carrito, checkout e inventario
        run: |
          npm run test:cart-persistence
          npm run test:checkout-contract
          npm run audit:checkout-delivery
          npm run audit:critical-healing
      - name: Push, likes, comentarios y reseñas
        run: |
          npm run test:web-push
          npm run test:engagement
      - name: Seguridad y permisos
        run: |
          npm run audit:security
          npm run audit:app-check-bootstrap
          npm run audit:users-roles

  browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Servir el árbol exacto del PR
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-e2e-server.log 2>&1 &
          echo $! > /tmp/tintin-e2e-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tintin-e2e-server.log || true
          exit 1
      - name: Navegación, loader, accesibilidad y SEO del PR
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run test:navigation-header
          npm run test:phase10-a11y
          npm run test:phase11-seo
      - name: Rendimiento del PR
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
        run: npm run test:performance
