  if (src.encomiendaCost > 0) DEFAULT_ENCOMIENDA_COST = src.encomiendaCost;
  DELIVERY_CITIES   = normalizeCities(src.deliveryCities,   DEFAULT_DELIVERY_COST);
  ENCOMIENDA_CITIES = normalizeCities(src.encomiendaCities, DEFAULT_ENCOMIENDA_COST);
