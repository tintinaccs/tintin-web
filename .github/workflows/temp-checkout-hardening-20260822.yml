          Path('js/pages/checkout/checkout-control-cuota.js').write_text(r'''const COOLDOWN_KEY = 'tt_checkout_quota_cooldown_until';
const COOLDOWN_MS = 60 * 1000;
let timer = 0;
function cooldownUntil() { try { return Number(sessionStorage.getItem(COOLDOWN_KEY) || 0); } catch { return 0; } }
function saveCooldown(until) { try { sessionStorage.setItem(COOLDOWN_KEY, String(until)); } catch {} }
function isQuotaError(error) {
  const code = String(error?.code || error?.name || error?.details?.code || '').toLowerCase();
  const message = String(error?.message || '').toLowerCase();
  return code.includes('resource-exhausted') || message.includes('quota exceeded') || message.includes('resource-exhausted');
}
const errorBox = () => document.getElementById('error-4');
const button = () => document.getElementById('ck-confirm-btn');
function blockedByAnotherGuard(control) {
  return !control || control.dataset.ttCartGuardDisabled === '1' || control.dataset.ttMaintenanceLocked === '1' || document.body?.classList.contains('tt-checkout-submitting');
}
function renderCooldown() {
  clearTimeout(timer);
  const remaining = Math.max(0, cooldownUntil() - Date.now());
  const control = button();
  const box = errorBox();
  if (!remaining) {
    if (control) {
      delete control.dataset.ttQuotaDisabled;
      if (!blockedByAnotherGuard(control)) control.disabled = false;
      if (!control.disabled) control.textContent = '✓ Confirmar pedido';
    }
    window.dispatchEvent(new CustomEvent('tintin:checkout-quota-ended'));
    return;
  }
  const seconds = Math.ceil(remaining / 1000);
  if (control) { control.dataset.ttQuotaDisabled = '1'; control.disabled = true; control.textContent = `Esperá ${seconds} s para reintentar`; }
  if (box) { box.textContent = 'Firestore alcanzó temporalmente el límite de lecturas. Tu pedido no fue creado ni se descontó stock. Conservamos todos tus datos y tu carrito.'; box.classList.add('show'); box.setAttribute('role', 'alert'); }
  timer = window.setTimeout(renderCooldown, 1000);
}
function activateCooldown() { saveCooldown(Date.now() + COOLDOWN_MS); window.setTimeout(renderCooldown, 0); }
window.addEventListener('tintin:checkout-submit-error', event => { if (isQuotaError(event.detail || {})) activateCooldown(); });
window.addEventListener('click', event => {
  const control = event.target?.closest?.('#ck-confirm-btn');
  if (!control || cooldownUntil() <= Date.now()) return;
  event.preventDefault(); event.stopImmediatePropagation(); event.stopPropagation(); renderCooldown();
}, true);
window.addEventListener('unhandledrejection', event => { if (isQuotaError(event.reason)) activateCooldown(); });
if (cooldownUntil() > Date.now()) renderCooldown();
window.TintinCheckoutQuotaGuard = { getRemaining: () => Math.max(0, cooldownUntil() - Date.now()), activate: activateCooldown };
''', encoding='utf-8')

          Path('js/create-order-client.js').write_text(r'''/** TINTIN — Cliente del endpoint server-side de pedidos (Fase 4). */
import { EMAIL_WEBHOOK_URL } from './email/configuracion-correo.js?v=tintin-20260716-cloudinary-fix-1';
import { auth } from './core/firebase/firebase.js?v=tintin-20260730-appcheck-stable-4';
const CREATE_ORDER_TIMEOUT_MS = 35000;
function phoneForOrderServer(value) { return String(value == null ? '' : value).replace(/\D/g, ''); }
export async function createOrderViaServer(draft) {
  const idToken = await auth.currentUser?.getIdToken(true);
  if (!idToken) return { ok: false, error: 'missing_id_token' };
  const serverDraft = { ...draft, phone: phoneForOrderServer(draft?.phone) };
  const controller = new AbortController();
  const timeout = window.setTimeout(() => controller.abort(), CREATE_ORDER_TIMEOUT_MS);
  try {
    const response = await fetch(EMAIL_WEBHOOK_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'createOrder', idToken, ...serverDraft }), signal: controller.signal
    });
    const body = await response.text();
    try { return JSON.parse(body); }
    catch { console.error('[create-order-client] El endpoint devolvió una respuesta no válida. HTTP', response.status); return { ok: false, error: 'invalid_response', status: response.status }; }
  } catch (error) {
    if (error?.name === 'AbortError') return { ok: false, error: 'server_timeout' };
    console.error('[create-order-client] No se pudo conectar con el servidor de pedidos:', error);
    return { ok: false, error: 'network_error' };
  } finally { window.clearTimeout(timeout); }
}
''', encoding='utf-8')

