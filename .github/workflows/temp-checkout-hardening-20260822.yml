test('checkout waits for the authoritative scoped cart in UI and confirmation', () => {
  assert.match(checkout, /awaitCartReady/);
  assert.match(checkout, /async function renderCart\(\) \{\s*await awaitCartReady\(\)/);
  assert.match(checkout, /async function buildConfirmation\(\) \{\s*await awaitCartReady\(\)/);
  assert.match(checkout, /if \(!cartItems\.length\)[\s\S]*return false/);
});

test('real accounts cannot advance before the profile is known', () => {
  assert.match(checkout, /let profileReady = false/);
  assert.match(checkout, /let profileLoadFailed = false/);
  assert.match(checkout, /profileReady &&\s*!profileLoadFailed &&\s*currentUserProfile/);
});

test('same product variants keep independent quantities', () => {
  assert.deepEqual(aggregateCheckoutCart([
    { id: 'A', qty: 2, variant: '6' },
    { id: 'A', qty: 1, variant: '7' },
    { id: 'A', qty: 1, variant: '6' },
  ]), [
    { id: 'A', qty: 3, variant: '6' },
    { id: 'A', qty: 1, variant: '7' },
  ]);
  assert.match(checkout, /data-line-id/);
  assert.match(checkout, /data-cart-variant/);
  assert.match(reliability, /data-line-id/);
  assert.match(reliability, /variant: String\(item\.variant/);
  assert.match(server, /requestedQtyByProduct/);
  assert.match(server, /productIds\.forEach/);
});

test('shipping is identified by method + city + department and free delivery is valid', () => {
  assert.match(checkout, /dataset\.method = 'delivery'/);
  assert.match(checkout, /dataset\.method = 'encomienda'/);
  assert.match(checkout, /deliveryDefault >= 0/);
  assert.match(secure, /selectedDepartamento, requestedMethod/);
  assert.match(secure, /city\.departamento === wantedDepartment/);
  assert.match(server, /phase4ResolveShipping_\(shippingRates, selectedCity, selectedDepartamento, requestedMethod\)/);
  assert.match(server, /departamento: shipping\.departamento/);
});

test('login resume state is not deleted by the reliability layer', () => {
  const body = reliability.match(/function clearResumeState\(\) \{([\s\S]*?)\n  \}/)?.[1] || '';
  assert.doesNotMatch(body, /removeItem/);
});

test('order transport has a timeout and quota guard does not monkey patch console', () => {
  assert.match(client, /AbortController/);
  assert.match(client, /server_timeout/);
  assert.match(secure, /network_error/);
  assert.match(secure, /tintin:checkout-submit-error/);
  assert.doesNotMatch(quota, /console\.error\s*=/);
  assert.match(quota, /ttQuotaDisabled/);
});
