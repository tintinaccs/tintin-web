name: TEMP checkout hardening 2026-08-22

on:
  push:
    branches:
      - fix/checkout-hardening-2026-08-22

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-hardening-2026-08-22
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply checkout hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label, flags=0):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 regex match, found {count}')
              return out

          # ------------------------------------------------------------
          # checkout.html
          # ------------------------------------------------------------
          path = 'checkout.html'
          s = read(path)

          s = replace_once(s,
          "  getCartLocal, setCartLocal, formatPrice, cartTotal,\n  removeFromCart, updateQty, clearCart\n",
          "  getCartLocal, setCartLocal, formatPrice, cartTotal, awaitCartReady,\n  removeFromCart, updateQty, clearCart\n",
          'checkout import awaitCartReady')

