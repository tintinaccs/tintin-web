          s = sub_once(s, r"export function aggregateCheckoutCart\(items\) \{.*?\n\}\n\nexport function composeCheckoutDraft", """export function aggregateCheckoutCart(items) {
  const byLine = new Map();
  for (const item of items || []) {
    const id = clean(item?.id);
    const variant = clean(item?.variant);
    const qty = Number(item?.qty || 1);
    if (!id || !Number.isInteger(qty) || qty < 1 || qty > 99) throw Object.assign(new Error('Encontramos una cantidad no válida en el carrito.'), { code: 'invalid_cart' });
    const key = `${id}\u241f${variant}`;
    const existing = byLine.get(key);
    if (existing) existing.qty += qty;
    else byLine.set(key, { id, qty, variant });
  }
  const result = [...byLine.values()];
  if (result.some(item => item.qty > 99)) throw Object.assign(new Error('La cantidad de una variante es demasiado alta.'), { code: 'invalid_cart' });
  return result;
}

