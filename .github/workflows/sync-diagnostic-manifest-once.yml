name: Sync diagnostic manifest once

on:
  push:
    branches:
      - claude/tintin-technical-audit-b7w1m9
    paths:
      - .github/workflows/sync-diagnostic-manifest-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: claude/tintin-technical-audit-b7w1m9
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate reproducible artifacts
        run: |
          npm run build:pages
          git diff --check

      - name: Commit artifacts and self-remove
        run: |
          rm .github/workflows/sync-diagnostic-manifest-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-manifest.json scripts/cache-version-baseline.json _headers _routes.json .github/workflows/sync-diagnostic-manifest-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync diagnostic manifest for product edge fix"
          git push origin HEAD:claude/tintin-technical-audit-b7w1m9
