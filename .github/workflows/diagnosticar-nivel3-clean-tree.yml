name: Sincronización temporal — shell público Nivel 3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-generated-shell:
    name: Sincronizar salidas canónicas en rama de reparación
    if: github.head_ref == 'fix/nivel3-clean-tree' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de reparación
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generar shell público canónico
        run: npm run build:pages

      - name: Retirar sonda temporal y regenerar manifiesto final
        run: |
          rm .github/workflows/diagnosticar-nivel3-clean-tree.yml
          npm run build:diagnostics

      - name: Verificar que sólo cambien salidas esperadas
        shell: bash
        run: |
          set -euo pipefail
          allowed=$(cat <<'EOF'
          .github/workflows/diagnosticar-nivel3-clean-tree.yml
          404.html
          about.html
          cambios-devoluciones.html
          catalogo.html
          checkout.html
          collections.html
          contact.html
          diagnostic-manifest.json
          envios.html
          index.html
          login.html
          perfil.html
          preguntas-frecuentes.html
          privacidad.html
          product.html
          terminos.html
          EOF
          )
          changed=$(git status --porcelain=v1 | sed -E 's/^.. //' | sort -u)
          unexpected=$(comm -23 <(printf '%s\n' "$changed" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed" | sed 's/^ *//' | sed '/^$/d' | sort -u))
          echo 'Archivos modificados por la sincronización:'
          printf '%s\n' "$changed"
          if [ -n "$unexpected" ]; then
            echo 'ERROR: aparecieron cambios fuera de la lista controlada:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit de salidas sincronizadas en la rama
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            .github/workflows/diagnosticar-nivel3-clean-tree.yml \
            404.html about.html cambios-devoluciones.html catalogo.html checkout.html \
            collections.html contact.html diagnostic-manifest.json envios.html index.html \
            login.html perfil.html preguntas-frecuentes.html privacidad.html product.html terminos.html
          if git diff --cached --quiet; then
            echo 'No hay cambios para consolidar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: sincronizar shell público generado'
          git push origin HEAD:${{ github.head_ref }}
