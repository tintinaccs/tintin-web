name: Auditoría de Web Push

on:
  pull_request:
    paths:
      - 'admin.html'
      - 'admin-manifest.json'
      - 'firebase-messaging-sw.js'
      - 'apps-script/CrearPedido.gs'
      - 'cloudflare/**push*.js'
      - 'functions/api/push-*.js'
      - 'js/admin/notifications/**'
      - 'tests/push/**'
      - 'scripts/auditar-push-web.js'
      - '_headers'
      - '_routes.json'
      - 'firestore.rules'
      - 'package.json'
      - '.github/workflows/auditar-push-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar dependencias de build
        run: npm ci --ignore-scripts
      - name: Auditar arquitectura Web Push
        run: npm run audit:web-push
      - name: Ejecutar pruebas Web Push
        run: npm run test:web-push
      - name: Verificar páginas y CSP
        run: npm run build:pages
