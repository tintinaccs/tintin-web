name: Temporary login-regression sync

on:
  push:
    branches: [tmp/auth-manifest-sync-20260912]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore canonical workflow
        run: git show origin/main:.github/workflows/auditar-tintin.yml > .github/workflows/auditar-tintin.yml
      - name: Include every Login regression in the canonical gate
        run: |
          sed -i 's#node --test tests/login/profile-onboarding.test.mjs#node --test tests/login/*.test.mjs#' package.json
      - name: Generate exact public artifact
        run: npm run build:pages
      - name: Run complete Login regression suite
        run: npm run audit:login-profile
      - name: Commit synchronized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No drift to commit"
            exit 0
          fi
          git commit -m "test: ejecutar todas las regresiones de Login"
          git push origin HEAD:tmp/auth-manifest-sync-20260912
