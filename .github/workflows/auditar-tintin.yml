name: CI Tintin — contrato único

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: read

concurrency:
  group: repository-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository audit
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies once
        run: npm ci

      - name: Synchronize Login Auth closure and immutable cache chain
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(file, old, new):
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{file}: expected exactly 1 occurrence, found {count}: {old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          profile_v = 'tintin-20260912-auth-closure-1'
          correo_v = 'tintin-20260912-auth-closure-2'
          maintenance_v = 'tintin-20260912-auth-closure-2'
          loader_v = 'tintin-20260912-auth-closure-3'
          products_v = 'tintin-20260912-auth-closure-4'
          search_v = 'tintin-20260912-auth-closure-5'
          carga_v = 'tintin-20260912-auth-closure-6'
          entry_v = 'tintin-20260912-auth-closure-7'
          shell_v = 'tintin-20260912-auth-closure-8'

          replace_once('login.html',
              './js/core/store/perfil-usuario.js?v=tintin-20260903-accounts-phase-a-4',
              f'./js/core/store/perfil-usuario.js?v={profile_v}')
          replace_once('login.html',
              './js/email/correo-autenticacion.js?v=tintin-20260905-auth-session-3',
              f'./js/email/correo-autenticacion.js?v={correo_v}')
          replace_once('login.html',
              "const allowed = new Set(['/', '/index', '/index.html', '/product', '/product.html', '/catalogo', '/catalogo.html', '/collections', '/collections.html', '/perfil', '/perfil.html', '/checkout', '/checkout.html']);",
              "const allowed = new Set(['/', '/index', '/index.html', '/product', '/product.html', '/catalogo', '/catalogo.html', '/collections', '/collections.html', '/perfil', '/perfil.html', '/checkout', '/checkout.html', '/contact', '/contact.html', '/about', '/about.html', '/envios', '/envios.html', '/cambios-devoluciones', '/cambios-devoluciones.html', '/preguntas-frecuentes', '/preguntas-frecuentes.html', '/privacidad', '/privacidad.html', '/terminos', '/terminos.html']);")

          replace_once('js/email/correo-autenticacion.js',
              '../core/store/perfil-usuario.js?v=tintin-20260903-accounts-phase-a-4',
              f'../core/store/perfil-usuario.js?v={profile_v}')
          replace_once('js/pages/login/mantenimiento-acceso.js',
              '../../core/store/perfil-usuario.js?v=tintin-20260903-accounts-phase-a-4',
              f'../../core/store/perfil-usuario.js?v={profile_v}')
          replace_once('js/cargador-mantenimiento-pagina.js',
              "return load('pages/login/mantenimiento-acceso.js', 'tintin-20260912-login-profile-recovery-1');",
              f"return load('pages/login/mantenimiento-acceso.js', '{maintenance_v}');")
          replace_once('js/core/store/estado-productos.js',
              "../../cargador-mantenimiento-pagina.js?v=tintin-20260912-login-checkout-maintenance-1",
              f"../../cargador-mantenimiento-pagina.js?v={loader_v}")
          replace_once('js/components/navigation/compartido/control-busqueda.js',
              "../../../core/store/estado-productos.js?v=tintin-20260912-login-checkout-e2e-2",
              f"../../../core/store/estado-productos.js?v={products_v}")
          replace_once('js/components/navigation/compartido/carga-navegacion.js',
              "./control-busqueda.js?v=tintin-20260912-login-checkout-e2e-3",
              f"./control-busqueda.js?v={search_v}")
          replace_once('js/components/navigation/entrada-navegacion-publica.js',
              "./compartido/carga-navegacion.js?v=tintin-20260912-login-checkout-e2e-4",
              f"./compartido/carga-navegacion.js?v={carga_v}")
          replace_once('js/inicio-navegacion-publica.js',
              "const ENTRY_VERSION = 'tintin-20260912-login-checkout-e2e-5';",
              f"const ENTRY_VERSION = '{entry_v}';")
          replace_once('scripts/sincronizar-inicio-navegacion-publica.js',
              "const PUBLIC_SHELL_VERSION = 'tintin-20260912-login-checkout-e2e-6';",
              f"const PUBLIC_SHELL_VERSION = '{shell_v}';")
          replace_once('scripts/sincronizar-inicio-navegacion-publica.js',
              "const NAV_ENTRY_VERSION = 'tintin-20260912-login-checkout-e2e-5';",
              f"const NAV_ENTRY_VERSION = '{entry_v}';")
          replace_once('404.html',
              '/js/inicio-navegacion-publica.js?v=tintin-20260912-login-checkout-e2e-6',
              f'/js/inicio-navegacion-publica.js?v={shell_v}')
          replace_once('404.html',
              '/js/components/navigation/entrada-navegacion-publica.js?v=tintin-20260912-login-checkout-e2e-5',
              f'/js/components/navigation/entrada-navegacion-publica.js?v={entry_v}')
          PY

          node scripts/sincronizar-inicio-navegacion-publica.js
          node scripts/normalizar-rutas-publicas.js
          node scripts/generar-flujo-decisiones-acceso.mjs
          node scripts/generar-csp-cloudflare.js
          node scripts/construir-manifiesto-diagnostico.js
          node scripts/sincronizar-origen-publico.js

          if git diff --quiet -- .; then
            exit 0
          fi
          git config user.name 'Tintin CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .
          git commit -m 'chore: sincronizar cierre Auth y cadena de caché'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Build exact public artifact
        run: npm run build:pages

      - name: Reject generated artifact drift
        run: git diff --exit-code -- .

      - name: Verify CSS source and minified artifact integrity
        run: npm run audit:styles

      - name: Canonical integrations and authority map
        run: node scripts/auditar-integraciones-canonicas.mjs

      - name: Full static contract
        run: npm run audit:final

      - name: Operational, account and sync contracts
        env:
          FIREBASE_PROJECT_ID: demo-tintin-backup-contract
          FIRESTORE_BACKUP_BUCKET: gs://example-backups
          FIRESTORE_RESTORE_SOURCE: gs://example-backups/snapshot
        run: |
          node --test tests/operations/*.test.mjs
          node scripts/backup-firestore.mjs --dry-run
          node scripts/restore-firestore.mjs --dry-run
          npm run test:accounts
          npm run test:cart-persistence
          npm run test:web-push
          npm run test:engagement
          npm run test:products-sync
          npm run test:visual-builder
          node --test tests/code-studio/*.test.mjs

      - name: Firestore identity and adversarial rules
        run: |
          npm run test:rules-critical
          npm run test:rules-phone
          npm run test:rules-username

      - name: Install Chromium once
        run: npx playwright install --with-deps chromium

      - name: Super Admin master contracts
        run: |
          node scripts/auditar-superadmin-maestro.mjs
          node scripts/auditar-superadmin-maestro-conexiones.mjs
          node scripts/auditar-superadmin-cierre-total.mjs
          node scripts/auditar-superadmin-modulos-completos.mjs
          node scripts/auditar-superadmin-maestro-responsive.mjs
          node scripts/auditar-borrado-global-catalogo.mjs

      - name: Serve exact commit for browser gates
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-ci-http.log 2>&1 &
          echo $! > /tmp/tintin-ci-http.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tintin-ci-http.log || true
          exit 1

      - name: Browser, accessibility, SEO and performance gates
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PERF_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run test:navigation-header
          npm run test:phase8-ui
          npm run test:phase10-a11y
          npm run test:phase11-seo
          npm run test:performance
          npm run audit:canonical-viewports
          npm run audit:global-responsive-geometry
          npm run test:pages
          node scripts/auditar-legal-paginas.js

      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: repository-audit-failure-${{ github.run_id }}
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            firebase-debug.log
            firestore-debug.log
            /tmp/tintin-ci-http.log
          if-no-files-found: warn
          retention-days: 14
