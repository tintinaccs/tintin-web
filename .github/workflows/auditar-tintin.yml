name: CI Tintin — contrato único
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
  checks: read
concurrency:
  group: repository-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sync-cloud-skills-artifacts:
    name: Sincronizar manifiestos de Skills (rama autorizada)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/cloud-agent-skills-20261101' && github.event.pull_request.head.repo.full_name == github.repository }}
        name: Checkout authorized branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/cloud-agent-skills-20261101' && github.event.pull_request.head.repo.full_name == github.repository }}
        name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/cloud-agent-skills-20261101' && github.event.pull_request.head.repo.full_name == github.repository }}
        name: Build repository canonical artifacts
        run: |
          npm ci
          npm run build:pages
      - if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/cloud-agent-skills-20261101' && github.event.pull_request.head.repo.full_name == github.repository }}
        name: Update generated metadata only
        run: |
          git add -- diagnostic-manifest.json site-version.json
          if git diff --cached --quiet; then
            echo "Canonical manifests are already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(ci): synchronize canonical metadata for Skills"
            git pull --rebase origin "${{ github.head_ref }}"
            git push origin "HEAD:refs/heads/${{ github.head_ref }}"
          fi
  preflight:
    needs: sync-cloud-skills-artifacts
    name: VALIDACIÓN RÁPIDA — PREFLIGHT
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify cloud agent Skills on Linux
        run: |
          python3 scripts/agent/check-cloud-skills.py
          bash scripts/agent/bootstrap-cloud-linux.sh --prefix "$RUNNER_TEMP/tintin-agent-skills"
      - name: Install locked dependencies once
        run: npm ci
      - name: VALIDACIÓN RÁPIDA — PREFLIGHT
        run: npm run ci:preflight
      - name: Build exact public artifact
        run: npm run build:pages
      - name: Reject generated artifact drift
        run: git diff --exit-code -- .
      - name: Validate non-destructive domain migration preflight
        run: node scripts/auditar-preparacion-dominio.mjs
      - name: Verify CSS source and minified artifact integrity
        run: npm run audit:styles
      - name: Canonical integrations and authority map
        run: node scripts/auditar-integraciones-canonicas.mjs
      - name: Save timings and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            firebase-debug.log
            firestore-debug.log
            /tmp/tintin-ci-http.log
          if-no-files-found: warn
          retention-days: 14
  commerce:
    name: B — Comercio crítico
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PERF_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies once
        run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium once
        run: |
          bash scripts/preparar-red-apt-ci.sh
          npx playwright install --with-deps chromium
      - name: Serve exact commit for browser gates
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-ci-http.log 2>&1 &
          echo $! > /tmp/tintin-ci-http.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tintin-ci-http.log || true
          exit 1
      - name: B — Comercio crítico
        run: npm run ci:commerce
      - name: Save timings and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            firebase-debug.log
            firestore-debug.log
            /tmp/tintin-ci-http.log
          if-no-files-found: warn
          retention-days: 14
  admin:
    name: C — Administración
    needs: commerce
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PERF_BASE_URL: http://127.0.0.1:4173
      FIREBASE_PROJECT_ID: demo-tintin-backup-contract
      FIRESTORE_BACKUP_BUCKET: gs://example-backups
      FIRESTORE_RESTORE_SOURCE: gs://example-backups/snapshot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies once
        run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium once
        run: |
          bash scripts/preparar-red-apt-ci.sh
          npx playwright install --with-deps chromium
      - name: Serve exact commit for browser gates
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-ci-http.log 2>&1 &
          echo $! > /tmp/tintin-ci-http.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tintin-ci-http.log || true
          exit 1
      - name: C — Administración
        run: npm run ci:admin
      - name: Save timings and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            firebase-debug.log
            firestore-debug.log
            /tmp/tintin-ci-http.log
          if-no-files-found: warn
          retention-days: 14
  quality:
    name: D — Calidad técnica
    needs: commerce
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PERF_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for runtime emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies once
        run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium once
        run: |
          bash scripts/preparar-red-apt-ci.sh
          npx playwright install --with-deps chromium
      - name: Serve exact commit for browser gates
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-ci-http.log 2>&1 &
          echo $! > /tmp/tintin-ci-http.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tintin-ci-http.log || true
          exit 1
      - name: Full static contract
        run: npm run ci:quality
      - name: Save timings and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            firebase-debug.log
            firestore-debug.log
            /tmp/tintin-ci-http.log
          if-no-files-found: warn
          retention-days: 14
  browser:
    name: D — Interfaz, SEO y rendimiento
    needs: commerce
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PERF_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies once
        run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium once
        run: |
          bash scripts/preparar-red-apt-ci.sh
          npx playwright install --with-deps chromium
      - name: Serve exact commit for browser gates
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-ci-http.log 2>&1 &
          echo $! > /tmp/tintin-ci-http.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tintin-ci-http.log || true
          exit 1
      - name: Browser, accessibility, SEO and performance gates
        run: npm run ci:browser
      - name: Save timings and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            firebase-debug.log
            firestore-debug.log
            /tmp/tintin-ci-http.log
          if-no-files-found: warn
          retention-days: 14
  rules:
    name: B — Reglas e identidad aisladas
    needs: commerce
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PERF_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies once
        run: npm ci
      - name: B — Reglas e identidad aisladas
        run: npm run ci:rules
      - name: Save timings and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ github.job }}-${{ github.run_id }}
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
            firebase-debug.log
            firestore-debug.log
            /tmp/tintin-ci-http.log
          if-no-files-found: warn
          retention-days: 14
  audit:
    name: Repository audit
    if: ${{ always() }}
    needs:
      - preflight
      - commerce
      - admin
      - quality
      - browser
      - rules
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: E — Validación final obligatoria
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
  protected-flows:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Protected flows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify main baseline
        run: node scripts/auditar-proteccion-flujos.mjs
