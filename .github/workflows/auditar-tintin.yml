name: Auditoría integral Tintin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  audit:
    name: Repository audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test branch cleanup guard rails
        run: node --test tests/branches/auditar-limpiar-ramas.test.mjs

      - name: Audit load contracts for every HTML page
        id: page_load_audit
        continue-on-error: true
        run: npm run audit:page-loading > page-loading-audit.log 2>&1

      - name: Upload page-load audit log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: page-loading-audit-log
          path: page-loading-audit.log
          retention-days: 7

      - name: Enforce page-load audit result
        run: |
          cat page-loading-audit.log
          test "${{ steps.page_load_audit.outcome }}" = "success"

      - name: Run Tintin audit
        run: npm run audit:tintin

      - name: Verify solid loader background
        run: node scripts/auditar-cargador-solid.js

      - name: Audit home page on all viewports
        run: node scripts/auditar-inicio-pagina.js

      - name: Audit catalog page on all viewports
        run: node scripts/auditar-catalogo-pagina.js

      - name: Audit collections page on all viewports
        run: node scripts/auditar-colecciones-pagina.js

      - name: Audit product page on all viewports
        run: node scripts/auditar-producto-pagina.js

      - name: Audit checkout page on all viewports
        run: node scripts/auditar-checkout-pagina.js

      - name: Audit payment selection and Super Admin CRUD
        run: node scripts/auditar-pago-metodos.js

      - name: Audit login page on all viewports
        run: node scripts/auditar-acceso-pagina.js

      - name: Audit profile and orders on all viewports
        run: node scripts/auditar-perfil-pedidos-pagina.js

      - name: Audit about page on all viewports
        run: node scripts/auditar-nosotros-pagina.js

      - name: Audit contact page on all viewports
        run: node scripts/auditar-contacto-pagina.js

      - name: Audit terms and privacy pages on all viewports
        run: node scripts/auditar-legal-paginas.js

      - name: Audit Super Admin configuration to public site sync
        run: node scripts/auditar-admin-publico-sincronizar.js

      - name: Audit Super Admin foundation (auth, nav, a11y, modals)
        run: node scripts/auditar-admin-fundamentos.js

      - name: Audit products, collections and images (admin + storefront)
        run: node scripts/auditar-admin-productos-multimedia.js

      - name: Audit orders lifecycle (admin edit, status, integrity)
        run: node scripts/auditar-admin-pedidos.js

      - name: Audit users, roles and permissions (Super Admin protections)
        run: node scripts/auditar-admin-usuarios-roles.js

      - name: Audit content and appearance (editor safety, color apply)
        run: node scripts/auditar-admin-contenido-apariencia.js

      - name: Audit emails and messaging (single Resend channel, no frontend secrets, WhatsApp)
        run: node scripts/auditar-admin-correo-mensajeria.js

      - name: Audit statistics, audit log and diagnostics (no false zeros, privacy, immutable audit)
        run: node scripts/auditar-admin-analitica-auditar.js

      - name: Audit help pages (envíos, cambios/devoluciones, preguntas frecuentes)
        run: node scripts/auditar-ayuda-paginas.js

      - name: Audit auxiliary pages (404 error page + legacy nosotros redirect)
        run: node scripts/auditar-auxiliares-paginas.js

      - name: Final integration audit (single sources of truth, admin↔public, SEO, PWA, no obsolete)
        run: node scripts/auditar-final-integracion.js

      - name: Performance & realtime audit (FOIT, loader timeout, live listeners, budgets)
        run: node scripts/auditar-rendimiento-tiempo-real.js

      - name: Firestore read budget audit
        run: node scripts/auditar-firestore-lecturas-presupuesto.js

      - name: Audit critical inventory and quota healing
        run: npm run audit:critical-healing

      - name: Install locked Firestore rules test dependencies
        run: npm ci

      - name: Run adversarial Firestore emulator tests
        id: critical_rules
        continue-on-error: true
        run: npm run test:rules-critical > firestore-critical.log 2>&1

      - name: Upload adversarial Firestore report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: firestore-critical-report
          path: firestore-critical.log
          retention-days: 7

      - name: Enforce adversarial Firestore result
        run: |
          cat firestore-critical.log
          test "${{ steps.critical_rules.outcome }}" = "success"

      - name: Post-optimization regression tripwire (all domains intact after perf changes)
        run: node scripts/auditar-rendimiento-regresiones.js

      - name: Install Playwright for browser smoke
        run: npm install --no-save --package-lock=false

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Audit global responsive geometry
        id: global_geometry
        continue-on-error: true
        run: npm run audit:global-responsive-geometry > global-responsive-geometry.log 2>&1

      - name: Upload global responsive report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: global-responsive-geometry
          path: |
            global-responsive-geometry.log
            artifacts/global-responsive
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce global responsive geometry
        run: |
          cat global-responsive-geometry.log
          test "${{ steps.global_geometry.outcome }}" = "success"

      - name: Smoke test every page in Chromium
        id: browser_smoke
        continue-on-error: true
        run: npm run test:pages > chromium-smoke.log 2>&1

      - name: Upload Chromium smoke report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: chromium-smoke-report
          path: chromium-smoke.log
          retention-days: 7

      - name: Enforce Chromium smoke result
        run: |
          cat chromium-smoke.log
          test "${{ steps.browser_smoke.outcome }}" = "success"
