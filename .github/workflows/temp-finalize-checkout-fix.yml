name: TEMP finalize checkout fix

on:
  push:
    branches:
      - fix/checkout-cart-profile-persistence

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-cart-profile-persistence
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove this temporary workflow before generating manifests
        run: rm -f .github/workflows/temp-finalize-checkout-fix.yml

      - name: Regenerate deterministic deploy artifacts
        run: npm run build:pages

      - name: Verify checkout fix
        run: |
          node --check js/orders/pedido-checkout-seguro.js
          node --check js/components/cart/sincronizacion-carrito.js
          npm run test:checkout-contract
          npm run audit:secure-orders
          npm run audit:cart
          npm run audit:cache-versioning
          npm run verify:csp
          npm run verify:diagnostics
          git diff --check

      - name: Commit finalized artifacts and self-delete
        shell: bash
        run: |
          git config user.name 'tintinaccs'
          git config user.email 'tintinaccs@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize checkout generated artifacts'
          git push origin HEAD:fix/checkout-cart-profile-persistence
