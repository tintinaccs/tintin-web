name: One-time canonical identity cache repair

on:
  push:
    branches:
      - fix/unificar-identidad-y-pedidos

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/unificar-identidad-y-pedidos
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply exact dependency and cache repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const ROOT = process.cwd();
          const RELEASE_VERSION = 'tintin-20260903-canonical-order-identity-1';
          const PUBLIC_CLIENT_VERSION = 'tintin-20260903-canonical-order-bridge-1';
          const secureOrderPath = 'js/orders/pedido-checkout-seguro.js';
          const publicClientPath = 'js/create-order-public-client.js';
          const probePath = 'js/zz-cache-ref-probe.js';

          function read(rel) { return fs.readFileSync(path.join(ROOT, rel), 'utf8'); }
          function write(rel, text) { fs.writeFileSync(path.join(ROOT, rel), text, 'utf8'); }
          function replaceOnce(rel, before, after, label) {
            const text = read(rel);
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: se esperaba 1 coincidencia en ${rel}, encontradas ${count}`);
            write(rel, text.replace(before, after));
          }

          // 1) Adoptar el Firebase publicado por main #654 en nuestras dos piezas nuevas.
          replaceOnce(
            secureOrderPath,
            "../core/firebase/firebase.js?v=tintin-20260903-app-check-singleton-1",
            "../core/firebase/firebase.js?v=tintin-20260903-app-check-singleton-2",
            'Firebase secure order'
          );
          replaceOnce(
            publicClientPath,
            "./core/firebase/firebase.js?v=tintin-20260903-app-check-singleton-1",
            "./core/firebase/firebase.js?v=tintin-20260903-app-check-singleton-2",
            'Firebase public order client'
          );

          // 2) Romper el ciclo de módulos. El carrito crea y publica TintinCartRuntime
          // antes de importar dinámicamente el guardado seguro; el guardado seguro
          // consume ese contrato runtime en vez de volver a importar el carrito.
          const oldCartImport = `import {
            getCartLocal,
            setCartLocal,
            clearCart,
            cartTotal,
            formatPrice,
            awaitCartReady
          } from '../components/cart/sincronizacion-carrito.js?v=tintin-20260901-phone-py-only-1';`;
          const runtimeContract = `function requireCartRuntime() {
            const runtime = window.TintinCartRuntime;
            if (!runtime) {
              throw new Error('[secure-checkout-order] El runtime canónico del carrito no está disponible.');
            }
            return runtime;
          }

          const getCartLocal = (...args) => requireCartRuntime().getCartLocal(...args);
          const setCartLocal = (...args) => requireCartRuntime().setCartLocal(...args);
          const clearCart = (...args) => requireCartRuntime().clearCart(...args);
          const cartTotal = (...args) => requireCartRuntime().cartTotal(...args);
          const formatPrice = (...args) => requireCartRuntime().formatPrice(...args);
          const awaitCartReady = (...args) => requireCartRuntime().awaitCartReady(...args);`;
          replaceOnce(secureOrderPath, oldCartImport, runtimeContract, 'Romper ciclo carrito/pedido');

          // 3) El test contractual debe impedir que el ciclo vuelva a aparecer.
          const testPath = 'tests/checkout/order-routing-identity.test.mjs';
          const testAnchor = "  assert.doesNotMatch(checkout, /create-order-client\\.js\\?v=/);";
          const testInsert = `${testAnchor}\n  assert.doesNotMatch(checkout, /components\\/cart\\/sincronizacion-carrito\\.js\\?v=/);\n  assert.match(checkout, /window\\.TintinCartRuntime/);`;
          replaceOnce(testPath, testAnchor, testInsert, 'Contrato anti-ciclo');

          // 4) Quitar toda instrumentación temporal antes de construir el grafo final.
          if (fs.existsSync(path.join(ROOT, probePath))) fs.unlinkSync(path.join(ROOT, probePath));

          function walk(dir, exts) {
            const out = [];
            const abs = path.join(ROOT, dir);
            if (!fs.existsSync(abs)) return out;
            for (const entry of fs.readdirSync(abs, { withFileTypes: true })) {
              const rel = path.posix.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(rel, exts));
              else if (exts.some(ext => entry.name.endsWith(ext))) out.push(rel);
            }
            return out;
          }

          const rootHtml = fs.readdirSync(ROOT).filter(name => name.endsWith('.html'));
          const sourceFiles = [...rootHtml, ...walk('js', ['.js', '.mjs']), ...walk('functions', ['.js', '.mjs'])];
          const versionedLiteral = /(["'])([^"'?]+\.(?:css|js|mjs))\?v=([A-Za-z0-9._-]+)\1/g;

          function resolveTarget(sourceFile, ref) {
            if (/^https?:\/\//.test(ref)) return null;
            const resolved = ref.startsWith('.')
              ? path.relative(ROOT, path.resolve(ROOT, path.dirname(sourceFile), ref))
              : ref.replace(/^\.?\//, '');
            return resolved.split(path.sep).join('/');
          }

          function bumpInboundReferences(targetPath) {
            const changedSources = [];
            for (const sourceFile of sourceFiles) {
              if (!fs.existsSync(path.join(ROOT, sourceFile))) continue;
              const original = read(sourceFile);
              let changed = false;
              const next = original.replace(versionedLiteral, (full, quote, ref, tag) => {
                if (resolveTarget(sourceFile, ref) !== targetPath || tag === RELEASE_VERSION) return full;
                changed = true;
                return `${quote}${ref}?v=${RELEASE_VERSION}${quote}`;
              });
              if (changed) {
                write(sourceFile, next);
                changedSources.push(sourceFile);
              }
            }
            return changedSources;
          }

          // 5) Propagación transitiva real: secure-order cambia -> se bumpan todos
          // sus consumidores. Cada consumidor JS que cambia se convierte a su vez
          // en un target y propaga el bump hasta que el grafo llega a punto fijo.
          const queue = [secureOrderPath];
          const processedState = new Map();
          let guard = 0;
          while (queue.length) {
            if (++guard > 500) throw new Error('La propagación de caché no convergió.');
            const target = queue.shift();
            if (!fs.existsSync(path.join(ROOT, target))) continue;
            const state = crypto.createHash('sha256').update(read(target)).digest('hex');
            if (processedState.get(target) === state) continue;
            processedState.set(target, state);
            const consumers = bumpInboundReferences(target);
            for (const consumer of consumers) {
              if (/\.(?:js|mjs)$/.test(consumer)) queue.push(consumer);
            }
          }

          // 6) El cliente público es nuevo: su URL todavía no fue publicada, así que
          // conserva su tag propio y se aprueba por el Git blob exacto final.
          const publicClient = read(publicClientPath).replace(/\r\n/g, '\n');
          const body = Buffer.from(publicClient, 'utf8');
          const blobSha = crypto.createHash('sha1')
            .update(Buffer.from(`blob ${body.length}\0`, 'utf8'))
            .update(body)
            .digest('hex');
          const approvalsPath = 'scripts/cache-version-approvals.json';
          const approvals = JSON.parse(read(approvalsPath));
          approvals.approved ||= {};
          approvals.removed ||= [];
          approvals.approved[publicClientPath] = {
            version: PUBLIC_CLIENT_VERSION,
            gitBlobSha: blobSha
          };
          write(approvalsPath, JSON.stringify(approvals, null, 2) + '\n');

          console.log('Targets propagados:', [...processedState.keys()].sort().join(', '));
          console.log('Public client Git blob SHA:', blobSha);
          NODE

      - name: Verify surgical repair before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/auditar-versionado-cache.mjs
          node --test tests/checkout/order-routing-identity.test.mjs tests/checkout/canonical-identity-backfill.test.mjs
          test ! -e js/zz-cache-ref-probe.js

      - name: Commit repair and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tintin CI Repair"
          git config user.email "tintinaccs@gmail.com"
          git rm .github/workflows/zz-canonical-identity-surgical-patch.yml
          git add -A
          git commit -m "fix: close canonical order cache dependency graph"
          git push origin HEAD:fix/unificar-identidad-y-pedidos
