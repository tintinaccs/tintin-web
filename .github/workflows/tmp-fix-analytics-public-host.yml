name: TEMP — Corregir analítica host público

on:
  push:
    branches:
      - fix/auditoria-integral-incongruencias-2026-08-23

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/auditoria-integral-incongruencias-2026-08-23
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Corregir host público y guardas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: esperaba {count}, encontré {actual}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'js/analytics/actividad-sitio.js',
              "  const cloudflarePreview = /\\.tintinaccesorios\\.pages\\.dev$/i.test(hostname) || hostname === 'tintinaccesorios.pages.dev';",
              "  // Solo los subdominios de preview se excluyen. El host principal\n  // tintinaccesorios.pages.dev es la tienda pública y sí debe registrar analítica.\n  const cloudflarePreview = hostname.endsWith('.tintinaccesorios.pages.dev');"
          )

          replace_exact(
              'js/core/firebase/origen-funciones.js',
              "// El sitio se publica en GitHub Pages (ver robots.txt, sitemap.xml y los\n// canonical de cada página), pero las funciones /api/* (Cloudinary, geo,\n// email) corren en Cloudflare Pages. Un fetch a una ruta relativa como\n// \"/api/order-email\" funciona en Cloudflare (mismo origen) pero da 404 en\n// github.io o netlify.app. Este módulo centraliza esa detección para que\n// cada llamador no tenga que reinventarla (y olvidarla, como pasaba antes).",
              "// El sitio oficial y las funciones /api/* viven en Cloudflare Pages.\n// Los dominios históricos de GitHub Pages o Netlify pueden seguir apareciendo\n// en enlaces o entornos heredados; desde esos orígenes las funciones necesitan\n// apuntar explícitamente al host oficial. Este módulo centraliza esa detección."
          )

          p = Path('scripts/auditar-contenido-fase-6.js')
          text = p.read_text(encoding='utf-8')
          old = "  profileMaintenance: read('js/pages/profile/mantenimiento-perfil.js'),\n};"
          new = "  profileMaintenance: read('js/pages/profile/mantenimiento-perfil.js'),\n  siteActivity: read('js/analytics/actividad-sitio.js'),\n  functionOrigin: read('js/core/firebase/origen-funciones.js'),\n};"
          if text.count(old) != 1:
              raise SystemExit('No se encontró bloque files de auditoría esperado')
          text = text.replace(old, new)
          marker = "if (failures) {"
          guard = """check(\n  'La analítica propia no confunde el host público de Cloudflare con un preview',\n  files.siteActivity.includes(\"hostname.endsWith('.tintinaccesorios.pages.dev')\") &&\n    !files.siteActivity.includes(\"hostname === 'tintinaccesorios.pages.dev'\"),\n  'El host principal pages.dev debe ser escribible; solo sus subdominios son previews'\n);\n\ncheck(\n  'El origen de funciones documenta Cloudflare como hosting oficial',\n  files.functionOrigin.includes('El sitio oficial y las funciones /api/* viven en Cloudflare Pages') &&\n    !files.functionOrigin.includes('El sitio se publica en GitHub Pages'),\n  'La documentación del runtime debe coincidir con el hosting actual'\n);\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('No se encontró final de auditoría')
          p.write_text(text.replace(marker, guard + marker), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-fix-analytics-public-host.yml

      - name: Instalar y regenerar artefactos oficiales
        run: |
          set -euo pipefail
          npm ci
          npm run sync:monaco
          npm run sync:public-shell
          npm run build:routes
          npm run build:csp
          npm run sync:public-origin
          npm run cache-versioning:write
          npm run build:diagnostics
          npm run verify:routes
          npm run verify:csp
          npm run verify:diagnostics
          npm run audit:cache-versioning

      - name: Validar
        run: |
          set -euo pipefail
          node --check js/analytics/actividad-sitio.js
          node --check js/core/firebase/origen-funciones.js
          node --check scripts/auditar-contenido-fase-6.js
          npm run audit:content
          npm run audit:phase11
          npm run audit:page-loading
          npm run audit:secure-orders
          npm run audit:integral
          git diff --check

      - name: Commit validado
        run: |
          set -euo pipefail
          git config user.name 'Tintin Site Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(analytics): habilitar métricas en host público'
          git push origin HEAD:fix/auditoria-integral-incongruencias-2026-08-23
