name: Finalizar endurecimiento temporal

on:
  push:
    branches:
      - chatgpt/production-surgical-hardening

permissions:
  contents: write

concurrency:
  group: finalizar-production-surgical-hardening
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Excluir el workflow temporal del árbol final
        run: rm -f .github/workflows/finalizar-endurecimiento-temporal.yml
      - name: Regenerar CSP, diagnóstico y baseline de caché
        run: |
          npm run cache-versioning:write
          npm run build:pages
      - name: Validar contratos críticos
        run: |
          node scripts/auditar-github-actions-soportadas.mjs
          npm run audit:phase11
          node scripts/auditar-firestore-lecturas-presupuesto.js
          node --test tests/catalog/public-catalog-cache.test.mjs
          npm run audit:security
          npm run test:checkout-contract
          npm run test:engagement
          npm audit --omit=dev --audit-level=moderate
      - name: Auditoría integral estática
        run: npm run audit:final
      - name: Confirmar que el temporal no contaminó artefactos
        run: test ! -e .github/workflows/finalizar-endurecimiento-temporal.yml
      - name: Restaurar solo el workflow temporal para permitir el push del bot
        run: git checkout HEAD -- .github/workflows/finalizar-endurecimiento-temporal.yml
      - name: Guardar artefactos finales regenerados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay artefactos generados pendientes."
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: el commit generado intenta modificar workflows."
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore: regenerar artefactos tras endurecimiento de producción"
          git push origin HEAD:chatgpt/production-surgical-hardening
