name: TEMP — Corrección integral headers

on:
  push:
    branches:
      - fix/header-responsive-integral-2026-08-24

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/header-responsive-integral-2026-08-24
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Aplicar correcciones de desktop, tablet y mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
              print('OK', path)

          def replace(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: esperado {count}, encontrado {actual}: {old[:100]!r}')
              write(path, text.replace(old, new, count))

          # DESKTOP — geometría, altura real y eliminación del doble marco de TIENDA.
          path = 'css/components/navigation/escritorio/encabezado-escritorio.css'
          text = read(path)
          text = text.replace('@media (min-width: 1025px) {\n  .tt-header-desktop {', '@media (min-width: 1025px) {\n  :root { --header-h: 88px; }\n\n  .tt-header-desktop {', 1)
          text = text.replace('grid-template-columns: minmax(170px,1fr) auto minmax(170px,1fr);', 'grid-template-columns: minmax(220px,1fr) auto minmax(220px,1fr);', 1)
          text = text.replace('.tt-header-desktop .tt-logo-img { width:auto; height:48px; flex:0 0 auto; }', '.tt-header-desktop .tt-logo-img { width:auto; height:48px; max-width:min(180px,100%); object-fit:contain; flex:0 1 auto; }', 1)
          text = text.replace('.tt-header-desktop .tt-header-actions { justify-self: end; gap: 10px; }', '.tt-header-desktop .tt-header-actions { justify-self:end; display:flex; align-items:center; flex-wrap:nowrap; gap:10px; min-width:max-content; }', 1)
          text = text.replace('grid-template-columns: 126px minmax(0, 1fr) 146px !important;', 'grid-template-columns: minmax(196px,1fr) minmax(0,auto) minmax(196px,1fr) !important;', 1)
          text = text.replace('.tt-header-desktop .tt-logo-img { height:38px !important; max-width:48px; object-fit:contain; }', '.tt-header-desktop .tt-logo-img { height:38px !important; max-width:118px; object-fit:contain; }', 1)
          insert = '''\n  /* TIENDA es navegación textual: el indicador elástico ya dibuja su único\n     contorno activo. Estas reglas ganan sobre las superficies sólidas globales\n     que antes le agregaban un segundo marco. Los iconos de acción, incluida\n     Notificaciones, conservan su botón blanco independiente. */\n  html body #tt-header-desktop-tablet #btn-tienda,\n  html body #tt-header-desktop-tablet #btn-tienda:hover,\n  html body #tt-header-desktop-tablet #btn-tienda:focus-visible,\n  html body #tt-header-desktop-tablet #btn-tienda.active,\n  html body #tt-header-desktop-tablet #btn-tienda[aria-expanded="true"] {\n    background:transparent !important;\n    background-color:transparent !important;\n    background-image:none !important;\n    border-color:transparent !important;\n    box-shadow:none !important;\n  }\n\n  html body #tt-header-desktop-tablet #btn-notifications,\n  html body #tt-header-desktop-tablet #btn-notifications:hover,\n  html body #tt-header-desktop-tablet #btn-notifications:focus-visible,\n  html body #tt-header-desktop-tablet #btn-notifications[aria-expanded="true"] {\n    background:#fff !important;\n    background-color:#fff !important;\n    background-image:none !important;\n    border:1px solid rgba(139,38,66,.14) !important;\n    opacity:1 !important;\n  }\n'''
          marker = '\n  .tt-header-desktop .tt-dropdown {'
          if marker not in text: raise SystemExit('desktop: marcador dropdown no encontrado')
          text = text.replace(marker, insert + marker, 1)
          write(path, text)

          # Desktop indicator: nunca usar un control oculto como ancla del pill.
          path = 'js/components/navigation/escritorio/indicador-navegacion-escritorio.js'
          text = read(path)
          text = text.replace("  const items = [...nav.querySelectorAll('[data-desktop-nav-item]')];\n  const activeItem = () => items.find(item => item.classList.contains('active') || item.getAttribute('aria-current') === 'page') || null;", "  const items = [...nav.querySelectorAll('[data-desktop-nav-item]')];\n  const visible = item => Boolean(item && !item.hidden && item.getClientRects().length && getComputedStyle(item).visibility !== 'hidden');\n  const activeItem = () => items.find(item => visible(item) && (item.classList.contains('active') || item.getAttribute('aria-current') === 'page')) || null;", 1)
          text = text.replace("  const observer = new ResizeObserver(restore);\n  observer.observe(nav);\n  requestAnimationFrame(restore);", "  const observer = new ResizeObserver(restore);\n  observer.observe(nav);\n  const stateObserver = new MutationObserver(restore);\n  items.forEach(item => stateObserver.observe(item, { attributes:true, attributeFilter:['class','aria-current','hidden'] }));\n  addEventListener('tintin:global-layout-ready', restore);\n  requestAnimationFrame(restore);", 1)
          write(path, text)

          # TABLET — altura real, logo acotado y cuenta fuera de la vista de colecciones.
          path = 'css/components/navigation/tableta/encabezado-tableta.css'
          text = read(path)
          text = text.replace('@media (min-width: 768px) and (max-width: 1024px) {\n  .tt-header-tablet {', '@media (min-width: 768px) and (max-width: 1024px) {\n  :root { --header-h: 84px; }\n\n  .tt-header-tablet {', 1)
          text = text.replace('    padding: 0 clamp(26px,4.2vw,48px);\n  }', '    padding: 0 clamp(26px,4.2vw,48px);\n    min-width:0;\n  }', 1)
          text = text.replace('    text-decoration:none;\n  }\n\n  .tt-tablet-logo-img { width:auto; height:42px; object-fit:contain; }', '    text-decoration:none;\n    max-width:clamp(110px,24vw,180px);\n  }\n\n  .tt-tablet-logo-img { width:auto; height:42px; max-width:100%; object-fit:contain; }', 1)
          text = text.replace('  .tt-tablet-menu-toggle { border-color: transparent; border-radius: 14px; }\n  .tt-tablet-actions { display: flex; align-items: center; gap: 9px; }', '  .tt-tablet-menu-toggle { flex:0 0 46px; border-color:transparent; border-radius:14px; }\n  .tt-tablet-actions { display:flex; align-items:center; flex:0 0 auto; flex-wrap:nowrap; gap:9px; min-width:max-content; }', 1)
          write(path, text)

          path = 'css/components/navigation/compartido/paneles.css'
          text = read(path)
          marker = '  .tt-tablet-menu.tt-tablet-shop-view .tt-tablet-nav { transform: translateX(-105%); opacity: 0; visibility: hidden; pointer-events: none; }'
          replacement = marker + '\n  .tt-tablet-menu.tt-tablet-shop-view .tt-tablet-account-entry { opacity:0; visibility:hidden; pointer-events:none; }'
          if text.count(marker) != 1: raise SystemExit('paneles: shop view tablet no único')
          text = text.replace(marker, replacement, 1)
          write(path, text)

          # MOBILE — columnas según controles realmente visibles (4/5/6), no por estado hardcodeado.
          replace('css/components/navigation/movil/encabezado-movil.css',
              '    grid-template-columns:repeat(5,minmax(0,1fr));\n    align-items:center;',
              '    grid-template-columns:none;\n    grid-auto-flow:column;\n    grid-auto-columns:minmax(0,1fr);\n    align-items:center;')

          path = 'css/components/notifications/notificaciones-sociales.css'
          text = read(path)
          text = text.replace('    grid-template-columns: repeat(6, minmax(0, 1fr));\n    width: min(446px, calc(100vw - 12px));', '    width: min(446px, calc(100vw - 12px));', 1)
          write(path, text)

          path = 'css/components/navigation/compartido/apariencia-global.css'
          text = read(path)
          text = text.replace('  html[data-tt-mobile-home="hidden"] #tt-tabbar{grid-template-columns:repeat(4,minmax(0,1fr))}\n', '')
          write(path, text)

          path = 'js/components/navigation/movil/indicador-navegacion-movil.js'
          text = read(path)
          text = text.replace("  const items = [...nav.querySelectorAll('.tt-tabbar-btn')];\n  const locate = item => {", "  const items = [...nav.querySelectorAll('.tt-tabbar-btn')];\n  const visible = item => Boolean(item && !item.hidden && item.getClientRects().length && getComputedStyle(item).visibility !== 'hidden');\n  const locate = item => {", 1)
          text = text.replace("    items.find(item => item.getAttribute('aria-expanded') === 'true') ||\n    items.find(item => item.classList.contains('active')) ||", "    items.find(item => visible(item) && item.getAttribute('aria-expanded') === 'true') ||\n    items.find(item => visible(item) && item.classList.contains('active')) ||", 1)
          text = text.replace("    attributeFilter: ['class', 'aria-expanded', 'aria-current'],", "    attributeFilter: ['class', 'aria-expanded', 'aria-current', 'hidden'],", 1)
          text = text.replace("  addEventListener('orientationchange', sync, { passive: true });\n  requestAnimationFrame(sync);", "  addEventListener('orientationchange', sync, { passive:true });\n  addEventListener('tintin:global-layout-ready', sync);\n  addEventListener('tintin:auth-session-resolved', sync);\n  addEventListener('tintin:auth-nav-updated', sync);\n  requestAnimationFrame(sync);", 1)
          write(path, text)

          replace('js/components/navigation/movil/navegacion-compacta-movil.js',
              "  const OPEN_SURFACE = '.tt-search-panel.open,.tt-cart-drawer.open,.tt-account-drawer.open,.tt-collections-sheet.open';",
              "  const OPEN_SURFACE = '.tt-search-panel.open,.tt-cart-drawer.open,.tt-account-drawer.open,.tt-collections-sheet.open,.tt-notifications-drawer.open';")

          # COLECCIONES — la navegación depende de colecciones visibles configuradas,
          # no de si casualmente esa página ya cargó PRODUCTS.
          path = 'js/components/navigation/compartido/carga-colecciones.js'
          text = read(path)
          start = text.index('// Sin productos cargados todavía')
          end = text.index('// Cuando la colección no tiene imagen propia', start)
          text = text[:start] + "// La visibilidad del menú depende únicamente de las colecciones públicas\n// habilitadas. Filtrarlas por window.PRODUCTS hacía que Inicio mostrara menos\n// opciones que Nosotros/Contacto según qué runtime se hubiera cargado primero.\nfunction visibleCollections(collections) {\n  return collections;\n}\n\n" + text[end:]
          write(path, text)

          # Runtime: auth en todas las páginas; colecciones se inicializan realmente
          # al importar el módulo y también se refrescan en segundo plano.
          path = 'js/components/navigation/compartido/carga-navegacion.js'
          text = read(path)
          old = "function loadCollectionsRuntime() {\n  if (!collectionsRuntimePromise) {\n    collectionsRuntimePromise = import(versionedJsModule('components/navigation/compartido/carga-colecciones.js'))\n      .catch(error => {\n        collectionsRuntimePromise = null;\n        throw error;\n      });\n  }\n  return collectionsRuntimePromise;\n}"
          new = "function loadCollectionsRuntime() {\n  if (!collectionsRuntimePromise) {\n    collectionsRuntimePromise = import(versionedJsModule('components/navigation/compartido/carga-colecciones.js'))\n      .then(async module => {\n        await module.initNavCollections?.();\n        return module;\n      })\n      .catch(error => {\n        collectionsRuntimePromise = null;\n        throw error;\n      });\n  }\n  return collectionsRuntimePromise;\n}"
          if text.count(old) != 1: raise SystemExit('carga-navegacion: loadCollectionsRuntime no coincide')
          text = text.replace(old, new, 1)
          old = "  window.addEventListener('tintin:auth-nav-updated', event => {\n    if (!event.detail?.authenticated) return;\n    void loadNotificationsRuntime().catch(error => {\n      console.warn('[PublicShell] No se pudieron iniciar las notificaciones.', error);\n    });\n  });"
          new = "  const startForAuthenticatedSession = event => {\n    if (!event.detail?.authenticated) return;\n    void loadNotificationsRuntime().catch(error => {\n      console.warn('[PublicShell] No se pudieron iniciar las notificaciones.', error);\n    });\n  };\n  window.addEventListener('tintin:auth-session-resolved', startForAuthenticatedSession);\n  window.addEventListener('tintin:auth-nav-updated', startForAuthenticatedSession);"
          if text.count(old) != 1: raise SystemExit('carga-navegacion: listener auth no coincide')
          text = text.replace(old, new, 1)
          old = "export function loadSharedRuntime() {\n  const page = currentPage();\n  attachProductsDemand();\n  attachNotificationsDemand();\n  loadNavigationBehaviors();\n\n  // Las páginas informativas mantienen disponible la bandeja global sin\n  // descargar Firestore para visitantes sin sesión. Las sesiones activas se\n  // hidratan arriba mediante la marca de sesión y el evento de autenticación.\n  if (!FULL_COMMERCE_PAGES.has(page)) {\n    attachLightweightCommerceDemand();\n    return;\n  }\n\n  const critical = [loadAuthRuntime(), loadCartRuntime()];"
          new = "export function loadSharedRuntime() {\n  const page = currentPage();\n  attachProductsDemand();\n  attachNotificationsDemand();\n  loadNavigationBehaviors();\n\n  // Auth es parte del shell global: una cuenta ya iniciada debe mostrar Cuenta\n  // y Notificaciones en cualquier página, incluidas las informativas. Para un\n  // visitante no autenticado no genera lecturas de rol.\n  const authPromise = loadAuthRuntime();\n\n  // La lista pública de colecciones es liviana y cacheada; se hidrata en todas\n  // las páginas para que Tienda tenga exactamente las mismas opciones.\n  scheduleNonCritical(() => {\n    loadCollectionsRuntime().catch(error => console.warn('[PublicShell] No se pudieron sincronizar las colecciones.', error));\n  });\n\n  if (!FULL_COMMERCE_PAGES.has(page)) {\n    attachLightweightCommerceDemand();\n    Promise.allSettled([authPromise]).then(reportRuntimeFailures);\n    return;\n  }\n\n  const critical = [authPromise, loadCartRuntime()];"
          if text.count(old) != 1: raise SystemExit('carga-navegacion: loadSharedRuntime encabezado no coincide')
          text = text.replace(old, new, 1)
          text = text.replace("    Promise.allSettled([\n      loadCollectionsRuntime(),\n      loadHomeMaintenance(),\n    ]).then(reportRuntimeFailures);", "    Promise.allSettled([\n      loadHomeMaintenance(),\n    ]).then(reportRuntimeFailures);", 1)
          write(path, text)

          # Auth: publicar sesión inmediatamente, antes de esperar el rol.
          path = 'js/core/auth/navegacion-autenticacion.js'
          text = read(path)
          old = " if(IS_LOGIN_PAGE)return;\n let role='client';\n try{if(user)role=await getUserRole(user.uid,user.email);}catch(e){console.warn('[auth-nav] No se pudo leer rol:',e);}\n publishStaffVisibility(user,role);\n renderAccountButtonPhoto(user);\n renderMobileTabbarPhoto(user);"
          new = " if(IS_LOGIN_PAGE)return;\n renderAccountButtonPhoto(user);\n renderMobileTabbarPhoto(user);\n window.dispatchEvent(new CustomEvent('tintin:auth-session-resolved',{detail:{authenticated:Boolean(user)}}));\n let role='client';\n try{if(user)role=await getUserRole(user.uid,user.email);}catch(e){console.warn('[auth-nav] No se pudo leer rol:',e);}\n publishStaffVisibility(user,role);"
          if text.count(old) != 1: raise SystemExit('auth-nav: bloque estado no coincide')
          text = text.replace(old, new, 1)
          write(path, text)

          # Versionado canónico del shell: todos los assets dinámicos modificados
          # reciben una nueva URL inmutable de una sola vez.
          replace('js/components/navigation/compartido/configuracion.js',
              "export const SHELL_VERSION = 'tintin-20260818-header-dropdowns-solid-3';",
              "export const SHELL_VERSION = 'tintin-20260824-header-integral-1';")

          # Tripwires estáticos para no volver a introducir las incongruencias.
          audit = Path('scripts/auditar-encabezados.mjs')
          text = audit.read_text(encoding='utf-8')
          extra = r'''

// Contratos de coherencia añadidos por la auditoría integral de headers.
const headerDesktopCss = fs.readFileSync(path.join(root,'css/components/navigation/escritorio/encabezado-escritorio.css'),'utf8');
const headerTabletCss = fs.readFileSync(path.join(root,'css/components/navigation/tableta/encabezado-tableta.css'),'utf8');
const headerMobileCss = fs.readFileSync(path.join(root,'css/components/navigation/movil/encabezado-movil.css'),'utf8');
const notifCss = fs.readFileSync(path.join(root,'css/components/notifications/notificaciones-sociales.css'),'utf8');
const globalAppearanceCss = fs.readFileSync(path.join(root,'css/components/navigation/compartido/apariencia-global.css'),'utf8');
const navRuntime = fs.readFileSync(path.join(root,'js/components/navigation/compartido/carga-navegacion.js'),'utf8');
const collectionsRuntime = fs.readFileSync(path.join(root,'js/components/navigation/compartido/carga-colecciones.js'),'utf8');
const mobileIndicator = fs.readFileSync(path.join(root,'js/components/navigation/movil/indicador-navegacion-movil.js'),'utf8');
const mobileCompact = fs.readFileSync(path.join(root,'js/components/navigation/movil/navegacion-compacta-movil.js'),'utf8');
const authNav = fs.readFileSync(path.join(root,'js/core/auth/navegacion-autenticacion.js'),'utf8');

check(headerDesktopCss.includes(':root { --header-h: 88px; }'), 'Desktop publica su altura real de 88px en --header-h');
check(headerTabletCss.includes(':root { --header-h: 84px; }'), 'Tablet publica su altura real de 84px en --header-h');
check(headerDesktopCss.includes('#btn-tienda[aria-expanded="true"]') && headerDesktopCss.includes('border-color:transparent !important'), 'TIENDA desktop usa un solo contorno activo');
check(headerDesktopCss.includes('#btn-notifications') && headerDesktopCss.includes('background:#fff !important'), 'Notificaciones desktop conserva superficie blanca');
check(headerMobileCss.includes('grid-auto-flow:column') && headerMobileCss.includes('grid-auto-columns:minmax(0,1fr)'), 'Mobile calcula columnas según controles visibles');
check(!notifCss.includes('grid-template-columns: repeat(6') && !globalAppearanceCss.includes('grid-template-columns:repeat(4'), 'Login/Home oculto no hardcodean cantidad de columnas mobile');
check(collectionsRuntime.includes('function visibleCollections(collections) {\n  return collections;'), 'Colecciones de navegación no dependen del runtime de productos de cada página');
check(navRuntime.includes('await module.initNavCollections?.()'), 'Importar colecciones inicializa realmente la navegación');
check(navRuntime.includes('const authPromise = loadAuthRuntime();'), 'Auth del header se resuelve en todas las páginas públicas');
check(authNav.includes("tintin:auth-session-resolved"), 'Auth publica sesión antes de esperar el rol');
check(navRuntime.includes("tintin:auth-session-resolved"), 'Notificaciones reaccionan a la sesión global inmediata');
check(mobileIndicator.includes("attributeFilter: ['class', 'aria-expanded', 'aria-current', 'hidden']"), 'Indicador mobile reacciona a botones ocultos/visibles');
check(mobileCompact.includes('.tt-notifications-drawer.open'), 'Tabbar mobile no se compacta debajo de Notificaciones abiertas');
'''
          marker = "if (failures.length) {"
          if marker not in text: raise SystemExit('auditar-encabezados: marcador final no encontrado')
          text = text.replace(marker, extra + '\n' + marker, 1)
          audit.write_text(text, encoding='utf-8')
          print('OK scripts/auditar-encabezados.mjs')
          PY

          # El helper no debe existir en el árbol final ni contaminar diagnóstico.
          rm -f .github/workflows/tmp-header-integral.yml .github/workflows/.trigger-header-integral

          node --check js/components/navigation/escritorio/indicador-navegacion-escritorio.js
          node --check js/components/navigation/movil/indicador-navegacion-movil.js
          node --check js/components/navigation/movil/navegacion-compacta-movil.js
          node --check js/components/navigation/compartido/carga-colecciones.js
          node --check js/components/navigation/compartido/carga-navegacion.js
          node --check js/core/auth/navegacion-autenticacion.js
          node --check scripts/auditar-encabezados.mjs
          node scripts/auditar-encabezados.mjs
          git diff --check

      - name: Regenerar contratos reproducibles
        run: |
          npm ci
          npm run cache-versioning:write
          npm run build:pages

      - name: Validaciones rápidas de navegación
        run: |
          npm run audit:headers
          npm run audit:modular-architecture
          npm run audit:public-shell
          npm run audit:cache-versioning
          git diff --check

      - name: Guardar corrección limpia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tintin Header Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(nav): sincronizar headers desktop tablet y mobile"
          git push origin HEAD:fix/header-responsive-integral-2026-08-24
