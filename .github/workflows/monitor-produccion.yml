name: Operación — salud de producción

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '0 17 * * 1-5'

permissions:
  contents: read
  issues: write
  id-token: write

# Un push a main verifica el deploy de ese commit: una corrida programada no
# debe cancelarlo a mitad de camino. Se encolan en vez de cancelarse.
concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  paypal_fx:
    name: Actualizar tasa PayPal desde BCP
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 17 * * 1-5')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Solicitar actualización autenticada
        shell: bash
        env:
          OIDC_AUDIENCE: tintin-paypal-fx-refresh
        run: |
          set -euo pipefail
          public_origin="$(python3 -c 'import json; print(json.load(open("config/public-site.json", encoding="utf-8"))["origin"].rstrip("/"), end="")')"
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"], end="")' <<<"${oidc_json}")"
          echo "::add-mask::${oidc_token}"
          response_file="${RUNNER_TEMP}/paypal-rate-refresh.json"
          http_code="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' --request POST --header "Authorization: Bearer ${oidc_token}" --header 'Accept: application/json' "${public_origin}/api/paypal-rate-refresh")"
          cat "${response_file}"
          python3 - "${http_code}" "${response_file}" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          data = json.load(open(sys.argv[2], encoding='utf-8'))
          if status != 200 or data.get('ok') is not True:
              raise SystemExit(f'paypal-rate-refresh rechazado: HTTP {status}, {data}')
          PY
  health:
    name: Producción real
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Artefacto de producción corresponde al commit auditado
        run: npm run audit:production-artifact
      - name: Monitor operativo
        id: monitor
        continue-on-error: true
        run: npm run monitor:production
      - name: Catálogo visible en navegador
        id: catalog
        continue-on-error: true
        run: node scripts/auditar-catalogo-navegador-produccion.mjs
      - name: Login y perfil en navegador
        id: auth_browser
        continue-on-error: true
        run: npm run test:auth-browser-production
      - name: Smoke de entrega final
        id: smoke
        continue-on-error: true
        run: node scripts/produccion-smoke-fase-12.mjs
      - name: Encabezados, caché y CSP de producción
        id: headers
        continue-on-error: true
        run: npm run audit:headers:production
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-health-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 30
      - name: Abrir o actualizar alerta
        if: steps.monitor.outcome == 'failure' || steps.catalog.outcome == 'failure' || steps.auth_browser.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.headers.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title='[Producción] Monitor en rojo'
          issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[Producción] Monitor en rojo") | .number' | head -n 1)"
          body="El monitor de producción detectó un fallo. Run: $RUN_URL"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Cerrar alerta al recuperar
        if: steps.monitor.outcome == 'success' && steps.catalog.outcome == 'success' && steps.auth_browser.outcome == 'success' && steps.smoke.outcome == 'success' && steps.headers.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[Producción] Monitor en rojo") | .number' | head -n 1)"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body 'Producción volvió a estado saludable.'; gh issue close "$issue" --reason completed; fi
      - name: Enforce production health
        run: |
          test "${{ steps.monitor.outcome }}" = success
          test "${{ steps.catalog.outcome }}" = success
          test "${{ steps.auth_browser.outcome }}" = success
          test "${{ steps.smoke.outcome }}" = success
          test "${{ steps.headers.outcome }}" = success
