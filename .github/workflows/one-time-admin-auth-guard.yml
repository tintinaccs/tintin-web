name: Admin auth fix

on:
  push:
    branches:
      - fix/admin-auth-guard-20260904
    paths:
      - .github/workflows/one-time-admin-auth-guard.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-guard-20260904
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/one-time-admin-auth-fix.py

      - name: Validate
        run: |
          node --input-type=module --check < js/admin/admin-app.js
          grep -q 'authPersistenceReady' js/admin/admin-app.js
          grep -q 'Init error; authenticated session preserved' js/admin/admin-app.js
          grep -q 'tintin-20260904-auth-guard-harden-2' admin.html

      - name: Commit fix
        run: |
          git config user.name "Tintin Auth Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-admin-auth-guard.yml scripts/one-time-admin-auth-fix.py
          git add js/admin/admin-app.js admin.html
          git commit -m "fix(auth): harden admin session bootstrap and stop redirect loops"
          git push origin HEAD:fix/admin-auth-guard-20260904
