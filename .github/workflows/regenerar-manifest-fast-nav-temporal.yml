name: Sincronizar manifiesto fast navigation temporal

on:
  push:
    branches:
      - perf/navegacion-inmediata-20260810
    paths:
      - '.github/workflows/regenerar-manifest-fast-nav-temporal.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/navegacion-inmediata-20260810
          fetch-depth: 0
      - name: Regenerar sobre el árbol final
        run: |
          rm .github/workflows/regenerar-manifest-fast-nav-temporal.yml
          npm ci
          npm run build:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci(perf): sincronizar manifiesto de navegación inmediata"
          git push origin HEAD:perf/navegacion-inmediata-20260810
