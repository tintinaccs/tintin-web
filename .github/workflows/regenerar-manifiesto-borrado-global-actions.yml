name: Regenerar manifiesto borrado global actions

on:
  push:
    branches: [feat/catalog-global-bulk-delete]
    paths:
      - '.github/workflows/regenerar-manifiesto-borrado-global-actions.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/catalog-global-bulk-delete
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Quitar workflow temporal
        run: git rm .github/workflows/regenerar-manifiesto-borrado-global-actions.yml
      - name: Regenerar diagnóstico
        run: npm run build:diagnostics
      - name: Verificar árbol final
        run: |
          node scripts/auditar-github-actions-soportadas.mjs
          node scripts/auditar-tipografia.js
          node scripts/auditar-borrado-global-catalogo.mjs
          node scripts/auditar-versionado-cache.mjs
          npm run verify:diagnostics
      - name: Commit reproducible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerar manifiesto tras actualizar Actions" || exit 0
          git push origin HEAD:feat/catalog-global-bulk-delete
