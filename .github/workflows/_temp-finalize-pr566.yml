name: Finalizar manifiesto PR566 (temporal)

on:
  push:
    branches:
      - claude/tintin-product-header-redesign-b0py9n

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/tintin-product-header-redesign-b0py9n
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retirar workflow temporal antes de generar inventario
        run: rm -f .github/workflows/_temp-finalize-pr566.yml
      - name: Regenerar artefactos sobre el árbol final
        run: |
          npm run build:diagnostics
          npm run audit:cache-versioning
      - name: Guardar árbol final sin workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalizar artefactos reproducibles PR566"
          git push origin HEAD:claude/tintin-product-header-redesign-b0py9n
