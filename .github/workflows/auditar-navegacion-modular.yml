name: Auditoría de navegación modular

on:
  pull_request:
    paths:
      - 'js/components/navigation/**'
      - 'css/components/navigation/**'
      - 'js/inicio-navegacion-publica.js'
      - 'js/components/navigation/compatibilidad/inicio-control-paneles.js'
      - 'js/navigation-*.js'
      - 'js/components/navigation/compatibilidad/colecciones.js'
      - 'js/components/navigation/compartido/ocultar-encabezado-al-desplazar.js'
      - 'js/components/navigation/compartido/compatibilidad-cuenta-movil.js'
      - 'js/components/navigation/compartido/compatibilidad-menus-desplegables.js'
      - 'js/components/navigation/compartido/visibilidad-navegacion-por-dispositivo.js'
      - 'js/core/auth/navegacion-autenticacion.js'
      - 'css/navigation-*.css'
      - 'css/components/navigation/compartido/control-paneles.css'
      - 'css/components/navigation/movil/fondos-solidos-movil.css'
      - 'scripts/auditar-inicio-navegacion-publica.js'
      - 'scripts/auditar-modular-arquitectura.js'
      - 'scripts/auditar-unificada-navegacion.js'
      - 'scripts/auditar-todas-navegacion-superficies-ci.mjs'
      - 'scripts/auditar-navegacion-busqueda.mjs'
      - 'package.json'
      - '.github/workflows/auditar-navegacion-modular.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modular-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate package JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json válido')"
      - name: Audit modular architecture
        run: npm run audit:modular-architecture
      - name: Audit public shell
        run: npm run audit:public-shell
      - name: Audit unified header contract
        run: node scripts/auditar-unificada-navegacion.js

  navigation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Search behavior audit
        run: npm run audit:navigation-search
      - name: Responsive navigation audit
        run: npm run audit:responsive-navigation
      - name: All navigation surfaces audit
        run: npm run audit:all-navigation-surfaces
