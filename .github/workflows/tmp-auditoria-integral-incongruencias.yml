name: TEMP — Corrección integral de incongruencias

on:
  push:
    branches:
      - fix/auditoria-integral-incongruencias-2026-08-23
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/auditoria-integral-incongruencias-2026-08-23
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Aplicar correcciones confirmadas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_exact(path, old, new, count=1):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: esperado {count} coincidencia(s), encontradas {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'OK {path}: {count} reemplazo(s)')

          def replace_all(path, old, new, minimum=1):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < minimum:
                  raise SystemExit(f'{path}: esperado al menos {minimum} coincidencia(s), encontradas {actual}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'OK {path}: {actual} reemplazo(s)')

          # Contenido editable y rutas públicas canónicas.
          replace_exact(
              'js/core/store/esquema-contenido.js',
              "field('primaryHref', 'Enlace del botón principal', '.tt-hero-actions a', 'catalogo.html', { index: 0, type: 'href', maxLength: 500 }),",
              "field('primaryHref', 'Enlace del botón principal', '.tt-hero-actions a', '/catalogo', { index: 0, type: 'href', maxLength: 500 }),"
          )
          replace_exact(
              'js/core/store/esquema-contenido.js',
              "field('btnHref', 'Enlace del botón secundario', '.tt-hero-actions a', 'about.html', { index: 1, type: 'href', maxLength: 500 }),",
              "field('btnHref', 'Enlace del botón secundario', '.tt-hero-actions a', '/about', { index: 1, type: 'href', maxLength: 500 }),"
          )
          replace_exact(
              'js/core/store/esquema-contenido.js',
              "field('blocks.2.title', 'Retiro — título', '.tt-info-title', 'Retiro en Tienda — Gratis', { index: 2, maxLength: 180 }),",
              "field('blocks.2.title', 'Retiro — título', '.tt-info-title', 'Retiro en San Lorenzo — Gratis', { index: 2, maxLength: 180 }),"
          )
          replace_exact(
              'js/core/store/esquema-contenido.js',
              "  return PAGE_PATH_TO_ID[file] || (raw === '' ? 'index' : null);",
              "  return PAGE_PATH_TO_ID[file] || PAGE_PATH_TO_ID[`${file}.html`] || (raw === '' ? 'index' : null);"
          )

          # Footer global: la mayoría de las páginas conserva texto directo dentro del anchor.
          replace_exact(
              'js/core/store/contenido-sitio.js',
              "  const index = item.index == null ? 0 : item.index;\n  return matches[index] || null;",
              "  const index = item.index == null ? 0 : item.index;\n  const target = matches[index] || null;\n  if (target) return target;\n  if (item.selector === '.tt-footer-wa-text') return root.querySelector('.tt-footer-wa');\n  return null;"
          )
          replace_exact(
              'js/core/store/contenido-sitio.js',
              "    element.id === 'form-success' ||\n    element.classList.contains('tt-contact-wa-link');",
              "    element.id === 'form-success' ||\n    element.classList.contains('tt-contact-wa-link') ||\n    element.classList.contains('tt-footer-wa');"
          )

          # Analítica: /checkout es la ruta canónica, .html queda solo como alias compatible.
          replace_exact(
              'js/analytics/analitica.js',
              "  if (/\\/checkout\\.html$/i.test(window.location.pathname || '')) {",
              "  if (/(?:^|\\/)checkout(?:\\.html)?\\/?$/i.test(window.location.pathname || '')) {"
          )

          # Canonical dinámicos limpios.
          replace_exact(
              'js/pages/login/mantenimiento-acceso.js',
              "    const canonical = new URL('login.html', location.href);\n    canonical.search = '';",
              "    const canonical = new URL('/login', location.origin);"
          )
          replace_exact(
              'js/pages/checkout/checkout-mantenimiento.js',
              "    const canonical = new URL('checkout.html', location.href);\n    canonical.search = '';",
              "    const canonical = new URL('/checkout', location.origin);"
          )
          replace_exact(
              'js/pages/profile/mantenimiento-perfil.js',
              "    if (canonical) canonical.href = new URL('perfil.html', window.location.origin + '/').href;",
              "    if (canonical) canonical.href = new URL('/perfil', window.location.origin).href;"
          )

          # Inicio y checkout: navegación/textos públicos sin aliases ni tienda física implícita.
          replace_exact('js/pages/home/mantenimiento-inicio.js', "{ href: 'catalogo.html', label: 'Ver catálogo' },", "{ href: '/catalogo', label: 'Ver catálogo' },")
          replace_exact('js/pages/home/mantenimiento-inicio.js', "{ href: 'catalogo.html', label: 'Explorar accesorios' },", "{ href: '/catalogo', label: 'Explorar accesorios' },")
          replace_exact('checkout.html', "  // El retiro en tienda es una ciudad más (la única sin costo de envío),", "  // El retiro coordinado en San Lorenzo es una opción más (la única sin costo de envío),")
          replace_exact('checkout.html', "    retiroOpt.textContent = '🏪 Retiro en tienda';", "    retiroOpt.textContent = '📍 Retiro en San Lorenzo';")

          # Búsqueda y loader deben reconocer/generar la ficha canónica /product.
          replace_exact(
              'js/components/navigation/compartido/control-busqueda.js',
              "  link.href = `product.html?id=${encodeURIComponent(String(product.id || ''))}`;",
              "  link.href = `/product?id=${encodeURIComponent(String(product.id || ''))}`;"
          )
          replace_exact(
              'js/cargador-pagina.js',
              "  // Cualquier tarjeta o link que lleve a product.html guarda el nombre del\n  // producto justo antes de navegar, porque el id de la URL no es legible",
              "  // Cualquier tarjeta o link que lleve a la ficha /product (o al alias\n  // product.html) guarda el nombre antes de navegar, porque el id no es legible"
          )
          replace_exact(
              'js/cargador-pagina.js',
              "      if (url.pathname.split('/').pop() !== 'product.html') return;",
              "      const productPath = url.pathname.replace(/\\/+$/, '').split('/').pop() || '';\n      if (!/^product(?:\\.html)?$/i.test(productPath)) return;"
          )

          # Notificaciones sociales: deep links públicos canónicos.
          replace_all('cloudflare/participacion-clientes.js', 'product.html?id=', '/product?id=')
          replace_all('cloudflare/participacion-admin.js', 'product.html?id=', '/product?id=')

          # Correo administrativo: ruta limpia y ciudad + departamento sin duplicar.
          replace_exact(
              'functions/api/order-email.js',
              "const ADMIN_PANEL = 'https://tintinaccesorios.pages.dev/admin.html';",
              "const ADMIN_PANEL = 'https://tintinaccesorios.pages.dev/admin';"
          )
          payment_block = """function paymentLabel(order) {
            const method = clean(order?.payment?.method, 40);
            return {
              efectivo: 'Efectivo contra entrega',
              transferencia: 'Transferencia bancaria',
              paypal: 'PayPal',
              pagopark: 'PagoPar',
              tarjeta: 'Tarjeta'
            }[method] || method || 'A coordinar';
          }
          """
          city_helper = payment_block + """
          function cityDepartmentLabel(order) {
            const city = clean(order?.shipping?.city, 120);
            const departamento = clean(order?.shipping?.departamento, 80);
            if (!city && !departamento) return '—';
            if (!city) return departamento;
            if (!departamento) return city;
            const normalizedCity = city.toLowerCase();
            const normalizedDepartment = departamento.toLowerCase();
            if (normalizedCity.includes(`(${normalizedDepartment})`)) return city;
            return `${city} (${departamento})`;
          }
          """
          replace_exact('functions/api/order-email.js', payment_block, city_helper)
          replace_exact(
              'functions/api/order-email.js',
              "  const items = Array.isArray(order.items) ? order.items : [];\n  const itemRows = items.map(item => `",
              "  const items = Array.isArray(order.items) ? order.items : [];\n  const cityLabel = cityDepartmentLabel(order);\n  const itemRows = items.map(item => `"
          )
          replace_exact('functions/api/order-email.js', '${escapeHtml(order?.shipping?.city)}</td></tr>', '${escapeHtml(cityLabel)}</td></tr>')
          replace_exact('functions/api/order-email.js', 'Ciudad: ${clean(order?.shipping?.city, 120)}', 'Ciudad: ${cityLabel}')

          # Auditor de contenido: convertir las incongruencias encontradas en regresiones permanentes.
          p = ROOT / 'scripts/auditar-contenido-fase-6.js'
          text = p.read_text(encoding='utf-8')
          old_files = "  adminApp: read('js/admin/admin-app.js'),\n};"
          new_files = "  adminApp: read('js/admin/admin-app.js'),\n  faq: read('preguntas-frecuentes.html'),\n  privacy: read('privacidad.html'),\n  shipping: read('envios.html'),\n  analytics: read('js/analytics/analitica.js'),\n  loginMaintenance: read('js/pages/login/mantenimiento-acceso.js'),\n  checkoutMaintenance: read('js/pages/checkout/checkout-mantenimiento.js'),\n  profileMaintenance: read('js/pages/profile/mantenimiento-perfil.js'),\n  searchController: read('js/components/navigation/compartido/control-busqueda.js'),\n  pageLoader: read('js/cargador-pagina.js'),\n  engagementCustomer: read('cloudflare/participacion-clientes.js'),\n  engagementAdmin: read('cloudflare/participacion-admin.js'),\n  orderEmail: read('functions/api/order-email.js'),\n};"
          if text.count(old_files) != 1:
              raise SystemExit('auditar-contenido-fase-6.js: bloque files inesperado')
          text = text.replace(old_files, new_files)

          marker = "\nif (failures) {"
          if text.count(marker) != 1:
              raise SystemExit('auditar-contenido-fase-6.js: marcador de cierre inesperado')
          checks = r'''

          check(
            'Las rutas limpias identifican el mismo contenido que sus alias .html',
            files.schema.includes('PAGE_PATH_TO_ID[`${file}.html`]'),
            'detectContentPageId debe resolver las rutas públicas limpias'
          );

          check(
            'Defaults restaurados conservan rutas limpias y retiro real',
            files.schema.includes("'/catalogo'") &&
              files.schema.includes("'/about'") &&
              files.schema.includes('Retiro en San Lorenzo — Gratis') &&
              !files.schema.includes("'catalogo.html', { index: 0, type: 'href'") &&
              !files.schema.includes("'about.html', { index: 1, type: 'href'"),
            'Restaurar Apariencia no debe reintroducir aliases .html ni una tienda física'
          );

          check(
            'Footer global actualiza WhatsApp aun sin span auxiliar',
            files.publicRuntime.includes("item.selector === '.tt-footer-wa-text'") &&
              files.publicRuntime.includes("element.classList.contains('tt-footer-wa')"),
            'Debe conservar el SVG y reemplazar solo el texto del enlace'
          );

          const faqQuestions = (files.faq.match(/class="tt-faq-q"/g) || []).length;
          const faqAnswers = (files.faq.match(/class="tt-faq-a"/g) || []).length;
          check(
            'FAQ estática coincide con los once índices editables',
            faqQuestions === 11 && faqAnswers === 11 &&
              !files.faq.includes('¿Los relojes son originales?') &&
              files.faq.includes('Los métodos habilitados aparecen en el checkout al confirmar tu pedido.') &&
              files.faq.includes('En cada producto indicamos su material y características.'),
            `Preguntas=${faqQuestions}, respuestas=${faqAnswers}`
          );

          check(
            'Privacidad identifica al proveedor real de geolocalización aproximada',
            files.privacy.includes('Cloudflare estima la ciudad, región y país') &&
              files.privacy.includes('Cloudflare, como proveedor técnico') &&
              !files.privacy.includes('Netlify'),
            'La política debe coincidir con functions/api/visitor-geo.js'
          );

          check(
            'Envíos describe el retiro como retiro en San Lorenzo',
            files.shipping.includes('Retiro en San Lorenzo — Gratis') &&
              !files.shipping.includes('Retiro en Tienda — Gratis'),
            'La operación es online y el retiro se coordina en San Lorenzo'
          );

          check(
            'Analítica reconoce /checkout y /checkout.html',
            files.analytics.includes('checkout(?:\\.html)?\\/?$') &&
              !files.analytics.includes('/\\/checkout\\.html$/i.test'),
            'begin_checkout no debe depender del alias .html'
          );

          check(
            'Canonical dinámicos de cuenta y checkout permanecen limpios',
            files.loginMaintenance.includes("new URL('/login', location.origin)") &&
              files.checkoutMaintenance.includes("new URL('/checkout', location.origin)") &&
              files.profileMaintenance.includes("new URL('/perfil', window.location.origin)") &&
              !files.loginMaintenance.includes("new URL('login.html'") &&
              !files.checkoutMaintenance.includes("new URL('checkout.html'") &&
              !files.profileMaintenance.includes("new URL('perfil.html'"),
            'El runtime no debe sobrescribir canonical limpios con .html'
          );

          check(
            'Búsqueda y notificaciones generan links canónicos de producto',
            files.searchController.includes('`/product?id=${encodeURIComponent') &&
              !files.searchController.includes('`product.html?id=') &&
              !files.engagementCustomer.includes('product.html?id=') &&
              !files.engagementAdmin.includes('product.html?id='),
            'Los enlaces visibles y notificaciones deben usar /product?id='
          );

          check(
            'Loader reconoce producto tanto por ruta limpia como por alias legado',
            files.pageLoader.includes('/^product(?:\\.html)?$/i.test(productPath)'),
            'El nombre del producto debe preservarse al navegar desde /product'
          );

          check(
            'Correo administrativo muestra ciudad y departamento sin duplicar',
            files.orderEmail.includes('function cityDepartmentLabel(order)') &&
              files.orderEmail.includes('const cityLabel = cityDepartmentLabel(order);') &&
              files.orderEmail.includes('${escapeHtml(cityLabel)}</td></tr>') &&
              files.orderEmail.includes('Ciudad: ${cityLabel}') &&
              files.orderEmail.includes("/admin';"),
            'El correo debe mostrar, por ejemplo, Santiago (Misiones)'
          );
          '''
          p.write_text(text.replace(marker, checks + marker), encoding='utf-8')
          print('OK scripts/auditar-contenido-fase-6.js: regresiones agregadas')
          PY

          # El helper no forma parte de la solución final.
          rm -f .github/workflows/tmp-auditoria-integral-incongruencias.yml

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar artefactos y versionado de caché
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:monaco
          npm run sync:public-shell
          npm run build:routes
          npm run build:csp
          npm run sync:public-origin
          npm run cache-versioning:write
          npm run build:diagnostics
          npm run verify:routes
          npm run verify:csp
          npm run verify:diagnostics
          npm run audit:cache-versioning

      - name: Validar contratos afectados
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            js/core/store/esquema-contenido.js \
            js/core/store/contenido-sitio.js \
            js/analytics/analitica.js \
            js/pages/login/mantenimiento-acceso.js \
            js/pages/checkout/checkout-mantenimiento.js \
            js/pages/profile/mantenimiento-perfil.js \
            js/pages/home/mantenimiento-inicio.js \
            js/components/navigation/compartido/control-busqueda.js \
            js/cargador-pagina.js \
            cloudflare/participacion-clientes.js \
            cloudflare/participacion-admin.js \
            functions/api/order-email.js \
            scripts/auditar-contenido-fase-6.js; do
            node --check "$file"
          done
          npm run audit:content
          npm run audit:phase11
          npm run audit:page-loading
          npm run audit:secure-orders
          npm run audit:integral
          git diff --check

      - name: Guardar únicamente resultado validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tintin Site Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios adicionales.'
            exit 0
          fi
          git commit -m "fix(site): alinear rutas, contenido y contratos públicos"
          git push origin HEAD:fix/auditoria-integral-incongruencias-2026-08-23
