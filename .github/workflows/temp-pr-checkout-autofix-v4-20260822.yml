name: TEMP PR checkout autofix v4 2026-08-22

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama del PR
        uses: actions/checkout@v5
        with:
          ref: fix/checkout-hardening-2026-08-22
          fetch-depth: 0

      - name: Evitar segunda pasada
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[checkout-autofix-v4\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Aplicar correcciones completas
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          # Reutiliza la corrección base ya validada en 48/48 tests.
          awk "/python3 - <<'PY'/{flag=1;next} /^          PY$/{flag=0} flag" .github/workflows/temp-pr-checkout-autofix-20260822.yml | sed 's/^          //' > /tmp/checkout_patch.py
          python3 /tmp/checkout_patch.py

          python3 - <<'PY'
          from pathlib import Path

          # Fixture con departamento real para la validación estricta del servidor.
          fixture = Path('tests/checkout/order-contract.test.mjs')
          tests = fixture.read_text(encoding='utf-8')
          tests = tests.replace(
              "'settings/shippingRates': { encomiendaCities: [{ name: 'Encarnación', price: 0 }] },",
              "'settings/shippingRates': { encomiendaCities: [{ name: 'Encarnación', price: 0, departamento: 'Itapúa' }] },",
              1
          )

          # Regresiones extra: efectivo no puede ser enviado por encomienda y el
          # saneador de correo debe conservar departamento/modo/CI/factura.
          marker = "test('PayPal queda rechazado en Apps Script hasta habilitarlo expresamente', () => {"
          extra = """test('servidor no acepta efectivo para encomienda aunque el método general esté habilitado', () => {\n  const source = fs.readFileSync(path.join(ROOT, 'apps-script', 'CrearPedido.gs'), 'utf8');\n  assert.match(source, /shipping\.method === 'encomienda' && paymentMethod === 'efectivo'/);\n});\n\ntest('sanitización de correo conserva destino y datos documentales del pedido', () => {\n  const source = fs.readFileSync(path.join(ROOT, 'apps-script', 'Seguridad.gs'), 'utf8');\n  assert.match(source, /departamento: phase3CleanText_\(shipping\.departamento, 80\)/);\n  assert.match(source, /encomiendaMode: phase3CleanText_\(shipping\.encomiendaMode, 20\)/);\n  assert.match(source, /ci: phase3CleanText_\(order\.ci, 8\)/);\n  assert.match(source, /wanted: invoice\.wanted === true/);\n});\n\n"""
          if marker not in tests:
              raise SystemExit('No se encontró marcador para tests extra')
          tests = tests.replace(marker, extra + marker, 1)
          fixture.write_text(tests, encoding='utf-8')

          # HTML: los optgroups dinámicos deben conservar ID. Sin esto, una ciudad
          # homónima en dos métodos podía quedar sin método determinable.
          checkout = Path('checkout.html')
          html = checkout.read_text(encoding='utf-8')
          old = """    const group = document.createElement('optgroup');\n    group.label = '🚚 Delivery a domicilio';"""
          new = """    const group = document.createElement('optgroup');\n    group.id = 'ck-city-delivery-group';\n    group.label = '🚚 Delivery a domicilio';"""
          if old not in html:
              raise SystemExit('No se encontró optgroup delivery')
          html = html.replace(old, new, 1)
          old = """    const group = document.createElement('optgroup');\n    group.label = '📦 Encomienda';"""
          new = """    const group = document.createElement('optgroup');\n    group.id = 'ck-city-encomienda-group';\n    group.label = '📦 Encomienda';"""
          if old not in html:
              raise SystemExit('No se encontró optgroup encomienda')
          html = html.replace(old, new, 1)

          # Retiro no debe transportar una ubicación/dirección que quedó de una
          # selección anterior de delivery.
          old = """    orderData.shippingMethod = 'retiro';\n    orderData.shippingCost = 0;\n    addressField.style.display = 'none';"""
          new = """    orderData.shippingMethod = 'retiro';\n    orderData.shippingCost = 0;\n    orderData.encomiendaMode = '';\n    orderData.address = '';\n    orderData.referencia = '';\n    orderData.mapLocation = null;\n    addressField.style.display = 'none';"""
          if old not in html:
              raise SystemExit('No se encontró rama de retiro')
          html = html.replace(old, new, 1)
          checkout.write_text(html, encoding='utf-8')

          # Servidor: la UI oculta efectivo para encomienda; el backend debe
          # imponer la misma regla para que no se pueda saltar desde consola.
          server = Path('apps-script/CrearPedido.gs')
          source = server.read_text(encoding='utf-8')
          anchor = """    if (requestedShippingMethod !== shipping.method) {\n      phase4Rollback_(transactionId);\n      return { ok: false, error: 'shipping_changed' };\n    }"""
          insert = anchor + """\n    if (shipping.method === 'encomienda' && paymentMethod === 'efectivo') {\n      phase4Rollback_(transactionId);\n      return { ok: false, error: 'payment_unavailable' };\n    }"""
          if anchor not in source:
              raise SystemExit('No se encontró validación de método de envío')
          source = source.replace(anchor, insert, 1)
          server.write_text(source, encoding='utf-8')

          # Correo seguro: no descartar campos que el pedido sí guarda.
          sec = Path('apps-script/Seguridad.gs')
          source = sec.read_text(encoding='utf-8')
          old = """  const location = shipping.mapLocation && typeof shipping.mapLocation === 'object'\n    ? shipping.mapLocation\n    : null;"""
          new = old + """\n  const invoice = order.invoice && typeof order.invoice === 'object'\n    ? order.invoice\n    : {};"""
          if old not in source:
              raise SystemExit('No se encontró contexto del saneador')
          source = source.replace(old, new, 1)
          old = """      method: phase3CleanText_(shipping.method, 40),\n      city: phase3CleanText_(shipping.city, 120),\n      address: phase3CleanText_(shipping.address, 300),"""
          new = """      method: phase3CleanText_(shipping.method, 40),\n      city: phase3CleanText_(shipping.city, 120),\n      departamento: phase3CleanText_(shipping.departamento, 80),\n      encomiendaMode: phase3CleanText_(shipping.encomiendaMode, 20),\n      address: phase3CleanText_(shipping.address, 300),"""
          if old not in source:
              raise SystemExit('No se encontró shipping saneado')
          source = source.replace(old, new, 1)
          old = """    notes: phase3CleanText_(order.notes, 1000),\n    notificationStatus: phase3CleanText_(order.notificationStatus, 40),"""
          new = """    notes: phase3CleanText_(order.notes, 1000),\n    ci: phase3CleanText_(order.ci, 8),\n    invoice: {\n      wanted: invoice.wanted === true,\n      razonSocial: phase3CleanText_(invoice.razonSocial, 180),\n      ruc: phase3CleanText_(invoice.ruc, 12)\n    },\n    notificationStatus: phase3CleanText_(order.notificationStatus, 40),"""
          if old not in source:
              raise SystemExit('No se encontró bloque documental saneado')
          source = source.replace(old, new, 1)
          sec.write_text(source, encoding='utf-8')

          # Todos los JS cuyos bytes cambiaron deben tener una URL inmutable nueva.
          replacements = {
              'admin-app.js?v=tintin-20260822-facturacion-1': 'admin-app.js?v=tintin-20260822-checkout-hardening-2',
              'estado-productos.js?v=tintin-20260821-accounts-phase-a-1': 'estado-productos.js?v=tintin-20260822-checkout-hardening-2',
              'pedido-checkout-seguro.js?v=tintin-20260822-checkout-cart-profile-1': 'pedido-checkout-seguro.js?v=tintin-20260822-checkout-hardening-2',
              'sincronizacion-carrito.js?v=tintin-20260822-checkout-cart-profile-1': 'sincronizacion-carrito.js?v=tintin-20260822-checkout-hardening-2',
          }
          for file in Path('.').rglob('*'):
              if not file.is_file() or file.suffix.lower() not in {'.js', '.mjs', '.html'}:
                  continue
              try:
                  raw = file.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              changed = raw
              for before, after in replacements.items():
                  changed = changed.replace(before, after)
              if changed != raw:
                  file.write_text(changed, encoding='utf-8')
          PY

      - name: Instalar dependencias
        if: steps.guard.outputs.skip != 'true'
        run: npm install

      - name: Validar sintaxis
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --check js/create-order-client.js
          node --check js/orders/politica-checkout.js
          node --check js/orders/pedido-checkout-seguro.js
          node --check js/pages/checkout/checkout-hardening.js
          cp apps-script/CrearPedido.gs /tmp/CrearPedido.js
          cp apps-script/Seguridad.gs /tmp/Seguridad.js
          node --check /tmp/CrearPedido.js
          node --check /tmp/Seguridad.js

      - name: Probar checkout
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:checkout-contract

      - name: Auditar pedidos seguros
        if: steps.guard.outputs.skip != 'true'
        run: npm run audit:secure-orders

      - name: Auditar versionado de caché
        if: steps.guard.outputs.skip != 'true'
        run: npm run audit:cache-versioning

      - name: Commit y push
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Tintin Checkout Autofix"
          git config user.email "actions@users.noreply.github.com"
          git add apps-script checkout.html js tests
          git diff --cached --check
          git commit -m "fix(checkout): cerrar auditoría integral [checkout-autofix-v4]"
          git push origin HEAD:fix/checkout-hardening-2026-08-22
