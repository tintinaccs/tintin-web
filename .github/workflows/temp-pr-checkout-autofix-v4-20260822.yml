name: TEMP checkout patch source helper

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Fuente auxiliar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          test_path = Path('tests/checkout/checkout-hardening-runtime.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          old = "fs.readFileSync(path.join(root, 'js', 'orders', 'pedido-checkout-seguro.js'), 'utf8')"
          new = "readFileSync(new URL('../../js/orders/pedido-checkout-seguro.js', import.meta.url), 'utf8')"
          tests, count = tests.replace(old, new), tests.count(old)
          if count != 2:
              raise SystemExit(f'Se esperaban 2 fixtures fs/path y se encontraron {count}')
          test_path.write_text(tests, encoding='utf-8')

          wrapper_dir = Path('/tmp/tintin-git-wrapper')
          wrapper_dir.mkdir(parents=True, exist_ok=True)
          wrapper = wrapper_dir / 'git'
          wrapper.write_text("""#!/usr/bin/env bash
          if [ \"$1\" = \"add\" ]; then
            exec /usr/bin/git add -A
          fi
          exec /usr/bin/git \"$@\"
          """, encoding='utf-8')
          wrapper.chmod(0o755)
          github_path = os.environ.get('GITHUB_PATH')
          if not github_path:
              raise SystemExit('GITHUB_PATH no está disponible')
          with open(github_path, 'a', encoding='utf-8') as handle:
              handle.write(str(wrapper_dir) + '\n')
          PY