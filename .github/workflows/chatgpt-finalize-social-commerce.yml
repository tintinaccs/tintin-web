name: ChatGPT finalize social commerce

on:
  push:
    branches:
      - chatgpt/social-commerce-notifications-v1

permissions:
  contents: write

jobs:
  finalize-social:
    if: ${{ !contains(github.event.head_commit.message, '[social-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final social integration patches
        run: |
          node scripts/chatgpt-finalize-social-commerce.cjs
          node scripts/chatgpt-fix-social-cache-refs.cjs

      - name: Remove temporary finalizer from final tree
        run: git rm .github/workflows/chatgpt-finalize-social-commerce.yml scripts/chatgpt-finalize-social-commerce.cjs scripts/chatgpt-fix-social-cache-refs.cjs

      - name: Refresh cache baseline and generated files
        run: |
          npm run cache-versioning:write
          npm run build:pages

      - name: Focused social checks
        run: |
          node --test tests/engagement/notificaciones-sociales.test.mjs
          npm run test:engagement
          npm run audit:email-messaging
          npm run audit:unified-navigation
          npm run audit:cache-versioning

      - name: Commit finalized branch
        run: |
          git add -A
          git config user.name "tintin-ci"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No final changes to commit."
            exit 0
          fi
          git commit -m "feat(social): finalize notification ecosystem [social-finalized]"
          git push origin HEAD:${GITHUB_REF_NAME}
