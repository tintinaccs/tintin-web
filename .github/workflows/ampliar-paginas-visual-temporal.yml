name: Ampliación temporal de páginas visuales

on:
  push:
    branches:
      - feat/apariencia-visual-studio-v2
    paths:
      - .github/workflows/ampliar-paginas-visual-temporal.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/apariencia-visual-studio-v2
          fetch-depth: 0

      - name: Ampliar páginas sin exponer flujos protegidos
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const schemaPath = path.join(root, 'js/core/store/esquema-contenido.js');
          let schema = fs.readFileSync(schemaPath, 'utf8');

          const oldIds = `export const CONTENT_PAGE_IDS = [\n  'index', 'nosotros', 'catalogo', 'collections',\n  'contact', 'envios', 'faq', 'cambios'\n];`;
          const newIds = `export const CONTENT_PAGE_IDS = [\n  'index', 'nosotros', 'catalogo', 'collections', 'product',\n  'contact', 'envios', 'faq', 'cambios', 'terminos', 'privacidad', '404'\n];`;
          if (!schema.includes(oldIds)) throw new Error('No se encontró CONTENT_PAGE_IDS esperado.');
          schema = schema.replace(oldIds, newIds);

          const mapAnchor = `  'collections.html': 'collections',\n  'contact.html': 'contact',`;
          const mapExpanded = `  'collections.html': 'collections',\n  'product.html': 'product',\n  'contact.html': 'contact',`;
          if (!schema.includes(mapAnchor)) throw new Error('No se encontró el ancla PAGE_PATH_TO_ID.');
          schema = schema.replace(mapAnchor, mapExpanded);

          const mapTail = `  'cambios-devoluciones.html': 'cambios',\n});`;
          const mapTailExpanded = `  'cambios-devoluciones.html': 'cambios',\n  'terminos.html': 'terminos',\n  'privacidad.html': 'privacidad',\n  '404.html': '404',\n});`;
          if (!schema.includes(mapTail)) throw new Error('No se encontró el cierre PAGE_PATH_TO_ID.');
          schema = schema.replace(mapTail, mapTailExpanded);

          const getter = `export function getPageSchema(pageId) {\n  return SITE_CONTENT_SCHEMA[pageId] || null;\n}`;
          const getterExpanded = `const VISUAL_ONLY_PAGE_SCHEMA = Object.freeze({\n  product: { label: 'Producto', path: 'product.html', sections: {} },\n  terminos: { label: 'Términos', path: 'terminos.html', sections: {} },\n  privacidad: { label: 'Privacidad', path: 'privacidad.html', sections: {} },\n  '404': { label: '404', path: '404.html', sections: {} },\n});\n\nexport function getPageSchema(pageId) {\n  return SITE_CONTENT_SCHEMA[pageId] || VISUAL_ONLY_PAGE_SCHEMA[pageId] || null;\n}`;
          if (!schema.includes(getter)) throw new Error('No se encontró getPageSchema esperado.');
          schema = schema.replace(getter, getterExpanded);
          fs.writeFileSync(schemaPath, schema, 'utf8');

          const versionReplacements = new Map([
            ['esquema-contenido.js?v=tintin-20260809-visual-builder-1', 'esquema-contenido.js?v=tintin-20260810-visual-studio-v2-3'],
            ['editor-visual-runtime.js?v=tintin-20260810-visual-studio-v2-2', 'editor-visual-runtime.js?v=tintin-20260810-visual-studio-v2-3'],
            ['contenido-sitio.js?v=tintin-20260810-section-reorder-1', 'contenido-sitio.js?v=tintin-20260810-visual-studio-v2-3'],
            ['visual-builder-bootstrap.js?v=tintin-20260810-visual-studio-v2-2', 'visual-builder-bootstrap.js?v=tintin-20260810-visual-studio-v2-3'],
            ['editor-visual-admin.js?v=tintin-20260810-visual-studio-v2-2', 'editor-visual-admin.js?v=tintin-20260810-visual-studio-v2-3'],
          ]);

          const files = [];
          const walk = dir => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (!['.git', 'node_modules'].includes(entry.name)) walk(full);
              } else if (entry.isFile() && (full.endsWith('.js') || full.endsWith('.html'))) files.push(full);
            }
          };
          walk(root);
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            for (const [oldValue, newValue] of versionReplacements) text = text.split(oldValue).join(newValue);
            if (file.endsWith('js/admin/appearance/editor-visual-admin.js')) {
              text = text.split('SITE_CONTENT_SCHEMA[id].label').join("(getPageSchema(id)?.label || id)");
            }
            if (text !== before) fs.writeFileSync(file, text, 'utf8');
          }

          const bootstrap = '<script type="module" src="js/visual-builder-bootstrap.js?v=tintin-20260810-visual-studio-v2-3"></script>';
          for (const name of ['product.html', 'terminos.html', 'privacidad.html', '404.html']) {
            const file = path.join(root, name);
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(bootstrap)) {
              if (!text.includes('</body>')) throw new Error(`${name} no contiene </body>`);
              text = text.replace('</body>', `${bootstrap}\n</body>`);
              fs.writeFileSync(file, text, 'utf8');
            }
          }

          const cspPath = path.join(root, 'scripts/generar-csp-cloudflare.js');
          let csp = fs.readFileSync(cspPath, 'utf8');
          const cspAnchor = `  'contact.html', 'envios.html', 'preguntas-frecuentes.html', 'cambios-devoluciones.html',\n]);`;
          const cspExpanded = `  'contact.html', 'envios.html', 'preguntas-frecuentes.html', 'cambios-devoluciones.html',\n  'product.html', 'terminos.html', 'privacidad.html', '404.html',\n]);`;
          if (!csp.includes(cspAnchor)) throw new Error('No se encontró la lista CSP de preview del editor.');
          csp = csp.replace(cspAnchor, cspExpanded);
          fs.writeFileSync(cspPath, csp, 'utf8');
          NODE

          node scripts/generar-csp-cloudflare.js
          node scripts/auditar-versionado-cache.mjs --write
          node --check js/core/store/esquema-contenido.js
          node --check js/admin/appearance/editor-visual-admin.js
          node --check js/core/store/editor-visual-runtime.js
          node --check js/core/store/contenido-sitio.js
          node --check js/visual-builder-bootstrap.js
          node --test tests/visual-builder/visual-builder-contract.test.mjs tests/visual-builder/visual-studio-global-core.test.mjs

          rm .github/workflows/ampliar-paginas-visual-temporal.yml

          git config user.name "tintinaccs-ci"
          git config user.email "tintinaccs@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(apariencia): ampliar constructor a producto y páginas informativas"
            git push origin HEAD:feat/apariencia-visual-studio-v2
          fi
