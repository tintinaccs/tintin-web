name: Ajustar smoke producto fast-nav temporal

on:
  push:
    branches:
      - perf/navegacion-inmediata-v2-20260810
    paths:
      - '.github/workflows/ajustar-smoke-producto-fast-nav-temporal.yml'

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/navegacion-inmediata-v2-20260810
          fetch-depth: 0
      - name: Reconocer el estado de carga como UI válida al revelar rápido
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/smoke-todas-paginas.mjs')
          s = p.read_text(encoding='utf-8')
          old = """        const productStates = [\n          document.getElementById('product-grid'),"""
          new = """        const productStates = [\n          document.getElementById('product-loading'),\n          document.getElementById('product-grid'),"""
          if old not in s:
              raise SystemExit('No se encontró productStates esperado')
          s = s.replace(old, new, 1)
          s = s.replace("Producto: ningún estado final quedó visible.", "Producto: ningún estado visible quedó disponible.", 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/smoke-todas-paginas.mjs
          grep -F "document.getElementById('product-loading')" scripts/smoke-todas-paginas.mjs
      - name: Retirar temporal y regenerar derivados
        run: |
          npm ci
          rm .github/workflows/ajustar-smoke-producto-fast-nav-temporal.yml
          npm run build:pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(perf): aceptar estado de carga visible en producto"
          git push origin HEAD:perf/navegacion-inmediata-v2-20260810
