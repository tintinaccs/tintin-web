name: Fallback manual — GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribir PUBLICAR_FALLBACK para usar GitHub Pages como respaldo temporal
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-fallback
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'PUBLICAR_FALLBACK'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Construir artefacto público reproducible
        run: npm run build:pages && npm run prepare:hosting
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: inputs.confirmation == 'PUBLICAR_FALLBACK'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fallback
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          error_count: 20
