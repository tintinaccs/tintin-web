name: ChatGPT finalize generated files

on:
  push:
    branches:
      - chatgpt/reviews-pink-gold-responsive

permissions:
  contents: write

jobs:
  finalize-generated:
    if: ${{ !contains(github.event.head_commit.message, '[finalize-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove this temporary workflow from the final tree
        run: git rm .github/workflows/chatgpt-finalize-generated.yml

      - name: Refresh cache baseline and generated files against the final tree
        run: |
          npm run cache-versioning:write
          npm run build:pages

      - name: Commit final generated state and self-removal
        run: |
          git add scripts/cache-version-baseline.json diagnostic-manifest.json _headers _routes.json
          git config user.name "tintin-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: finalize generated files [finalize-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
