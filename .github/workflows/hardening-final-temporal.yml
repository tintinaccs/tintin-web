name: Hardening final temporal

on:
  push:
    branches:
      - fix/final-stability-a-z-20260828

permissions:
  contents: write

concurrency:
  group: hardening-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicar-y-verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/final-stability-a-z-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Aplicar correcciones focalizadas
        run: node scripts/aplicar-hardening-final-temporal.mjs
      - name: Garantizar constante del timeout de producto
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'functions/product.js';
          let source = fs.readFileSync(path, 'utf8');
          const declaration = 'const PRODUCT_METADATA_CEILING_MS = 1400;';
          if (!source.includes(declaration)) {
            const anchor = "const CLOUDINARY_UPLOAD = '/upload/';";
            if (!source.includes(anchor)) throw new Error('No se encontró ancla para PRODUCT_METADATA_CEILING_MS');
            source = source.replace(anchor, `${anchor}\n${declaration}`);
            fs.writeFileSync(path, source);
            console.log('OK constante PRODUCT_METADATA_CEILING_MS');
          } else {
            console.log('SKIP constante PRODUCT_METADATA_CEILING_MS: ya presente');
          }
          NODE
      - name: Verificar sintaxis de Functions
        run: |
          node --check functions/api/sheets-sync-snapshot.js
          node --check functions/api/sheets-admin-webhook.js
          node --check functions/product.js
      - name: Probar contratos de sincronización
        run: npm run test:products-sync
      - name: Probar contratos arquitectónicos
        run: npm run audit:architecture-contracts
      - name: Actualizar baseline de versionado de caché
        run: npm run cache-versioning:write
      - name: Regenerar artefactos reproducibles
        run: npm run build:pages
      - name: Guardar hardening y artefactos
        run: |
          git config user.name "tintin-stability-bot"
          git config user.email "tintin-stability-bot@users.noreply.github.com"
          git add apps-script/ProductosUnificados.gs apps-script/AdminParity.gs functions/product.js js/pages/product/productos-relacionados.js tests/seo/phase11-seo.spec.js diagnostic-manifest.json _routes.json _headers scripts/cache-version-baseline.json
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes: hardening ya aplicado."
            exit 0
          fi
          git commit -m "fix: aplicar hardening A-Z pendiente"
          git push origin HEAD:fix/final-stability-a-z-20260828