name: Auditoría de colecciones Fase 4

on:
  pull_request:
    paths:
      - 'js/components/navigation/compatibilidad/colecciones.js'
      - 'js/pages/collections/presentacion-colecciones.js'
      - 'js/admin/collections/admin-collections-phase4.js'
      - 'js/pages/collections/estado-colecciones.js'
      - 'js/quality/ui-quality.js'
      - 'scripts/audit-collections-phase4.js'
      - 'package.json'
      - '.github/workflows/audit-collections-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar sintaxis
        run: |
          node --check js/components/navigation/compatibilidad/colecciones.js
          node --check js/pages/collections/presentacion-colecciones.js
          node --check js/admin/collections/admin-collections-phase4.js
          node --check js/quality/ui-quality.js
          node --check scripts/audit-collections-phase4.js
      - name: Revisar integración
        run: npm run audit:collections
