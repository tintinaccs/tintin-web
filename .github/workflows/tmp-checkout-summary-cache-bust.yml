name: Temporary checkout summary cache bust

on:
  push:
    branches:
      - fix/checkout-summary-cache-bust

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/checkout-summary-cache-bust
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply cache bust and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('checkout.html')
          text = path.read_text()
          old = 'js/pages/checkout/paypal-checkout.js?v=tintin-20260910-paypal-flow-1'
          new = 'js/pages/checkout/paypal-checkout.js?v=tintin-20260914-summary-svg-fix-2'
          if old not in text:
              raise SystemExit('Expected checkout PayPal version reference was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/cache-version-approvals.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete data.approved?.['js/pages/checkout/paypal-checkout.js'];
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
          git rm .github/workflows/tmp-checkout-summary-cache-bust.yml

      - name: Regenerate generated artifacts
        run: npm run build:pages

      - name: Commit final cache-busted tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: bust checkout summary module cache"
          git push origin HEAD:fix/checkout-summary-cache-bust
