name: Temporary patch checkout phone cache

on:
  push:
    branches:
      - fix/checkout-phone-format

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-phone-format
      - name: Align create-order-client cache tags
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'tintin-20260728-phase4-order-2'
          new = 'tintin-20260811-phone-order-1'
          changed = []
          for path in Path('js').rglob('*.js'):
              text = path.read_text(encoding='utf-8')
              if 'create-order-client.js?v=' in text and old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
          if git diff --quiet -- js; then
            echo "All cache tags already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js
          git commit -m "Align order client cache tags"
          git push origin HEAD:fix/checkout-phone-format
