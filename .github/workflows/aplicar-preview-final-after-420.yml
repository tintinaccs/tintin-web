name: Preparar preview final después de producto real

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/preview-final-after-420' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar combinación final
        run: node scripts/apply-preview-final-after-420.mjs

      - name: Retirar utilidades temporales
        run: |
          rm scripts/apply-preview-final-after-420.mjs
          rm .github/workflows/aplicar-preview-final-after-420.yml

      - name: Regenerar artefactos reproducibles
        run: |
          node scripts/auditar-versionado-cache.mjs --write
          node scripts/generar-csp-cloudflare.js
          node scripts/construir-manifiesto-diagnostico.js
          node scripts/generar-csp-cloudflare.js --check
          node scripts/verificar-manifiesto-diagnostico.js
          node scripts/auditar-versionado-cache.mjs

      - name: Validar producto dinámico y contratos estáticos
        run: |
          node --test tests/visual-builder/*.test.mjs
          node scripts/auditar-admin-apariencia-unificada.js
          node scripts/auditar-admin-contenido-apariencia.js
          node scripts/auditar-tinped-pedidos.js
          node --check js/admin/appearance/editor-visual-admin.js
          node --check js/admin/appearance/preview-dynamic-targets.js

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar layout y breakpoints reales
        run: npx playwright test tests/visual-builder/apariencia-preview-abajo.spec.js --project=chromium

      - name: Validar suite UI del editor
        run: npm run test:visual-builder-ui

      - name: Validar build reproducible
        run: npm run build:pages

      - name: Guardar resultado final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): combinar producto real y viewport de preview"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
