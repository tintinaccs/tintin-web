name: One-shot — bump CSS CLS y regenerar derivados

on:
  push:
    branches:
      - fix/cls-y-smoke-producto
    paths:
      - .github/workflows/one-shot-cls-version-bump.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/cls-y-smoke-producto
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bump every real HTML reference
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const oldRef = 'css/theme/fondo-solido-cargador.css?v=tintin-20260811-cls-product-reserve-1';
          const newRef = 'css/theme/fondo-solido-cargador.css?v=tintin-20260811-cls-desktop-stable-2';
          const ignored = new Set(['.git', 'node_modules']);
          let changed = 0;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(full); continue; }
              if (!entry.isFile() || !entry.name.endsWith('.html')) continue;
              const before = fs.readFileSync(full, 'utf8');
              if (!before.includes(oldRef)) continue;
              fs.writeFileSync(full, before.split(oldRef).join(newRef));
              changed += 1;
              console.log(`bump: ${full}`);
            }
          }
          walk('.');
          if (!changed) throw new Error('No se encontró ninguna referencia para versionar');
          console.log(`HTML actualizados: ${changed}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Approve immutable cache tag
        run: npm run cache-versioning:write

      - name: Remove one-shot source before diagnostics
        run: rm -f .github/workflows/one-shot-cls-version-bump.yml

      - name: Regenerate and verify derived files
        run: npm run build:pages

      - name: Commit complete result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(perf): versionar reserva estable de header y regenerar manifiesto"
          git push origin HEAD:fix/cls-y-smoke-producto
