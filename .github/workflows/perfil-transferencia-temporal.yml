name: Profile temporary source transfer
on:
  push:
    branches: [fix/perfil-sincronizacion-canonica-20260908]
    paths:
      - .github/workflows/perfil-transferencia-temporal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Export source without credentials or dependencies
        run: git archive --format=zip HEAD -o /tmp/tintin-profile-source.zip
      - uses: actions/upload-artifact@v6
        with:
          name: tintin-profile-source
          path: /tmp/tintin-profile-source.zip
          retention-days: 1
          if-no-files-found: error
