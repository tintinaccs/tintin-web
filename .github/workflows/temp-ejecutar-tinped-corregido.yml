name: TEMP ejecutar TINPED corregido

on:
  push:
    branches:
      - feat/pedidos-tinped-papelera

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/pedidos-tinped-papelera
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar parche TINPED con reemplazos literales seguros
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temp-implementar-tinped-papelera.yml')
          source = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('No se encontró el bloque Python de integración.')
          code = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = textwrap.dedent(code)
          bad = "result, n = re.subn(pattern, replacement, text, count=count, flags=re.S)"
          good = "result, n = re.subn(pattern, lambda _match: replacement, text, count=count, flags=re.S)"
          if bad not in code:
              raise SystemExit('No se encontró el helper re.subn a corregir.')
          code = code.replace(bad, good, 1)
          exec(compile(code, 'tinped-integration.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Retirar workflows temporales antes de generar manifiestos
        run: |
          rm -f .github/workflows/temp-debug-tinped.yml
          rm -f .github/workflows/temp-ejecutar-tinped-corregido.yml

      - name: Validar sintaxis JavaScript
        run: |
          node --check js/admin/orders/pedidos-superadmin-crud.js
          node --check js/admin/admin-app.js
          node --check js/admin/shopify-commerce-admin.js

      - name: Actualizar baseline de cache
        run: npm run cache-versioning:write

      - name: Auditorías específicas de pedidos
        run: |
          node scripts/auditar-tinped-pedidos.js
          node scripts/auditar-seguro-pedidos.js
          node scripts/auditar-admin-pedidos.js
          npm run audit:cache-versioning

      - name: Regenerar Pages y diagnóstico
        run: npm run build:pages

      - name: Revalidar árbol final
        run: |
          node scripts/auditar-tinped-pedidos.js
          node scripts/auditar-seguro-pedidos.js
          node scripts/auditar-admin-pedidos.js
          npm run audit:cache-versioning

      - name: Commit final
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(pedidos): TINPED, papelera y CRUD Super Admin'
          git push origin HEAD:feat/pedidos-tinped-papelera
