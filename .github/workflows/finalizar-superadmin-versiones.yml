name: Finalizar versiones Super Admin

on:
  push:
    branches: [feat/catalog-global-bulk-delete]
    paths:
      - '.github/workflows/finalizar-superadmin-versiones.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/catalog-global-bulk-delete
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quitar workflow temporal
        run: git rm .github/workflows/finalizar-superadmin-versiones.yml
      - name: Sincronizar versiones canónicas
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = 'tintin-20260831-notifications-auto-read-1'

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'No se encontró contrato esperado en {path}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'admin.html',
              'js/admin/notifications/notificaciones-admin.js?v=tintin-20260829-notifications-connected-2',
              f'js/admin/notifications/notificaciones-admin.js?v={version}'
          )
          replace(
              'js/admin/notifications/notificaciones-admin.js',
              "const ASSET_VERSION = 'tintin-20260829-notifications-connected-2';",
              f"const ASSET_VERSION = '{version}';"
          )
          replace(
              'js/components/navigation/compartido/configuracion.js',
              "export const SHELL_VERSION = 'tintin-20260831-product-loading-3';",
              f"export const SHELL_VERSION = '{version}';"
          )
          replace(
              'js/components/navigation/compartido/carga-navegacion.js',
              "from './configuracion.js';",
              f"from './configuracion.js?v={version}';"
          )
          replace(
              'js/components/navigation/entrada-navegacion-publica.js',
              "from './compartido/recursos-navegacion.js';",
              f"from './compartido/recursos-navegacion.js?v={version}';"
          )
          replace(
              'js/components/navigation/entrada-navegacion-publica.js',
              "from './compartido/carga-navegacion.js?v=tintin-20260831-product-loading-4';",
              f"from './compartido/carga-navegacion.js?v={version}';"
          )
          replace(
              'js/components/navigation/compartido/recursos-navegacion.js',
              "from './configuracion.js';",
              f"from './configuracion.js?v={version}';"
          )
          replace(
              'js/inicio-navegacion-publica.js',
              "const ENTRY_VERSION = 'tintin-20260831-product-loading-5';",
              f"const ENTRY_VERSION = '{version}';"
          )
          replace(
              'scripts/sincronizar-inicio-navegacion-publica.js',
              "const PUBLIC_SHELL_VERSION = 'tintin-20260831-product-loading-5';",
              f"const PUBLIC_SHELL_VERSION = '{version}';"
          )
          replace(
              'scripts/sincronizar-inicio-navegacion-publica.js',
              "const NAV_ENTRY_VERSION = 'tintin-20260831-product-loading-5';",
              f"const NAV_ENTRY_VERSION = '{version}';"
          )
          PY
          node scripts/sincronizar-inicio-navegacion-publica.js
      - name: Reconstruir diagnóstico
        run: npm run build:diagnostics
      - name: Validar cierre antes de commit
        run: |
          node --check js/admin/notifications/notificaciones-admin.js
          node --check js/components/notifications/notificaciones-clientes.js
          node scripts/auditar-superadmin-maestro.mjs
          node scripts/auditar-superadmin-maestro-conexiones.mjs
          node scripts/auditar-superadmin-cierre-total.mjs
          npm run verify:diagnostics
      - name: Commit reproducible
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: sincronizar versiones del cierre Super Admin'
          git push origin HEAD:feat/catalog-global-bulk-delete
