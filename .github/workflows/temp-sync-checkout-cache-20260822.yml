name: TEMP sync checkout cache final

on:
  push:
    branches:
      - fix/checkout-hardening-2026-08-22
    paths:
      - .github/workflows/temp-sync-checkout-cache-20260822.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/checkout-hardening-2026-08-22
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bump tienda.js and sync public shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/sincronizar-inicio-navegacion-publica.js')
          s = p.read_text(encoding='utf-8')
          old = "const VERSION = 'tintin-20260822-facturacion-1';"
          new = "const VERSION = 'tintin-20260822-checkout-hardening-1';"
          if old not in s:
              raise SystemExit('No se encontró VERSION anterior de tienda.js')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node scripts/sincronizar-inicio-navegacion-publica.js

      - name: Validate checkout and cache
        shell: bash
        run: |
          node scripts/auditar-checkout-pagina.js
          npm run audit:level2
          npm run audit:cache-versioning

      - name: Commit synchronized versions and self-clean
        shell: bash
        run: |
          git config user.name 'Tintin CI'
          git config user.email 'ci@tintin.local'
          git add scripts/sincronizar-inicio-navegacion-publica.js *.html
          git rm .github/workflows/temp-sync-checkout-cache-20260822.yml
          if git diff --cached --quiet; then
            echo 'No hay cambios para guardar.'
            exit 0
          fi
          git commit -m 'chore(cache): sincronizar versión final del checkout'
          git push origin HEAD:fix/checkout-hardening-2026-08-22
