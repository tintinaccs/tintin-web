name: Aplicar correcciones Fase 5

on:
  push:
    branches:
      - agent/fase5-rendimiento-estabilidad-20260730

permissions:
  contents: write

jobs:
  apply:
    name: Aplicar, auditar y consolidar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar cambios de rendimiento
        run: node scripts/apply-phase5-fixes.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Regenerar y verificar diagnóstico
        run: npm run build:pages

      - name: Auditar invariantes de la Fase 5
        run: npm run audit:phase5

      - name: Auditar rendimiento, lecturas y regresiones
        run: |
          npm run audit:performance
          node scripts/audit-firestore-read-budget.js
          npm run audit:performance-regressions
          npm run audit:page-loading

      - name: Ejecutar auditoría integral
        run: npm run audit:final

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Medir Web Vitals en navegador real
        id: browser_metrics
        continue-on-error: true
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 > /tmp/tintin-phase5-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          npx playwright test tests/performance/public-pages.performance.spec.js --project=chromium | tee phase5-performance.log

      - name: Mostrar resultado de navegador
        if: always()
        run: |
          test -f phase5-performance.log && cat phase5-performance.log || true
          echo "Resultado Playwright: ${{ steps.browser_metrics.outcome }}"

      - name: Retirar archivos auxiliares
        run: |
          rm -f scripts/apply-phase5-fixes.mjs
          rm -f .github/workflows/apply-phase5-fixes.yml

      - name: Crear commit final de la Fase 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: completar rendimiento y estabilidad de la Fase 5"
          git push origin HEAD:${GITHUB_REF_NAME}
