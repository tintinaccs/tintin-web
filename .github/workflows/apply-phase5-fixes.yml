name: Aplicar correcciones Fase 5

on:
  push:
    branches:
      - agent/fase5-rendimiento-estabilidad-20260730
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Aplicar, auditar y consolidar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama fuente
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Corregir escapes del generador temporal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-phase5-fixes.mjs')
          source = path.read_text()
          source = source.replace(
              "CLS=${'${vitals.cls}'} ` +",
              "CLS=${'${vitals.cls}'} \\` +",
          )
          source = source.replace(
              "duplicadas=${'${vitals.duplicateRequests}'} ` +",
              "duplicadas=${'${vitals.duplicateRequests}'} \\` +",
          )
          path.write_text(source)
          PY
          node --check scripts/apply-phase5-fixes.mjs

      - name: Aplicar cambios de rendimiento
        id: apply_changes
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/apply-phase5-fixes.mjs 2>&1 | tee phase5-apply.log

      - name: Conservar contratos auditados
        if: steps.apply_changes.outcome == 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          normal = '  <link rel="preload" href="assets-tintin/fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>\n'
          italic = '  <link rel="preload" href="assets-tintin/fonts/montserrat-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin>\n'

          for path in Path('.').glob('*.html'):
              source = path.read_text()
              if normal in source and italic not in source:
                  path.write_text(source.replace(normal, normal + italic, 1))

          audit_path = Path('scripts/audit-phase5-performance.js')
          audit = audit_path.read_text()
          old = "check('Solo Montserrat normal se precarga', italicPreloads.length === 0, italicPreloads.map(([file]) => file).join(', '));"
          new = "check('Montserrat italic conserva el preload contractual', italicPreloads.length === html.filter(([, source]) => source.includes('montserrat-latin-wght-normal.woff2\\\" as=\\\"font\\\"')).length, html.filter(([file, source]) => source.includes('montserrat-latin-wght-normal.woff2\\\" as=\\\"font\\\"') && !source.includes('montserrat-latin-wght-italic.woff2\\\" as=\\\"font\\\"')).map(([file]) => file).join(', '));"
          if old not in audit:
              raise SystemExit('No se encontró el chequeo de preload generado')
          audit_path.write_text(audit.replace(old, new))

          shell_audit_path = Path('scripts/audit-public-shell.js')
          shell_audit = shell_audit_path.read_text()
          old_version = "const VERSION = 'tintin-20260726-login-session-1';"
          new_version = "const VERSION = 'tintin-20260730-performance-phase5-1';"
          if old_version not in shell_audit:
              raise SystemExit('No se encontró la versión anterior del public shell en su auditoría')
          shell_audit_path.write_text(shell_audit.replace(old_version, new_version))
          PY
          node --check scripts/audit-phase5-performance.js
          node --check scripts/audit-public-shell.js

      - name: Guardar diagnóstico de aplicación
        if: steps.apply_changes.outcome != 'success'
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase5-apply.log
          git commit -m "chore: registrar fallo al aplicar la Fase 5" || true
          git push origin HEAD:"${TARGET_BRANCH}"
          exit 1

      - name: Instalar dependencias
        if: steps.apply_changes.outcome == 'success'
        run: npm ci

      - name: Regenerar y verificar diagnóstico
        if: steps.apply_changes.outcome == 'success'
        run: npm run build:pages

      - name: Auditar invariantes de la Fase 5
        if: steps.apply_changes.outcome == 'success'
        run: npm run audit:phase5

      - name: Auditar rendimiento, lecturas y regresiones
        if: steps.apply_changes.outcome == 'success'
        run: |
          npm run audit:performance
          node scripts/audit-firestore-read-budget.js
          npm run audit:performance-regressions
          npm run audit:page-loading

      - name: Ejecutar auditoría integral
        if: steps.apply_changes.outcome == 'success'
        run: npm run audit:final

      - name: Instalar Chromium
        if: steps.apply_changes.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Medir Web Vitals en navegador real
        if: steps.apply_changes.outcome == 'success'
        id: browser_metrics
        continue-on-error: true
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          python3 -m http.server 4173 > /tmp/tintin-phase5-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          npx playwright test tests/performance/public-pages.performance.spec.js --project=chromium | tee phase5-performance.log

      - name: Mostrar resultado de navegador
        if: steps.apply_changes.outcome == 'success' && always()
        run: |
          test -f phase5-performance.log && cat phase5-performance.log || true
          echo "Resultado Playwright: ${{ steps.browser_metrics.outcome }}"

      - name: Retirar archivos auxiliares
        if: steps.apply_changes.outcome == 'success'
        run: |
          rm -f scripts/apply-phase5-fixes.mjs
          rm -f .github/workflows/apply-phase5-fixes.yml
          rm -f phase5-apply.log

      - name: Crear commit final de la Fase 5
        if: steps.apply_changes.outcome == 'success'
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: completar rendimiento y estabilidad de la Fase 5"
          git push origin HEAD:"${TARGET_BRANCH}"
