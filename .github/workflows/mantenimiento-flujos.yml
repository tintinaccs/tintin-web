name: Revisión controlada de flujos protegidos

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Número del PR abierto contra main
        required: true
        type: string
      head_sha:
        description: SHA completo de 40 caracteres del candidato revisado
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: protected-maintenance-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      maintenance: ${{ steps.plan.outputs.maintenance }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar datos candidatos y CI sin ejecutar código del PR
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mantenimiento-flujos-github.mjs inspect

  approval:
    needs: inspect
    if: needs.inspect.outputs.maintenance == 'true'
    name: Aprobar PR ${{ github.event.pull_request.number || inputs.pr }} commit ${{ needs.inspect.outputs.head_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment:
      name: protected-flow-maintenance
      url: https://github.com/tintinaccs/tintin-web/pull/${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Registrar que GitHub habilitó el job tras revisión del entorno
        run: echo "Revisión del entorno completada. La verificación final comprobará autor, ejecución, CI y SHA."

  verdict:
    needs: [inspect, approval]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publicar veredicto para el SHA exacto
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_RESULT: ${{ needs.approval.result }}
        run: node scripts/mantenimiento-flujos-github.mjs publish
