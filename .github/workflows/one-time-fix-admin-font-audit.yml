name: Fix admin auth overlay typography

on:
  push:
    branches:
      - fix/admin-auth-guard-20260904
    paths:
      - .github/workflows/one-time-fix-admin-font-audit.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-guard-20260904
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fix typography and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/admin/admin-app.js')
          s = p.read_text(encoding='utf-8')
          old = 'font-family:Montserrat,Arial,sans-serif'
          new = 'font-family:Montserrat'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one forbidden font stack, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/one-time-fix-admin-font-audit.yml

      - name: Rebuild generated artifacts
        run: npm run build:pages

      - name: Validate full typography/cache/source state
        run: |
          npm run audit:typography
          npm run audit:cache-versioning
          node --input-type=module --check < js/admin/admin-app.js
          node --input-type=module --check < functions/admin.js
          git diff --check

      - name: Commit final typography fix
        run: |
          git config user.name "Tintin Auth Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(admin): use canonical Tintin font in auth error state"
          git push origin HEAD:fix/admin-auth-guard-20260904
