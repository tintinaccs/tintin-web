name: Canonicalize admin auth fix

on:
  push:
    branches:
      - fix/admin-auth-guard-20260904
    paths:
      - .github/workflows/one-time-admin-auth-canonicalize.yml

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-guard-20260904
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical source fix and remove temporary edge patch
        run: python3 scripts/one-time-admin-auth-canonicalize.py

      - name: Rebuild generated public artifacts
        run: npm run build:pages

      - name: Validate final repository state
        run: |
          node --input-type=module --check < js/admin/admin-app.js
          node --input-type=module --check < functions/admin.js
          grep -q 'authPersistenceReady' js/admin/admin-app.js
          grep -q 'authStateReady' js/admin/admin-app.js
          grep -q 'Init error; authenticated session preserved' js/admin/admin-app.js
          grep -q 'tintin-20260904-auth-guard-harden-2' admin.html
          test ! -e functions/js/admin/admin-app-runtime.js
          test ! -e scripts/one-time-admin-auth-canonicalize.py
          test ! -e .github/workflows/one-time-admin-auth-canonicalize.yml
          npm run audit:cache-versioning
          git diff --check

      - name: Commit canonical fix
        run: |
          git config user.name "Tintin Auth Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(auth): make admin guard canonical and remove edge source patch"
          git push origin HEAD:fix/admin-auth-guard-20260904
