name: Auditoría de catálogo y carrito Fase 7

on:
  pull_request:
    branches:
      - main
    paths:
      # `npm run audit:final` y `npm run build:pages` inspeccionan superficies
      # amplias del repositorio. La PR cubre el mismo alcance que push para
      # detectar cualquier regresión antes del merge.
      - 'catalogo.html'
      - 'admin.html'
      - 'tienda.js'
      - 'js/**'
      - 'functions/api/sheets-product-sync.js'
      - 'scripts/**'
      - 'package.json'
      - 'diagnostic-manifest.json'
      - '.github/workflows/auditar-carrito-fase-7.yml'
  push:
    branches:
      - main
    paths:
      - 'catalogo.html'
      - 'admin.html'
      - 'tienda.js'
      - 'js/**'
      - 'functions/api/sheets-product-sync.js'
      - 'scripts/**'
      - 'package.json'
      - 'diagnostic-manifest.json'
      - '.github/workflows/auditar-carrito-fase-7.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tintin-catalog-generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Auditar catálogo, sincronización y carrito
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama evaluada
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar sintaxis
        run: |
          node --check js/pages/catalog/politica-visibilidad-catalogo.js
          node --check js/core/store/estado-productos.js
          node --check js/components/cart/sincronizacion-carrito.js
          node --check js/admin/admin-app.js
          node --check tienda.js
          node --check scripts/auditar-fase-7-catalogo.js
          node --check scripts/auditar-carrito-fase-7.js
          node --check scripts/auditar-sitio-confiabilidad.js

      - name: Auditar catálogo y sincronización
        run: npm run audit:phase7-catalog

      - name: Auditar carrito
        run: npm run audit:cart

      - name: Construir artefacto reproducible antes de auditoría integral
        run: npm run build:pages

      - name: Ejecutar auditoría integral
        run: npm run audit:final

      - name: Verificar manifiesto reproducible por fingerprint
        shell: bash
        run: |
          first="$(node -p "require('./diagnostic-manifest.json').sourceFingerprint")"
          npm run build:diagnostics
          npm run verify:diagnostics
          second="$(node -p "require('./diagnostic-manifest.json').sourceFingerprint")"
          if [ -z "$first" ] || [ "$first" != "$second" ]; then
            echo "::error::El sourceFingerprint del diagnóstico no es reproducible: $first != $second"
            exit 1
          fi
          echo "Fingerprint diagnóstico reproducible: $second"
