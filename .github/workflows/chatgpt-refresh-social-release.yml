name: ChatGPT refresh social release

on:
  push:
    branches:
      - chatgpt/social-commerce-release-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[social-artifacts-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chatgpt/social-commerce-release-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Remove temporary workflow
        run: rm -f .github/workflows/chatgpt-refresh-social-release.yml

      - name: Refresh immutable cache versions
        run: npm run cache-versioning:write

      - name: Rebuild CSP and diagnostics
        run: npm run build:pages

      - name: Commit refreshed artifacts
        run: |
          git config user.name "tintin-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(social): refresh release artifacts [social-artifacts-refreshed]"
          git push origin HEAD:chatgpt/social-commerce-release-hardening
