name: TEMP checkout final v8

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  final-v8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama
        uses: actions/checkout@v5
        with:
          ref: fix/checkout-hardening-2026-08-22
          fetch-depth: 0

      - name: Evitar segunda pasada
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[checkout-final-v8\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Corregir resolver seguro y recuperación por variante
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/orders/pedido-checkout-seguro.js')
          text = path.read_text(encoding='utf-8')

          old = """          return {\n            name: text(item),\n            price: parseMoney(fallback),\n            sourceIndex\n          };"""
          new = """          return {\n            name: text(item),\n            price: parseMoney(fallback),\n            departamento: 'Central',\n            sourceIndex\n          };"""
          if old not in text:
              raise SystemExit('No se encontró normalización legacy de ciudad')
          text = text.replace(old, new, 1)

          old = """        return {\n          name: text(item.name),\n          price: Number.isFinite(price) ? price : null,\n          sourceIndex\n        };"""
          new = """        return {\n          name: text(item.name),\n          price: Number.isFinite(price) ? price : null,\n          departamento: text(item.departamento) || 'Central',\n          sourceIndex\n        };"""
          if old not in text:
              raise SystemExit('No se encontró normalización de ciudad objeto')
          text = text.replace(old, new, 1)

          resolver = r'''  function resolveShipping(settings, selectedCity, selectedDepartment, requestedMethod, location) {
            const requested = text(requestedMethod);
            if (selectedCity === '__retiro__') {
              if (requested && requested !== 'retiro') {
                throw appError('shipping_changed', 'El método de entrega cambió. Volvé a elegir cómo recibir tu pedido.');
              }
              return {
                method: 'retiro',
                city: 'Retiro coordinado',
                departamento: 'Central',
                cost: 0,
                pending: false,
                rateIndex: -1,
                mapLocation: null
              };
            }

            if (!['delivery', 'encomienda'].includes(requested)) {
              throw appError('shipping_invalid', 'Volvé a elegir tu ciudad y método de entrega.');
            }

            const wanted = text(selectedCity).toLocaleLowerCase('es');
            const wantedDepartment = text(selectedDepartment).toLocaleLowerCase('es');
            const matches = city =>
              city.name.toLocaleLowerCase('es') === wanted &&
              (!wantedDepartment || city.departamento.toLocaleLowerCase('es') === wantedDepartment);

            if (requested === 'delivery') {
              const delivery = normalizeCities(settings.deliveryCities, settings.deliveryCost).find(matches);
              if (!delivery) {
                throw appError('shipping_invalid', 'La ciudad elegida ya no está disponible para delivery.');
              }
              return {
                method: 'delivery',
                city: delivery.name,
                departamento: delivery.departamento,
                cost: delivery.price,
                pending: delivery.price === null,
                rateIndex: delivery.sourceIndex,
                mapLocation: location
              };
            }

            const encomienda = normalizeCities(settings.encomiendaCities, settings.encomiendaCost).find(matches);
            if (!encomienda) {
              throw appError('shipping_invalid', 'La ciudad elegida ya no está disponible para encomienda.');
            }
            const mode = encomiendaMode();
            if (!mode) {
              throw appError('shipping_invalid', 'Elegí si retirás en la agencia o si te lo llevamos a la puerta.');
            }
            return {
              method: 'encomienda',
              encomiendaMode: mode,
              city: encomienda.name,
              departamento: encomienda.departamento,
              cost: 0,
              pending: false,
              rateIndex: encomienda.sourceIndex,
              mapLocation: mode === 'puerta' ? location : null
            };
          }
'''
          text, count = re.subn(
              r"  function resolveShipping\(settings, selectedCity, location\) \{.*?\n  \}\n\n  function readPhone\(\)",
              resolver + "\n  function readPhone()",
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit(f'No se pudo reemplazar resolveShipping: {count}')

          old = """    const selectedCity = text(document.getElementById('ck-city')?.value);\n    const selectedDepartamentoRaw = text(document.getElementById('ck-departamento')?.value);\n    const selectedDepartamento = selectedDepartamentoRaw === '__retiro__' ? '' : selectedDepartamentoRaw;\n    const shipping = resolveShipping(settings, selectedCity, mapLocation());"""
          new = """    const citySelect = document.getElementById('ck-city');\n    const selectedCity = text(citySelect?.value);\n    const selectedDepartamentoRaw = text(document.getElementById('ck-departamento')?.value);\n    const selectedDepartamento = selectedDepartamentoRaw === '__retiro__' ? '' : selectedDepartamentoRaw;\n    const selectedOption = citySelect?.options?.[citySelect.selectedIndex];\n    const selectedGroupId = selectedOption?.parentElement?.id || '';\n    const requestedShippingMethod = selectedCity === '__retiro__'\n      ? 'retiro'\n      : selectedGroupId === 'ck-city-delivery-group'\n        ? 'delivery'\n        : selectedGroupId === 'ck-city-encomienda-group'\n          ? 'encomienda'\n          : '';\n    if (!requestedShippingMethod) {\n      throw appError('shipping_invalid', 'Volvé a elegir tu ciudad y método de entrega.');\n    }\n    const shipping = resolveShipping(\n      settings,\n      selectedCity,\n      selectedDepartamento,\n      requestedShippingMethod,\n      mapLocation()\n    );"""
          if old not in text:
              raise SystemExit('No se encontró llamada original a resolveShipping')
          text = text.replace(old, new, 1)

          old = """  function authoritativeCartFromQuote(quote) {\n    const currentById = new Map(getCartLocal().map(item => [String(item.id), item]));\n    return (quote.items || []).map(item => ({\n      ...(currentById.get(String(item.id)) || {}),\n      id: item.id,\n      name: item.name,\n      cat: item.cat || '',\n      price: Number(item.price || 0),\n      qty: Number(item.qty || 1),\n      variant: item.variant || '',\n      imageUrl: item.imageUrl || '',\n      imgUrl: item.imageUrl || ''\n    }));\n  }"""
          new = """  function cartLineKey(item) {\n    return `${String(item?.id ?? '')}\\u241f${text(item?.variant)}`;\n  }\n\n  function authoritativeCartFromQuote(quote) {\n    const currentByLine = new Map(getCartLocal().map(item => [cartLineKey(item), item]));\n    return (quote.items || []).map(item => ({\n      ...(currentByLine.get(cartLineKey(item)) || {}),\n      id: item.id,\n      name: item.name,\n      cat: item.cat || '',\n      price: Number(item.price || 0),\n      qty: Number(item.qty || 1),\n      variant: item.variant || '',\n      imageUrl: item.imageUrl || '',\n      imgUrl: item.imageUrl || ''\n    }));\n  }"""
          if old not in text:
              raise SystemExit('No se encontró authoritativeCartFromQuote original')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/checkout/checkout-hardening-runtime.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          extra = r'''

test('secure checkout resolves shipping by city, department and selected method', () => {
  const secure = fs.readFileSync(path.join(root, 'js', 'orders', 'pedido-checkout-seguro.js'), 'utf8');
  assert.match(secure, /resolveShipping\(settings, selectedCity, selectedDepartment, requestedMethod, location\)/);
  assert.match(secure, /selectedGroupId === 'ck-city-delivery-group'/);
  assert.match(secure, /selectedGroupId === 'ck-city-encomienda-group'/);
  assert.match(secure, /city\.departamento\.toLocaleLowerCase\('es'\) === wantedDepartment/);
});

test('quote recovery matches current cart metadata by product and variant', () => {
  const secure = fs.readFileSync(path.join(root, 'js', 'orders', 'pedido-checkout-seguro.js'), 'utf8');
  assert.match(secure, /function cartLineKey\(item\)/);
  assert.match(secure, /currentByLine\.get\(cartLineKey\(item\)\)/);
  assert.doesNotMatch(secure, /currentById\.get\(String\(item\.id\)\)/);
});
'''
          if "secure checkout resolves shipping by city, department and selected method" not in tests:
              tests += extra
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Instalar dependencias
        if: steps.guard.outputs.skip != 'true'
        run: npm install

      - name: Resolver versionado de caché
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          issue_re = re.compile(r'CONTENIDO CAMBIÓ SIN BUMP DE VERSIÓN: "([^"]+)" sigue con el tag "([^"]+)"')
          for round_no in range(1, 16):
              proc = subprocess.run(['npm', 'run', 'audit:cache-versioning'], text=True, capture_output=True)
              output = (proc.stdout or '') + '\n' + (proc.stderr or '')
              print(output)
              if proc.returncode == 0:
                  break
              issues = issue_re.findall(output)
              if not issues:
                  raise SystemExit('Fallo de caché no auto-resoluble')
              for local_path, old_tag in issues:
                  basename = Path(local_path).name
                  new_tag = f'tintin-20260822-checkout-final-v8-{round_no}'
                  needle = re.compile(rf'({re.escape(basename)}\?v=){re.escape(old_tag)}')
                  hits = 0
                  for file in Path('.').rglob('*'):
                      if not file.is_file() or file.suffix.lower() not in {'.js', '.mjs', '.html'}:
                          continue
                      try:
                          source = file.read_text(encoding='utf-8')
                      except UnicodeDecodeError:
                          continue
                      updated, count = needle.subn(rf'\g<1>{new_tag}', source)
                      if count:
                          file.write_text(updated, encoding='utf-8')
                          hits += count
                  if not hits:
                      raise SystemExit(f'No se pudo versionar {local_path}')
          else:
              raise SystemExit('La cascada de caché no convergió')
          PY

      - name: Validar todo
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --check js/orders/pedido-checkout-seguro.js
          npm run test:checkout-contract
          npm run audit:secure-orders
          npm run audit:cache-versioning

      - name: Commit y push
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Tintin Checkout Final"
          git config user.email "actions@users.noreply.github.com"
          git add js tests
          git diff --cached --check
          git commit -m "fix(checkout): resolver destino seguro sin ambigüedad [checkout-final-v8]"
          git push origin HEAD:fix/checkout-hardening-2026-08-22
