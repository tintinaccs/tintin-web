name: Finalize admin auth loop hotfix

on:
  push:
    branches:
      - hotfix/admin-auth-loop-deeplink

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v5
        with:
          ref: hotfix/admin-auth-loop-deeplink
          fetch-depth: 0

      - name: Remove temporary workflow before generating manifests
        run: git rm .github/workflows/hotfix-finalize-admin-auth-loop.yml

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate final generated artifacts from clean tree
        run: |
          npm run build:csp
          npm run build:diagnostics
          npm run verify:csp
          npm run verify:diagnostics
          npm run audit:cache-versioning
          npm run audit:appearance-unified
          npm run audit:admin-foundation

      - name: Commit reproducible clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): regenerar manifiesto tras limpiar hotfix"
          git push origin HEAD:hotfix/admin-auth-loop-deeplink
