name: Ajuste temporal de herencia del layout global

on:
  push:
    branches:
      - feat/apariencia-visual-studio-v2
    paths:
      - .github/workflows/ajustar-layout-herencia-temporal.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/apariencia-visual-studio-v2
          fetch-depth: 0

      - name: Conservar estilos existentes cuando no hay override
        shell: bash
        run: |
          cat > js/components/navigation/compartido/apariencia-global.js <<'JS'
          const LAYOUT_CSS_VERSION = 'tintin-20260810-global-layout-2';
          let loaded = false;

          function ensureCss() {
            if (document.getElementById('tt-global-layout-css')) return;
            const link = document.createElement('link');
            link.id = 'tt-global-layout-css';
            link.rel = 'stylesheet';
            link.href = `css/components/navigation/compartido/apariencia-global.css?v=${LAYOUT_CSS_VERSION}`;
            document.head.appendChild(link);
          }

          function safeColor(value) {
            const color = String(value || '').trim();
            return /^#[0-9a-f]{6}$/i.test(color) ? color.toLowerCase() : '';
          }

          function safeText(value, fallback, max = 80) {
            const clean = String(value ?? '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
            return clean || fallback;
          }

          function safeImage(value) {
            const src = String(value || '').trim();
            if (/^assets-tintin\/[A-Za-z0-9_./-]+$/.test(src)) return src;
            if (/^https:\/\/res\.cloudinary\.com\/[A-Za-z0-9_./,%~-]+$/i.test(src)) return src;
            return '';
          }

          function setText(selector, value) {
            document.querySelectorAll(selector).forEach(node => { node.textContent = value; });
          }

          function setDesktopShopLabel(value) {
            document.querySelectorAll('[data-shell-route="shop"]').forEach(node => {
              const textNode = [...node.childNodes].find(child => child.nodeType === Node.TEXT_NODE);
              if (textNode) textNode.nodeValue = `${value} `;
              else node.insertBefore(document.createTextNode(`${value} `), node.firstChild);
            });
            setText('#btn-tablet-tienda > span:first-child', value);
          }

          function setOptionalRoute(route, label, visible) {
            document.querySelectorAll(`[data-shell-route="${route}"]`).forEach(node => {
              node.hidden = visible === false;
              if (visible !== false) node.textContent = label;
            });
          }

          function setMobileLabel(tab, label) {
            document.querySelectorAll(`[data-shell-tab="${tab}"]`).forEach(node => {
              const labels = [...node.querySelectorAll(':scope > span')].filter(span => !span.classList.contains('tt-cart-badge'));
              const target = labels.at(-1);
              if (target) target.textContent = label;
              node.setAttribute('aria-label', label);
            });
          }

          function setMobileVisibility(tab, visible) {
            document.querySelectorAll(`[data-shell-tab="${tab}"]`).forEach(node => { node.hidden = visible === false; });
          }

          function setCustomColor(root, attribute, cssVar, value) {
            const color = safeColor(value);
            root.toggleAttribute(attribute, Boolean(color));
            if (color) root.style.setProperty(cssVar, color);
            else root.style.removeProperty(cssVar);
          }

          function applyHeader(raw = {}) {
            const root = document.documentElement;
            root.dataset.ttHeaderDensity = ['compact', 'normal', 'roomy'].includes(raw.density) ? raw.density : 'normal';
            root.dataset.ttHeaderNavStyle = ['default', 'minimal', 'pills'].includes(raw.navStyle) ? raw.navStyle : 'default';
            root.dataset.ttHeaderLogoSize = ['small', 'medium', 'large'].includes(raw.logoSize) ? raw.logoSize : 'medium';
            setCustomColor(root, 'data-tt-header-bg-custom', '--tt-global-header-bg', raw.background);
            setCustomColor(root, 'data-tt-header-text-custom', '--tt-global-header-text', raw.textColor);
            setCustomColor(root, 'data-tt-header-accent-custom', '--tt-global-header-accent', raw.accentColor);

            const brandName = safeText(raw.brandName, 'TINTÍN', 60);
            const brandTagline = safeText(raw.brandTagline, 'ACCESORIOS & RELOJES', 80);
            setText('.tt-header-brand-copy strong', brandName);
            setText('.tt-header-brand-copy small', brandTagline);

            const logo = safeImage(raw.logo);
            if (logo) {
              document.querySelectorAll('.tt-logo-img,.tt-tablet-logo-img,.tt-tablet-menu-logo-img').forEach(image => {
                image.src = logo;
                image.alt = `${brandName} ${brandTagline}`.trim();
              });
            }

            const homeVisible = raw.showHome !== false;
            const homeLabel = safeText(raw.homeLabel, 'INICIO', 40);
            const shopLabel = safeText(raw.shopLabel, 'TIENDA', 40);
            const aboutLabel = safeText(raw.aboutLabel, 'NOSOTROS', 40);
            const contactLabel = safeText(raw.contactLabel, 'CONTACTO', 40);
            setOptionalRoute('home', homeLabel, homeVisible);
            setDesktopShopLabel(shopLabel);
            setOptionalRoute('about', aboutLabel, raw.showAbout !== false);
            setOptionalRoute('contact', contactLabel, raw.showContact !== false);
            setMobileLabel('home', homeLabel.charAt(0) + homeLabel.slice(1).toLowerCase());
            setMobileLabel('shop', shopLabel.charAt(0) + shopLabel.slice(1).toLowerCase());
            setMobileLabel('search', safeText(raw.searchLabel, 'Buscar', 40));
            setMobileLabel('cart', safeText(raw.cartLabel, 'Carrito', 40));
            setMobileLabel('account', safeText(raw.accountLabel, 'Cuenta', 40));
            setMobileVisibility('home', homeVisible);
            root.dataset.ttMobileHome = homeVisible ? 'visible' : 'hidden';
          }

          function applyFooter(raw = {}) {
            const root = document.documentElement;
            root.dataset.ttFooterDensity = ['compact', 'normal', 'roomy'].includes(raw.density) ? raw.density : 'normal';
            root.dataset.ttFooterStyle = ['default', 'minimal', 'boxed'].includes(raw.style) ? raw.style : 'default';
            setCustomColor(root, 'data-tt-footer-bg-custom', '--tt-global-footer-bg', raw.background);
            setCustomColor(root, 'data-tt-footer-text-custom', '--tt-global-footer-text', raw.textColor);
            setCustomColor(root, 'data-tt-footer-accent-custom', '--tt-global-footer-accent', raw.accentColor);
            document.querySelectorAll('.tt-footer-wa').forEach(node => { node.hidden = raw.showWhatsapp === false; });
          }

          export function applyGlobalLayout(layout = {}) {
            ensureCss();
            applyHeader(layout.header || {});
            applyFooter(layout.footer || {});
            document.documentElement.dataset.ttGlobalLayout = 'ready';
            window.dispatchEvent(new CustomEvent('tintin:global-layout-ready'));
          }

          async function loadGlobalLayout() {
            if (loaded) return;
            loaded = true;
            try {
              const response = await fetch('/api/visual-studio-global-public', { headers: { accept: 'application/json' } });
              const data = response.ok ? await response.json() : null;
              if (data?.config?.layout) applyGlobalLayout(data.config.layout);
              else document.documentElement.dataset.ttGlobalLayout = 'fallback';
            } catch {
              document.documentElement.dataset.ttGlobalLayout = 'fallback';
            }
          }

          export function initGlobalNavigationAppearance() {
            ensureCss();
            if (document.body?.classList.contains('tt-public-shell-mounted')) {
              void loadGlobalLayout();
              return;
            }
            document.addEventListener('tintin:public-shell-ready', () => { void loadGlobalLayout(); }, { once: true });
          }

          initGlobalNavigationAppearance();
          JS

          cat > css/components/navigation/compartido/apariencia-global.css <<'CSS'
          html[data-tt-header-bg-custom] #tt-header-desktop-tablet,
          html[data-tt-header-bg-custom] #tt-header-tablet,
          html[data-tt-header-bg-custom] #tt-tablet-menu,
          html[data-tt-header-bg-custom] #tt-tabbar{background:var(--tt-global-header-bg)!important}
          html[data-tt-header-text-custom] #tt-header-desktop-tablet,
          html[data-tt-header-text-custom] #tt-header-tablet,
          html[data-tt-header-text-custom] #tt-tablet-menu,
          html[data-tt-header-text-custom] #tt-tabbar{color:var(--tt-global-header-text)!important}
          html[data-tt-header-text-custom] #tt-header-desktop-tablet a,
          html[data-tt-header-text-custom] #tt-header-desktop-tablet button,
          html[data-tt-header-text-custom] #tt-header-tablet a,
          html[data-tt-header-text-custom] #tt-header-tablet button,
          html[data-tt-header-text-custom] #tt-tablet-menu a,
          html[data-tt-header-text-custom] #tt-tablet-menu button,
          html[data-tt-header-text-custom] #tt-tabbar a,
          html[data-tt-header-text-custom] #tt-tabbar button{color:inherit}
          html[data-tt-header-accent-custom] .tt-desktop-active-pill,
          html[data-tt-header-accent-custom] .tt-mobile-nav-indicator{background:var(--tt-global-header-accent)!important}

          html[data-tt-header-density="compact"] .tt-header-inner,
          html[data-tt-header-density="compact"] .tt-tablet-header-inner{min-height:58px!important}
          html[data-tt-header-density="roomy"] .tt-header-inner,
          html[data-tt-header-density="roomy"] .tt-tablet-header-inner{min-height:86px!important}
          html[data-tt-header-density="compact"] #tt-tabbar{min-height:58px!important}
          html[data-tt-header-density="roomy"] #tt-tabbar{min-height:76px!important}

          html[data-tt-header-logo-size="small"] .tt-logo-img,
          html[data-tt-header-logo-size="small"] .tt-tablet-logo-img,
          html[data-tt-header-logo-size="small"] .tt-tablet-menu-logo-img{max-height:34px!important}
          html[data-tt-header-logo-size="large"] .tt-logo-img,
          html[data-tt-header-logo-size="large"] .tt-tablet-logo-img,
          html[data-tt-header-logo-size="large"] .tt-tablet-menu-logo-img{max-height:58px!important}

          html[data-tt-header-nav-style="minimal"] .tt-nav-desktop [data-desktop-nav-item],
          html[data-tt-header-nav-style="minimal"] .tt-tablet-nav>a,
          html[data-tt-header-nav-style="minimal"] .tt-tablet-tienda-btn{border-color:transparent!important;background:transparent!important;box-shadow:none!important}
          html[data-tt-header-nav-style="pills"] .tt-nav-desktop [data-desktop-nav-item],
          html[data-tt-header-nav-style="pills"] .tt-tablet-nav>a,
          html[data-tt-header-nav-style="pills"] .tt-tablet-tienda-btn{border-radius:999px!important}

          html[data-tt-footer-bg-custom] .tt-footer{background:var(--tt-global-footer-bg)!important}
          html[data-tt-footer-text-custom] .tt-footer{color:var(--tt-global-footer-text)!important}
          html[data-tt-footer-text-custom] .tt-footer a,
          html[data-tt-footer-text-custom] .tt-footer-col-title,
          html[data-tt-footer-text-custom] .tt-footer-tagline{color:inherit!important}
          html[data-tt-footer-accent-custom] .tt-footer-wa{background:var(--tt-global-footer-accent)!important}
          html[data-tt-footer-density="compact"] .tt-footer{padding-top:28px!important}
          html[data-tt-footer-density="compact"] .tt-footer-grid{gap:20px!important}
          html[data-tt-footer-density="roomy"] .tt-footer{padding-top:72px!important;padding-bottom:30px!important}
          html[data-tt-footer-density="roomy"] .tt-footer-grid{gap:52px!important}
          html[data-tt-footer-style="minimal"] .tt-footer{box-shadow:none!important;border-top:1px solid color-mix(in srgb,currentColor 15%,transparent)!important}
          html[data-tt-footer-style="boxed"] .tt-footer .container{max-width:min(1180px,calc(100% - 32px));border-radius:22px;padding:28px}
          html[data-tt-footer-style="boxed"][data-tt-footer-bg-custom] .tt-footer .container{background:color-mix(in srgb,var(--tt-global-footer-bg) 92%,var(--tt-global-footer-accent,#ad3f67) 8%)}

          @media(max-width:767px){
            html[data-tt-header-logo-size="large"] .tt-tablet-menu-logo-img{max-height:48px!important}
            html[data-tt-footer-style="boxed"] .tt-footer .container{padding:20px;border-radius:18px}
            html[data-tt-mobile-home="hidden"] #tt-tabbar{grid-template-columns:repeat(4,minmax(0,1fr))}
          }
          CSS

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();

          const entryPath = path.join(root, 'js/components/navigation/entrada-navegacion-publica.js');
          let entry = fs.readFileSync(entryPath, 'utf8');
          entry = entry.replace('apariencia-global.js?v=tintin-20260810-global-layout-1', 'apariencia-global.js?v=tintin-20260810-global-layout-2');
          fs.writeFileSync(entryPath, entry, 'utf8');

          const bootstrapPath = path.join(root, 'js/inicio-navegacion-publica.js');
          let bootstrap = fs.readFileSync(bootstrapPath, 'utf8');
          bootstrap = bootstrap.replace("const MODULE_VERSION = 'tintin-20260810-global-studio-5';", "const MODULE_VERSION = 'tintin-20260810-global-studio-6';");
          fs.writeFileSync(bootstrapPath, bootstrap, 'utf8');

          for (const name of fs.readdirSync(root).filter(name => name.endsWith('.html'))) {
            const file = path.join(root, name);
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            text = text
              .split('js/inicio-navegacion-publica.js?v=tintin-20260810-global-studio-5').join('js/inicio-navegacion-publica.js?v=tintin-20260810-global-studio-6')
              .split('js/components/navigation/entrada-navegacion-publica.js?v=tintin-20260810-global-studio-5').join('js/components/navigation/entrada-navegacion-publica.js?v=tintin-20260810-global-studio-6');
            if (text !== before) fs.writeFileSync(file, text, 'utf8');
          }
          NODE

          node scripts/auditar-versionado-cache.mjs --write
          node --check js/components/navigation/compartido/apariencia-global.js
          node --check js/components/navigation/entrada-navegacion-publica.js
          node --check js/inicio-navegacion-publica.js
          node --test tests/visual-builder/visual-studio-global-core.test.mjs

          rm .github/workflows/ajustar-layout-herencia-temporal.yml

          git config user.name "tintinaccs-ci"
          git config user.email "tintinaccs@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(apariencia): heredar estilos base en layout global"
            git push origin HEAD:feat/apariencia-visual-studio-v2
          fi
