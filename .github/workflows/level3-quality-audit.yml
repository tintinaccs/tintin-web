name: Nivel 3 — Calidad integral

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Responsive, accesibilidad, rendimiento, SEO y UI/UX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar consolidación de Fase 8
        run: |
          shopt -s nullglob
          scripts=(scripts/apply-phase8-*.mjs)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo 'La consolidación de Fase 8 ya fue aplicada.'
          else
            for script in "${scripts[@]}"; do
              node "$script"
            done
          fi

      - name: Install dependencies
        run: npm ci

      - name: Rebuild diagnostics
        run: npm run build:pages

      - name: Audit Phase 8 UI/UX
        id: phase8_ui
        continue-on-error: true
        run: npm run audit:phase8-ui > phase8-ui-audit.log 2>&1

      - name: Run final static audit
        id: final_static
        continue-on-error: true
        run: npm run audit:final > phase8-final-audit.log 2>&1

      - name: Run Level 3 static audit
        id: level3
        continue-on-error: true
        run: npm run audit:level3 > level3-quality-audit.log 2>&1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test all pages in canonical viewports
        id: canonical
        continue-on-error: true
        run: npm run audit:canonical-viewports > canonical-viewports.log 2>&1

      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/tintin-quality-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tintin-quality-http.log
          exit 1

      - name: Test Phase 8 UI/UX in Chromium
        id: phase8_browser
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:phase8-ui > phase8-ui-browser.log 2>&1

      - name: Measure Phase 5 Web Vitals
        id: phase5_performance
        continue-on-error: true
        env:
          PERF_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/performance/public-pages.performance.spec.js --project=chromium > phase5-performance.log 2>&1

      - name: Upload Level 3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level3-quality-reports
          path: |
            phase8-ui-audit.log
            phase8-final-audit.log
            phase8-ui-browser.log
            level3-quality-audit.log
            canonical-viewports.log
            phase5-performance.log
            artifacts/canonical-viewports
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce quality results
        run: |
          cat phase8-ui-audit.log
          cat phase8-final-audit.log
          cat phase8-ui-browser.log
          cat level3-quality-audit.log
          cat canonical-viewports.log
          cat phase5-performance.log
          test "${{ steps.phase8_ui.outcome }}" = "success"
          test "${{ steps.final_static.outcome }}" = "success"
          test "${{ steps.phase8_browser.outcome }}" = "success"
          test "${{ steps.level3.outcome }}" = "success"
          test "${{ steps.canonical.outcome }}" = "success"
          test "${{ steps.phase5_performance.outcome }}" = "success"

      - name: Consolidate generated changes in internal PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          rm -f \
            phase8-ui-audit.log \
            phase8-final-audit.log \
            phase8-ui-browser.log \
            level3-quality-audit.log \
            canonical-viewports.log \
            phase5-performance.log
          rm -rf artifacts/canonical-viewports

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No generated changes are pending.'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: completar UI y UX de la Fase 8"

          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Verify reproducible diagnostics
        run: |
          npm run build:pages
          git diff --exit-code -- diagnostic-manifest.json
