name: Barrido final Parte 2H

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  final-sweep:
    name: Integridad final de Partes 2A–2H
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/auditar-profunda.js
          node --check scripts/auditar-final-barrido-parte-2h.js

      - name: Rebuild and verify diagnostics
        run: npm run build:pages

      - name: Run deep repository audit
        run: npm run audit:deep

      - name: Run complete static suite
        run: npm run audit:final

      - name: Verify Firestore read budget
        run: node scripts/auditar-firestore-lecturas-presupuesto.js
