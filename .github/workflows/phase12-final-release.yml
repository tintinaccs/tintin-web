name: Fase 12 — Validación final y entrega

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'functions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'manifest.json'
      - '.github/workflows/phase12-final-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Auditoría integral de las doce fases
        run: npm run audit:final

      - name: Reglas críticas de Firestore en emulador
        run: npm run test:rules-critical

      - name: Smoke de las 18 páginas
        run: npm run test:pages

      - name: Flujos UI, accesibilidad y SEO en Chromium
        run: |
          npm run test:phase8-ui
          npm run test:phase10-a11y
          npm run test:phase11-seo

      - name: Matriz responsive canónica
        run: npm run audit:canonical-viewports

      - name: Dependencias usadas en producción
        run: npm audit --omit=dev --audit-level=critical

      - name: Registrar auditoría completa de herramientas
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit-full.json || true

      - name: Smoke real de producción
        run: npm run smoke:production:phase12

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-final-evidence
          path: |
            artifacts/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 30
