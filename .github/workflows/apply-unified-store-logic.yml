name: Aplicar lógica unificada de tienda

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/unified-store-logic' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar contrato único
        shell: bash
        run: |
          if [ -f scripts/apply-unified-store-logic.mjs ]; then
            node scripts/apply-unified-store-logic.mjs
            rm scripts/apply-unified-store-logic.mjs
          else
            echo "La corrección ya fue aplicada."
          fi

      - name: Validar sintaxis y contratos
        run: |
          node --check js/catalog-merchandising-policy.js
          node --check js/products-store.js
          node --check js/phase7-catalog-policy.js
          node --check js/catalog-stock-priority.js
          node scripts/audit-unified-store-logic.js
          node scripts/audit-phase7-catalog.js
          node scripts/audit-catalog-page.js
          node scripts/audit-product-page.js

      - name: Guardar corrección en la rama
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unificar lógica de catálogo, stock y novedades [unified-store-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
