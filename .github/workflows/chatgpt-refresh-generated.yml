name: ChatGPT refresh generated files

on:
  push:
    branches:
      - chatgpt/reviews-pink-gold-responsive

permissions:
  contents: write

jobs:
  refresh-generated:
    if: ${{ !contains(github.event.head_commit.message, '[skip generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh cache baseline and generated hosting files
        run: |
          npm run cache-versioning:write
          npm run build:pages

      - name: Commit generated files
        run: |
          git add scripts/cache-version-baseline.json diagnostic-manifest.json _headers
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "tintin-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh generated files [skip generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
