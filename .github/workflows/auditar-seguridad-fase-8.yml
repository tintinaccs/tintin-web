name: Auditoría de seguridad Fase 6

on:
  pull_request:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - '_headers'
      - 'apps-script/Seguridad.gs'
      - 'apps-script/CrearPedido.gs'
      - 'js/create-order-client.js'
      - 'scripts/auditar-admin-usuarios-roles.js'
      - 'scripts/auditar-seguro-pedidos.js'
      - 'scripts/auditar-control-tienda.js'
      - 'scripts/auditar-fase-6-seguridad.js'
      - 'scripts/probar-firestore-critico.mjs'
      - 'scripts/apply-phase7-phase11-*.mjs'
      - 'package.json'
      - '.github/workflows/auditar-seguridad-fase-8.yml'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - '_headers'
      - 'apps-script/Seguridad.gs'
      - 'apps-script/CrearPedido.gs'
      - 'js/create-order-client.js'
      - 'scripts/auditar-admin-usuarios-roles.js'
      - 'scripts/auditar-seguro-pedidos.js'
      - 'scripts/auditar-control-tienda.js'
      - 'scripts/auditar-fase-6-seguridad.js'
      - 'scripts/probar-firestore-critico.mjs'
      - 'package.json'
      - '.github/workflows/auditar-seguridad-fase-8.yml'
  workflow_dispatch:

permissions:
  contents: write

# Evita solapar dos ejecuciones de Seguridad sobre la misma PR. Las carreras
# con otros workflows se resuelven en el paso de consolidación mediante
# fetch/reset/rebuild/retry, sin cancelar checks distintos entre sí.
concurrency:
  group: tintin-security-generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Auditar reglas, endpoint y encabezados
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama evaluada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java para emuladores Firebase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aplicar consolidación temporal de Fase 11
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          shopt -s nullglob
          for applicator in scripts/apply-phase7-phase11-*.mjs; do
            node "$applicator"
          done

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar sintaxis de seguridad
        run: |
          node --check scripts/auditar-fase-6-seguridad.js
          node --check scripts/probar-firestore-critico.mjs
          node --check js/create-order-client.js
          cp apps-script/Seguridad.gs /tmp/Phase3Security.js
          cp apps-script/CrearPedido.gs /tmp/Phase4CreateOrder.js
          node --check /tmp/Phase3Security.js
          node --check /tmp/Phase4CreateOrder.js

      - name: Auditar invariantes de la Fase 6
        run: npm run audit:phase6

      - name: Ejecutar matriz adversarial de Firestore Rules
        run: npm run test:rules-phase6

      - name: Ejecutar auditoría integral
        run: npm run audit:final

      - name: Regenerar manifiesto de diagnóstico
        run: npm run build:pages

      - name: Consolidar Fase 11 y manifiesto en PR interna
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_HEAD_REF}"

          for attempt in 1 2 3; do
            echo "Intento de consolidación ${attempt}/3 sobre ${branch}"
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"

            shopt -s nullglob
            for applicator in scripts/apply-phase7-phase11-*.mjs; do
              node "$applicator"
            done
            npm run build:pages

            if git diff --quiet; then
              echo 'La consolidación ya fue incorporada por otra ejecución.'
              exit 0
            fi

            git add -A
            git commit -m "seo: consolidar publicación y monitoreo de la Fase 11"
            if git push origin HEAD:"${branch}"; then
              echo 'Consolidación publicada correctamente.'
              exit 0
            fi

            echo 'La rama avanzó durante el push; se recalculará sobre el nuevo head.'
            sleep $((attempt * 2))
          done

          echo 'No se pudo consolidar después de 3 intentos por cambios concurrentes.' >&2
          exit 1

      - name: Verificar manifiesto reproducible
        run: git diff --exit-code -- diagnostic-manifest.json
