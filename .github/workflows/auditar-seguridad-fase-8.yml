name: Auditoría de seguridad Fase 6

on:
  pull_request:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - '_headers'
      - 'config/csp-runtime.json'
      - 'config/csp-runtime.js'
      - 'scripts/generar-csp-cloudflare.js'
      - 'cloudflare/servir-admin-con-csp.js'
      - 'functions/_middleware.js'
      - 'functions/__/auth/**'
      - 'functions/admin.js'
      - 'functions/admin-images.js'
      - 'tests/security/**'
      - 'apps-script/Seguridad.gs'
      - 'apps-script/CrearPedido.gs'
      - 'js/create-order-client.js'
      - 'scripts/auditar-admin-usuarios-roles.js'
      - 'scripts/auditar-seguro-pedidos.js'
      - 'scripts/auditar-control-tienda.js'
      - 'scripts/auditar-fase-6-seguridad.js'
      - 'scripts/probar-firestore-critico.mjs'
      - 'package.json'
      - '.github/workflows/auditar-seguridad-fase-8.yml'
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - '_headers'
      - 'config/csp-runtime.json'
      - 'config/csp-runtime.js'
      - 'scripts/generar-csp-cloudflare.js'
      - 'cloudflare/servir-admin-con-csp.js'
      - 'functions/_middleware.js'
      - 'functions/__/auth/**'
      - 'functions/admin.js'
      - 'functions/admin-images.js'
      - 'tests/security/**'
      - 'apps-script/Seguridad.gs'
      - 'apps-script/CrearPedido.gs'
      - 'js/create-order-client.js'
      - 'scripts/auditar-admin-usuarios-roles.js'
      - 'scripts/auditar-seguro-pedidos.js'
      - 'scripts/auditar-control-tienda.js'
      - 'scripts/auditar-fase-6-seguridad.js'
      - 'scripts/probar-firestore-critico.mjs'
      - 'package.json'
      - '.github/workflows/auditar-seguridad-fase-8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tintin-security-generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Auditar reglas, endpoint y encabezados
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama evaluada
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java para emuladores Firebase
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar y verificar CSP evaluada
        run: npm run build:csp && npm run verify:csp

      - name: Revisar sintaxis de seguridad
        run: |
          node --check scripts/auditar-fase-6-seguridad.js
          node --check scripts/probar-firestore-critico.mjs
          node --check js/create-order-client.js
          node --check cloudflare/servir-admin-con-csp.js
          node --check functions/admin.js
          node --check functions/admin-images.js
          cp apps-script/Seguridad.gs /tmp/Phase3Security.js
          cp apps-script/CrearPedido.gs /tmp/Phase4CreateOrder.js
          node --check /tmp/Phase3Security.js
          node --check /tmp/Phase4CreateOrder.js

      - name: Auditar invariantes de la Fase 6
        run: npm run audit:phase6

      - name: Ejecutar matriz adversarial de Firestore Rules
        run: npm run test:rules-phase6

      - name: Construir artefacto reproducible antes de auditoría integral
        run: npm run build:pages

      - name: Ejecutar auditoría integral
        run: npm run audit:final

      - name: Verificar manifiesto reproducible por fingerprint
        shell: bash
        run: |
          first="$(node -p "require('./diagnostic-manifest.json').sourceFingerprint")"
          npm run build:diagnostics
          npm run verify:diagnostics
          second="$(node -p "require('./diagnostic-manifest.json').sourceFingerprint")"
          if [ -z "$first" ] || [ "$first" != "$second" ]; then
            echo "::error::El sourceFingerprint del diagnóstico no es reproducible: $first != $second"
            exit 1
          fi
          echo "Fingerprint diagnóstico reproducible: $second"
