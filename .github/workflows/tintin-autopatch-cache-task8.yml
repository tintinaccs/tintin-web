name: TINTIN autopatch temporal cache tarea 8

on:
  push:
    branches:
      - feat/system-health-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/system-health-dashboard
          fetch-depth: 0
      - name: Bump admin entrypoint
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          old = 'admin-app.js?v=tintin-20260825-web-push-integration-1'
          new = 'admin-app.js?v=tintin-20260827-admin-orders-sync-1'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old admin-app tag, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'chore: versionar entrada actualizada de Superadmin'
          git push origin HEAD:feat/system-health-dashboard
