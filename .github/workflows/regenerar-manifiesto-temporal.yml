name: Regenerar manifiesto temporal

on:
  push:
    branches:
      - fix/comprobaciones-post-merge-navegacion

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar manifiesto y retirar este flujo temporal
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/regenerar-manifiesto-temporal.yml
          node scripts/build-diagnostic-manifest.js
          node scripts/verify-diagnostic-manifest.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerar manifiesto tras renombrar navegación"
          git push origin "HEAD:${GITHUB_REF_NAME}"
