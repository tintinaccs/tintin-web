name: Auditoría de estado integral del ecosistema

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-health:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Validar sintaxis
        run: |
          node --check cloudflare/system-health.js
          node --check cloudflare/admin-runtime-health.js
          node --check cloudflare/sheets-sync-config.js
          node --check functions/api/system-health.js
          node --check functions/api/health.js
          node --check functions/api/sheets-product-sync.js
          node --check js/admin/diagnostics/estado-ecosistema-admin.js
          node --check scripts/auditar-estado-ecosistema.mjs

      - name: Auditar estado integral y seguridad
        run: npm run audit:system-health

      - name: Verificar versionado de caché
        run: npm run audit:cache-versioning
