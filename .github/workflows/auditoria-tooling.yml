name: Auditoría tooling

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auditoria-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-audit:
    name: Tooling dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capturar auditoría completa de dependencias de desarrollo
        shell: bash
        run: |
          set +e
          npm audit --json > tooling-audit.json
          code=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('tooling-audit.json', 'utf8'));
          const rows = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: Boolean(item.isDirect),
            via: (item.via || []).map(v => typeof v === 'string' ? v : `${v.name}:${v.title || ''}`).join(' | '),
            range: item.range,
            fix: item.fixAvailable
          }));
          console.log('TOOLING_AUDIT_BEGIN');
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities: rows }, null, 2));
          console.log('TOOLING_AUDIT_END');
          NODE
          exit 0
      - uses: actions/upload-artifact@v6
        with:
          name: tooling-audit-json
          path: tooling-audit.json
          retention-days: 7
