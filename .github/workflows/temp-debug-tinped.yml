name: TEMP debug TINPED
on:
  push:
    branches: [feat/pedidos-tinped-papelera]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pedidos-tinped-papelera
      - name: Verificar anclas del parche
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          misses=[]
          def txt(p): return Path(p).read_text(encoding='utf-8')
          def has(label, cond):
            if not cond:
              misses.append(label); print(f'::error title=TINPED patch miss::{label}')
          a=txt('js/admin/admin-app.js')
          has('admin import', "import './products/integridad-inventario-admin.js?v=tintin-20260722-order-delete-2';" in a)
          has('admin status regex', bool(re.search(r"window\.updateOrderStatus = async \(orderId, status\) => \{.*?\n\};\n\n// Protección anti-spam",a,re.S)))
          has('admin delete regex', bool(re.search(r"window\.deleteOrder = async \(orderId\) => \{.*?\n\};\n\nlet _lastFilteredOrders",a,re.S)))
          has('admin search', "    (o.id||'').toLowerCase().includes(search)\n" in a)
          has('admin bulk regex', bool(re.search(r"window\.bulkDeleteOrders = async function\(\) \{.*?\n\};\n\nfunction orderRowsToCsv_",a,re.S)))
          has('admin csv', "    o.id,\n    o.userName || ''," in a)
          has('admin legacy code', 'escapeHtmlAdmin(o.id.slice(-6).toUpperCase())' in a)
          s=txt('js/admin/shopify-commerce-admin.js')
          has('shop ordersReady', '  ordersReady: false,\n' in s)
          has('shop orders state', '  orders: [],\n' in s)
          has('shop orderItems helper', "function orderItems(order) {\n  return Array.isArray(order?.items) ? order.items.filter(Boolean) : [];\n}\n" in s)
          has('shop counts regex', bool(re.search(r"function orderTabCounts\(\) \{.*?\n\}\n\nfunction collectionTabCounts",s,re.S)))
          has('shop filtered regex', bool(re.search(r"function filteredOrders\(\) \{.*?\n\}\n\nfunction tabButton",s,re.S)))
          has('shop render regex', bool(re.search(r"function renderOrders\(\) \{.*?\n\}\n\nfunction renderAll",s,re.S)))
          has('shop export regex', bool(re.search(r"function exportOrders\(selectedOnly = false\) \{.*?\n\}\n\nfunction closeMenu",s,re.S)))
          has('shop menu regex', bool(re.search(r"function menuItems\(type, id\) \{.*?\n\}\n\nfunction openMenu",s,re.S)))
          has('shop drawer title', '    title: `#${order.id}`,' in s)
          has('shop action anchor', "  if (action === 'orders-export') return exportOrders(false);" in s)
          old_sub="""  state.unsubscribers.push(onSnapshot(collection(db, 'orders'), snapshot => {\n    state.orders = snapshot.docs.map(snap => ({ id: snap.id, ...snap.data() }));\n    state.ordersReady = true;\n    state.orderSelected = new Set([...state.orderSelected].filter(id => state.orders.some(o => o.id === id)));\n    renderOrders(); renderDrawer();\n  }, error => {\n    state.ordersReady = true;\n    console.error('[shopify-commerce] orders:', error);\n    toast('No se pudieron actualizar los pedidos en tiempo real.', 5000);\n    renderOrders();\n  }));"""
          has('shop subscription', old_sub in s)
          r=txt('firestore.rules')
          has('rules order create comment', "      // Los pedidos se crean exclusivamente en apps-script/Phase4CreateOrder.gs.\n      // Ese proceso verifica el idToken, vuelve a leer precio/stock y usa una\n      // transacción privilegiada. Ningún SDK del navegador puede crear pedidos.\n      allow create: if false;" in r)
          marker="    /* ============================================================\n       AUDIT / PERMISSIONS\n       ============================================================ */"
          has('rules audit marker', marker in r)
          g=txt('apps-script/CrearPedido.gs')
          has('apps read path', "      'settings/shippingRates',\n      'users/' + uid," in g)
          has('apps short id', "    var shortId = requestId.replace(/[^A-Za-z0-9]/g, '').slice(-8).toUpperCase();\n    var nowIso = new Date().toISOString();" in g)
          has('apps order field', "      shortId: shortId,\n      userId: uid," in g)
          has('apps writes', "    var writes = [phase4CreateWrite_('orders/' + orderId, orderData)];" in g)
          sec=txt('scripts/auditar-seguro-pedidos.js')
          has('secure create audit regex', bool(re.search(r"check\(\n  'Las reglas de Firestore bloquean todo pedido directo desde el navegador',.*?\n\);",sec,re.S)))
          has('secure sequence anchor', "check(\n  'El servidor exige tienda abierta, cuenta activa y turno de compra vigente'," in sec)
          adm=txt('scripts/auditar-admin-pedidos.js')
          for label,title in [('audit delete','Eliminar pedido: permiso + confirmación destructiva + auditoría'),('audit inventory','Eliminar pedido libera inventario antes de borrar y no depende de reglas nuevas'),('audit delete result','La eliminación individual informa el motivo real y expone el resultado al sincronizador'),('audit bulk','La eliminación masiva conserva los fallos y recalcula solo cuentas afectadas')]:
            has(label, bool(re.search(r"check\(\n  '"+re.escape(title)+r"'.*?\n\);",adm,re.S)))
          if misses:
            raise SystemExit(f'{len(misses)} anclas faltantes')
          print('Todas las anclas están presentes')
          PY
