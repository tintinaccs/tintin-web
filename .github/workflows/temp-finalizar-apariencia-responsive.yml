name: TEMP finalizar Apariencia responsive

on:
  push:
    branches:
      - fix/apariencia-preview-responsive

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout rama
        uses: actions/checkout@v5
        with:
          ref: fix/apariencia-preview-responsive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar tipografía y cache
        run: |
          npm run audit:typography
          npm run audit:cache-versioning

      - name: Regenerar artefactos de Pages
        run: npm run build:pages

      - name: Verificar editor visual
        run: npm run test:visual-builder

      - name: Guardar artefactos finales y retirar workflow temporal
        shell: bash
        run: |
          rm -f .github/workflows/temp-finalizar-apariencia-responsive.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(apariencia): regenerar artefactos de Pages'
            git push origin HEAD:fix/apariencia-preview-responsive
          fi
