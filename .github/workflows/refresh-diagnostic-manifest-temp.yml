name: Temporary diagnostic manifest refresh

on:
  push:
    branches:
      - fix/admin-auth-loop-20260904

permissions:
  contents: write

concurrency:
  group: temp-diagnostic-manifest-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/admin-auth-loop-20260904
          fetch-depth: 0

      - name: Remove temporary workflow before fingerprinting
        run: rm .github/workflows/refresh-diagnostic-manifest-temp.yml

      - name: Regenerate diagnostic manifest
        run: node scripts/construir-manifiesto-diagnostico.js

      - name: Commit final manifest and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-manifest.json .github/workflows/refresh-diagnostic-manifest-temp.yml
          git commit -m "ci: refresh diagnostic manifest after admin auth fix"
          git push origin HEAD:fix/admin-auth-loop-20260904
