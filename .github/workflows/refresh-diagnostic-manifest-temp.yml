name: Temporary diagnostic manifest refresh

on:
  push:
    branches:
      - fix/otp-deliverability-observability-20260904

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/otp-deliverability-observability-20260904
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove temporary workflow before fingerprinting
        run: rm -f .github/workflows/refresh-diagnostic-manifest-temp.yml

      - name: Regenerate diagnostic manifest
        run: npm run build:diagnostics

      - name: Commit final manifest and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diagnostic-manifest.json .github/workflows/refresh-diagnostic-manifest-temp.yml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "ci: refresh diagnostic manifest after otp delivery fix"
          git push origin HEAD:fix/otp-deliverability-observability-20260904
