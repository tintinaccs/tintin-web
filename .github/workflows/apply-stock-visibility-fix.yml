name: Aplicar corrección de stock visible

on:
  push:
    branches:
      - fix/stock-visible-stable-order

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[stock-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Corregir visibilidad, compra y orden
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: se esperaba 1 coincidencia y se encontraron {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'js/phase7-catalog-policy.js',
              """export function isPurchasable(product) {
            const p = normalizeProduct(product);
            return Boolean(
              p.id &&
              p.name &&
              p.category &&
              p.active !== false &&
              Number.isInteger(p.price) &&
              p.price > 0 &&
              p.price <= 1_000_000_000 &&
              (p.stock == null || (Number.isInteger(p.stock) && p.stock > 0)) &&
              categoryIsVisible(p)
            );
          }
          """,
              """export function isCatalogVisible(product) {
            const p = normalizeProduct(product);
            return Boolean(
              p.id &&
              p.name &&
              p.category &&
              p.active !== false &&
              Number.isInteger(p.price) &&
              p.price > 0 &&
              p.price <= 1_000_000_000 &&
              (p.stock == null || Number.isInteger(p.stock)) &&
              categoryIsVisible(p)
            );
          }

          export function isPurchasable(product) {
            const p = normalizeProduct(product);
            return isCatalogVisible(p) && (p.stock == null || p.stock > 0);
          }
          """
          )

          replace_once(
              'js/phase7-catalog-policy.js',
              """function filterProducts(products) {
            return (Array.isArray(products) ? products : [])
              .map(normalizeProduct)
              .filter(isPurchasable)
              .sort((a, b) => a.name.localeCompare(b.name, 'es'));
          }
          """,
              """function filterProducts(products) {
            return (Array.isArray(products) ? products : [])
              .map(normalizeProduct)
              .filter(isCatalogVisible)
              .sort((a, b) => a.name.localeCompare(b.name, 'es'));
          }
          """
          )

          replace_once(
              'js/phase7-catalog-policy.js',
              """    if (!isPurchasable(normalized)) {
                window._showProductNotFound?.();
                return undefined;
              }
          """,
              """    if (!isCatalogVisible(normalized)) {
                window._showProductNotFound?.();
                return undefined;
              }
          """
          )

          replace_once(
              'js/phase7-catalog-policy.js',
              """  normalizeVariantOptions,
            isPurchasable,
            hasVariants,
          """,
              """  normalizeVariantOptions,
            isCatalogVisible,
            isPurchasable,
            hasVariants,
          """
          )

          replace_once(
              'js/products-store.js',
              """function normalizeList(list) {
            return list
              .filter(Boolean)
              .map(product => window.TintinCatalogPolicy?.normalizeProduct
                ? window.TintinCatalogPolicy.normalizeProduct(product)
                : product)
              .filter(product => window.TintinCatalogPolicy?.isPurchasable
                ? window.TintinCatalogPolicy.isPurchasable(product)
                : product.active !== false && Boolean(product.name) && !(product.stock != null && Number(product.stock) <= 0))
              .sort((a, b) => a.name.localeCompare(b.name, 'es'));
          }
          """,
              """function normalizeList(list) {
            return list
              .filter(Boolean)
              .map(product => window.TintinCatalogPolicy?.normalizeProduct
                ? window.TintinCatalogPolicy.normalizeProduct(product)
                : product)
              .filter(product => window.TintinCatalogPolicy?.isCatalogVisible
                ? window.TintinCatalogPolicy.isCatalogVisible(product)
                : product.active !== false && Boolean(product.name) && Number.isFinite(Number(product.price)) && Number(product.price) > 0)
              .sort((a, b) => a.name.localeCompare(b.name, 'es'));
          }
          """
          )

          replace_once(
              'js/products-store.js',
              """  if (window.TintinCatalogPolicy?.isPurchasable && !window.TintinCatalogPolicy.isPurchasable(product)) return null;
          """,
              """  if (window.TintinCatalogPolicy?.isCatalogVisible && !window.TintinCatalogPolicy.isCatalogVisible(product)) return null;
          """
          )

          replace_once(
              'js/products-store.js',
              """        if (product.active === false || !product.name ||
                    (window.TintinCatalogPolicy?.isPurchasable && !window.TintinCatalogPolicy.isPurchasable(product))) {
          """,
              """        if (product.active === false || !product.name ||
                    (window.TintinCatalogPolicy?.isCatalogVisible && !window.TintinCatalogPolicy.isCatalogVisible(product))) {
          """
          )

          replace_once(
              'catalogo.html',
              """    .tt-card-price { font-size: 15px; font-weight: 800; color: #963653; margin-bottom: 12px; }
          """,
              """    .tt-card-price { font-size: 15px; font-weight: 800; color: #963653; margin-bottom: 8px; }
            .tt-card-stock {
              display: inline-flex; align-items: center; gap: 6px; width: fit-content;
              margin-bottom: 12px; font-size: 10px; font-weight: 800;
              letter-spacing: .08em; text-transform: uppercase;
            }
            .tt-card-stock::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
            .tt-card-stock--in { color: #26824b; }
            .tt-card-stock--out { color: #c52f3f; }
          """
          )

          replace_once(
              'catalogo.html',
              """  // Out-of-stock products may appear when browsing a category or searching,
            // but always sink to the end regardless of the chosen sort order.
            lista = [...lista.filter(isInStockCat), ...lista.filter(p => !isInStockCat(p))];

          """,
              """  // El stock no modifica el orden. Un producto agotado conserva exactamente
            // su posición y vuelve a estar disponible en ese mismo lugar al reponerse.

          """
          )

          replace_once(
              'catalogo.html',
              """          <div class=\"tt-card-price\">${fmt(p.price)}</div>
                    <div class=\"tt-card-btns\">
          """,
              """          <div class=\"tt-card-price\">${fmt(p.price)}</div>
                    <div class=\"tt-card-stock ${inStock ? 'tt-card-stock--in' : 'tt-card-stock--out'}\">${inStock ? 'Disponible' : 'Agotado'}</div>
                    <div class=\"tt-card-btns\">
          """
          )

          replace_once(
              'catalogo.html',
              """            ${hasVariants
                        ? `<a class=\"tt-card-btn tt-card-btn-cart\" href=\"${productHref}\">Elegir opciones</a>`
                        : `<button type=\"button\" class=\"tt-card-btn tt-card-btn-cart\" data-pid=\"${safeId}\"${inStock ? '' : ' disabled aria-disabled=\"true\"'}>${inStock ? '+ Carrito' : 'Agotado'}</button>`}
          """,
              """            ${!inStock
                        ? `<button type=\"button\" class=\"tt-card-btn tt-card-btn-cart\" disabled aria-disabled=\"true\">Agotado</button>`
                        : hasVariants
                          ? `<a class=\"tt-card-btn tt-card-btn-cart\" href=\"${productHref}\">Elegir opciones</a>`
                          : `<button type=\"button\" class=\"tt-card-btn tt-card-btn-cart\" data-pid=\"${safeId}\">+ Carrito</button>`}
          """
          )

          replace_once(
              'script.js',
              """function _renderProductDetail(product) {
            if (window.TintinCatalogPolicy?.isPurchasable && !window.TintinCatalogPolicy.isPurchasable(product)) {
              _showProductNotFound();
              return;
            }
          """,
              """function _renderProductDetail(product) {
            const catalogPolicy = window.TintinCatalogPolicy;
            const isVisible = catalogPolicy?.isCatalogVisible
              ? catalogPolicy.isCatalogVisible(product)
              : !(catalogPolicy?.isPurchasable && !catalogPolicy.isPurchasable(product));
            if (!isVisible) {
              _showProductNotFound();
              return;
            }
          """
          )

          replace_once(
              'scripts/audit-phase7-catalog.js',
              """check(
            'Productos agotados u ocultos no reaparecen por URL directa',
            /installDetailGuard/.test(policy) &&
              /_showProductNotFound/.test(policy) &&
              /TintinCatalogPolicy\?\.isPurchasable/.test(products) &&
              /function _renderProductDetail\(product\)[\s\S]{0,220}TintinCatalogPolicy/.test(storefront),
            'La ficha directa debe usar la misma política que las listas públicas.'
          );
          """,
              """check(
            'Los agotados permanecen visibles, pero no se pueden comprar',
            /export function isCatalogVisible/.test(policy) &&
              /return isCatalogVisible\(p\) && \(p\.stock == null \|\| p\.stock > 0\)/.test(policy) &&
              /\.filter\(isCatalogVisible\)/.test(policy) &&
              /TintinCatalogPolicy\?\.isCatalogVisible/.test(products) &&
              /catalogPolicy\?\.isCatalogVisible/.test(storefront),
            'Stock cero debe conservar la ficha y la tarjeta, mientras carrito y compra siguen bloqueados.'
          );

          check(
            'El stock no altera la posición del producto en el catálogo',
            /El stock no modifica el orden/.test(catalog) &&
              !/lista = \[\.\.\.lista\.filter\(isInStockCat\)/.test(catalog) &&
              /tt-card-stock--in/.test(catalog) &&
              /Disponible/.test(catalog) &&
              /disabled aria-disabled=\\\"true\\\">Agotado/.test(catalog),
            'Agotar o reponer stock no debe mandar la tarjeta al final ni ocultarla.'
          );
          """
          )

          replace_once(
              'js/page-maintenance-loader.js',
              "import './phase7-catalog-policy.js?v=tintin-20260730-phase7-catalog-1';",
              "import './phase7-catalog-policy.js?v=tintin-20260730-stock-visibility-1';"
          )
          replace_once(
              'js/products-store.js',
              "import './page-maintenance-loader.js?v=tintin-20260720-read-budget-1';",
              "import './page-maintenance-loader.js?v=tintin-20260730-stock-visibility-1';"
          )
          replace_once(
              'js/public-shell.js',
              "const VERSION = 'tintin-20260730-performance-phase5-1';",
              "const VERSION = 'tintin-20260730-stock-visibility-1';"
          )
          for page in ('catalogo.html', 'product.html'):
              replace_once(
                  page,
                  'js/public-shell.js?v=tintin-20260730-performance-phase5-1',
                  'js/public-shell.js?v=tintin-20260730-stock-visibility-1'
              )
          replace_once(
              'product.html',
              'script.js?v=tintin-20260730-performance-phase5-2',
              'script.js?v=tintin-20260730-stock-visibility-1'
          )
          PY

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Validar corrección
        run: |
          node --check js/phase7-catalog-policy.js
          node --check js/products-store.js
          node --check script.js
          npm run audit:phase7-catalog

      - name: Guardar cambios
        shell: bash
        run: |
          rm .github/workflows/apply-stock-visibility-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: mantener agotados visibles y en su posición [stock-fix-applied]"
          git push origin HEAD:${{ github.ref_name }}
