name: Auditoría de GitHub Actions soportadas

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/auditar-github-actions-soportadas.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/auditar-github-actions-soportadas.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-actions:
    name: Sin Actions obsoletas bloqueadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/auditar-github-actions-soportadas.mjs
