name: Sincronizar Fase 8 con main

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/sync-phase8-main.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/fase8-ui-ux-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de Fase 8
        uses: actions/checkout@v4
        with:
          ref: agent/fase8-ui-ux-20260730
          fetch-depth: 0

      - name: Integrar main sin perder Fase 8 ni stock visible
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "La rama ya contiene main."
            git rm -f .github/workflows/sync-phase8-main.yml
            git commit -m "chore: retirar sincronizador temporal"
            git push origin HEAD:agent/fase8-ui-ux-20260730
            exit 0
          fi

          set +e
          git merge origin/main --no-edit
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(catalogo\.html|product\.html)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Conflictos no previstos:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            for file in catalogo.html product.html; do
              if git diff --name-only --diff-filter=U | grep -qx "$file"; then
                git checkout --theirs -- "$file"
                python - "$file" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'js/page-loader.js?v=tintin-20260730-appcheck-stable-4',
              'js/page-loader.js?v=tintin-20260730-phase8-ui-1'
          )
          path.write_text(text, encoding='utf-8')
          PY
                git add "$file"
              fi
            done
          fi

          git rm -f .github/workflows/sync-phase8-main.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No quedaron cambios para consolidar."
            exit 0
          fi

          if [ "$merge_status" -ne 0 ]; then
            git commit --no-edit
          else
            git commit --amend --no-edit
          fi
          git push origin HEAD:agent/fase8-ui-ux-20260730
