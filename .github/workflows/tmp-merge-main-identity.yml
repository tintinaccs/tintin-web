name: Temporary merge main into identity branch

on:
  push:
    branches:
      - fix/unificar-identidad-y-pedidos
    paths:
      - .github/workflows/tmp-merge-main-identity.yml

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/unificar-identidad-y-pedidos
          fetch-depth: 0
      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/tmp-merge-main-identity.yml
          git add -A
          git commit -m "chore: remove temporary branch sync workflow"
          git push origin HEAD:fix/unificar-identidad-y-pedidos
