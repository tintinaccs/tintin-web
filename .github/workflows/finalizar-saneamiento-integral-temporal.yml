name: Finalizar saneamiento integral temporal

on:
  push:
    branches:
      - chatgpt/full-site-hardening-20260814

permissions:
  contents: write

concurrency:
  group: full-site-hardening-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Integrar gates nuevos en package.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['audit:edge'] = 'node scripts/auditar-operacion-edge.mjs';
          pkg.scripts['audit:cutover'] = 'node scripts/auditar-cutover-dominio.mjs';
          const prefix = 'npm run verify:public-origin && npm run audit:public-routes';
          const replacement = `${prefix} && npm run audit:edge && npm run audit:cutover`;
          if (!pkg.scripts['audit:final'].includes('npm run audit:edge')) {
            pkg.scripts['audit:final'] = pkg.scripts['audit:final'].replace(prefix, replacement);
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Adaptar inventario diagnóstico a clean URLs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/construir-manifiesto-diagnostico.js';
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes('function localReferenceExists(')) {
            const marker = '\nfunction labelForPage(file, title) {';
            const helper = [
              '',
              'const CLEAN_ROUTE_FILES = new Map([',
              "  ['', 'index.html'],",
              "  ['about', 'about.html'],",
              "  ['catalogo', 'catalogo.html'],",
              "  ['collections', 'collections.html'],",
              "  ['product', 'product.html'],",
              "  ['contact', 'contact.html'],",
              "  ['envios', 'envios.html'],",
              "  ['cambios-devoluciones', 'cambios-devoluciones.html'],",
              "  ['preguntas-frecuentes', 'preguntas-frecuentes.html'],",
              "  ['terminos', 'terminos.html'],",
              "  ['privacidad', 'privacidad.html'],",
              "  ['checkout', 'checkout.html'],",
              "  ['login', 'login.html'],",
              "  ['perfil', 'perfil.html'],",
              "  ['admin', 'admin.html'],",
              "  ['admin-images', 'admin-images.html'],",
              "  ['404', '404.html'],",
              "  ['nosotros', 'nosotros.html']",
              ']);',
              '',
              'function localReferenceExists(target, allPaths) {',
              '  if (allPaths.has(target)) return true;',
              "  const clean = String(target || '').replace(/^\\/+|\\/+$/g, '');",
              '  const physical = CLEAN_ROUTE_FILES.get(clean);',
              '  return Boolean(physical && allPaths.has(physical));',
              '}',
              ''
            ].join('\n');
            if (!source.includes(marker)) throw new Error('No se encontró ancla de diagnóstico.');
            source = source.replace(marker, helper + marker);
          }
          source = source.replace('exists: allPaths.has(item.target)', 'exists: localReferenceExists(item.target, allPaths)');
          fs.writeFileSync(file, source);
          NODE

      - name: Adaptar auditores históricos a imports, origen y rutas limpias
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          {
            const file = 'scripts/auditar-imagenes-fase-5.js';
            let source = fs.readFileSync(file, 'utf8');
            const legacyImport = `files.mediaLibrary.includes("import { apiUrl } from '../../core/firebase/origen-funciones.js")`;
            const robustImport = `/import\\s*\\{\\s*apiUrl\\s*\\}\\s*from\\s*['\"]\\.\\.\\/\\.\\.\\/core\\/firebase\\/origen-funciones\\.js(?:\\?[^'\"]+)?['\"]/.test(files.mediaLibrary)`;
            if (source.includes(legacyImport)) source = source.replace(legacyImport, robustImport);
            source = source.replace(
              `files.functionOrigin.includes('CLOUDFLARE_FALLBACK_ORIGIN')`,
              `files.functionOrigin.includes('TINTIN_FUNCTIONS_FALLBACK_ORIGIN')`
            );
            if (!source.includes(robustImport)) throw new Error('No se pudo adaptar el contrato de apiUrl en Fase 5.');
            if (!source.includes(`files.functionOrigin.includes('TINTIN_FUNCTIONS_FALLBACK_ORIGIN')`)) throw new Error('No se pudo adaptar el origen en Fase 5.');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/auditar-sitio-confiabilidad.js';
            let source = fs.readFileSync(file, 'utf8');
            const legacyImport = `activity.includes("import { apiUrl } from '../core/firebase/origen-funciones.js")`;
            const robustImport = `/import\\s*\\{\\s*apiUrl\\s*\\}\\s*from\\s*['\"]\\.\\.\\/core\\/firebase\\/origen-funciones\\.js(?:\\?[^'\"]+)?['\"]/.test(activity)`;
            if (source.includes(legacyImport)) source = source.replace(legacyImport, robustImport);
            source = source.replace(
              `functionOrigin.includes("CLOUDFLARE_FALLBACK_ORIGIN = 'https://tintinaccesorios.pages.dev'")`,
              `functionOrigin.includes("import { TINTIN_FUNCTIONS_FALLBACK_ORIGIN } from '../config/origenes-publicos.js'") &&\n  functionOrigin.includes('return TINTIN_FUNCTIONS_FALLBACK_ORIGIN')`
            );
            if (!source.includes(robustImport)) throw new Error('No se pudo adaptar el import de apiUrl en confiabilidad.');
            if (!source.includes(`functionOrigin.includes('return TINTIN_FUNCTIONS_FALLBACK_ORIGIN')`)) throw new Error('No se pudo adaptar el fallback centralizado en confiabilidad.');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/auditar-admin-fundamentos.js';
            let source = fs.readFileSync(file, 'utf8');
            const replacements = [
              [String.raw`/if \(!user\)\s*\{[^}]*login\.html/.test(adminApp)`, String.raw`/if \(!user\)\s*\{[^}]*\/login/.test(adminApp)`],
              [`adminApp.includes("window.location.href = 'perfil.html'")`, `adminApp.includes("window.location.href = '/perfil'")`],
              [`adminApp.includes('login.html?blocked=1')`, `adminApp.includes('/login?blocked=1')`],
              [String.raw`/catch\s*\(e\)\s*\{[\s\S]{0,220}window\.location\.href = 'login\.html'/.test(adminApp)`, String.raw`/catch\s*\(e\)\s*\{[\s\S]{0,220}window\.location\.href = '\/login'/.test(adminApp)`]
            ];
            for (const [from, to] of replacements) {
              if (source.includes(from)) source = source.replace(from, to);
              if (!source.includes(to)) throw new Error(`No se pudo adaptar auditor admin: ${from}`);
            }
            source = source
              .replace('Sin sesión se redirige a login.html', 'Sin sesión se redirige a /login')
              .replace('Un rol de cliente/sin rol se saca del panel a perfil.html', 'Un rol de cliente/sin rol se saca del panel a /perfil')
              .replace('Un usuario no autenticado debe terminar en login.html, nunca dentro del panel.', 'Un usuario no autenticado debe terminar en /login, nunca dentro del panel.')
              .replace('Solo roles de staff pueden ver el panel; el resto va a perfil.html.', 'Solo roles de staff pueden ver el panel; el resto va a /perfil.')
              .replace('Una cuenta con blocked=true debe cerrar sesión e ir a login.html?blocked=1.', 'Una cuenta con blocked=true debe cerrar sesión e ir a /login?blocked=1.');
            fs.writeFileSync(file, source);
          }

          {
            const file = 'scripts/auditar-admin-usuarios-roles.js';
            let source = fs.readFileSync(file, 'utf8');
            const from = String.raw`window\.location\.href = 'perfil\.html'`;
            const to = String.raw`window\.location\.href = '\/perfil'`;
            if (source.includes(from)) source = source.replace(from, to);
            if (!source.includes(to)) throw new Error('No se pudo adaptar el acceso por rol a /perfil.');
            fs.writeFileSync(file, source);
          }
          NODE

      - name: Excluir workflow temporal del árbol generado
        shell: bash
        run: |
          cp .github/workflows/finalizar-saneamiento-integral-temporal.yml /tmp/finalizar-saneamiento-integral-temporal.yml
          rm .github/workflows/finalizar-saneamiento-integral-temporal.yml

      - name: Sincronizar origen, rutas, caché, CSP y diagnósticos
        run: |
          npm run sync:public-origin
          npm run normalize:public-routes
          npm run cache-versioning:write
          npm run build:csp
          npm run build:diagnostics

      - name: Verificar origen público
        run: npm run verify:public-origin
      - name: Verificar rutas limpias
        run: npm run audit:public-routes
      - name: Verificar CSP reproducible
        run: npm run verify:csp
      - name: Verificar manifiesto diagnóstico
        run: npm run verify:diagnostics
      - name: Verificar operación edge
        run: npm run audit:edge
      - name: Verificar preparación de dominio
        run: npm run audit:cutover
      - name: Verificar versionado de caché
        run: npm run audit:cache-versioning

      - name: Revisar sintaxis del backend nuevo
        run: |
          node --check functions/api/health.js
          node --check functions/product.js
          node --check functions/sitemap-products.xml.js
          node --check scripts/auditar-produccion-salud.mjs

      - name: Compilar Pages Functions
        run: npx --yes wrangler@latest pages functions build functions --outdir=.cloudflare-functions --project-directory=.

      - name: Retirar artefacto temporal de Wrangler
        run: rm -rf .cloudflare-functions

      - name: SEO estático
        run: npm run audit:phase11
      - name: Seguridad
        run: npm run audit:security
      - name: Contrato checkout
        run: npm run test:checkout-contract
      - name: Contrato social
        run: npm run test:engagement
      - name: Dependencias productivas
        run: npm audit --omit=dev --audit-level=moderate

      - name: Auditoría integral estática
        id: audit_final
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run audit:final > audit-final.log 2>&1
          status=$?
          tail -n 240 audit-final.log
          exit "$status"

      - name: Guardar diagnóstico de auditoría integral
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-site-hardening-audit-final
          path: audit-final.log
          if-no-files-found: error
          retention-days: 7

      - name: Exigir auditoría integral verde
        run: test "${{ steps.audit_final.outcome }}" = "success"

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Servir árbol exacto y medir rendimiento público
        shell: bash
        run: |
          node scripts/servidor-local-pruebas.mjs 4173 > /tmp/tintin-hardening-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          PERF_BASE_URL=http://127.0.0.1:4173 npm run test:performance

      - name: Restaurar workflow temporal antes del commit
        run: cp /tmp/finalizar-saneamiento-integral-temporal.yml .github/workflows/finalizar-saneamiento-integral-temporal.yml

      - name: Commit atómico del árbol saneado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios generados.'
            exit 0
          fi
          git commit -m "chore: regenerar y validar saneamiento integral de la web"
          git push origin HEAD:chatgpt/full-site-hardening-20260814
