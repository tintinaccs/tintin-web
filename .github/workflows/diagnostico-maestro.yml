name: Diagnóstico de límite API para mantenimiento
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Leer únicamente los límites de la API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'const r=await fetch("https://api.github.com/rate_limit",{headers:{authorization:"Bearer "+process.env.GH_TOKEN,accept:"application/vnd.github+json"}});const b=await r.json();console.log(JSON.stringify({status:r.status,core:b.resources?.core}));'
