name: TEMP diagnose checkout smoke

on:
  push:
    branches:
      - fix/checkout-hardening-2026-08-22
    paths:
      - .github/workflows/temp-diagnose-checkout-smoke-20260822.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/checkout-hardening-2026-08-22
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Exponer stack de pageerror sin alterar el criterio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/smoke-todas-paginas.mjs')
          s = p.read_text(encoding='utf-8')
          old = '      pageErrors.push(message);'
          new = '      pageErrors.push(error.stack || message);'
          if old not in s:
              raise SystemExit('No se encontró captura pageerror esperada')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Instalar Chromium
        run: |
          sudo npx playwright install-deps chromium
          npx --yes --package=playwright@1.58.2 playwright install chromium
      - name: Ejecutar smoke con stacks
        run: npm run test:pages
