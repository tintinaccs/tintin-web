name: Temporary session shell cache sync

on:
  push:
    branches:
      - fix/sesion-shell-drawers-20260915

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip-shell-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/sesion-shell-drawers-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bump immutable cache tags and regenerate public shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'tintin-20260912-auth-closure-8': 'tintin-20260915-session-shell-2',
              'tintin-20260912-auth-closure-7': 'tintin-20260915-session-shell-2',
              'tintin-20260816-loader-shell-atomic-1': 'tintin-20260915-session-shell-2',
              'tintin-20260910-session-coordinator-1': 'tintin-20260915-session-coordinator-2',
          }

          # Canonical generator + runtime sources.
          paths = [
              Path('scripts/sincronizar-inicio-navegacion-publica.js'),
              Path('js/inicio-navegacion-publica.js'),
              Path('js/core/auth/navegacion-autenticacion.js'),
              Path('checkout.html'),
              Path('404.html'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          node scripts/sincronizar-inicio-navegacion-publica.js
          npm run build:csp
          npm run build:diagnostics
          npm run audit:cache-versioning
      - name: Commit generated source-of-truth artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'tintin-shell-sync'
          git config user.email 'tintin-shell-sync@users.noreply.github.com'
          git add -A
          git commit -m 'chore: regenerate shell cache versions [skip-shell-sync]'
          git push origin HEAD:fix/sesion-shell-drawers-20260915
